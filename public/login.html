<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoCheck — Revisor Login</title>
<link href="https://fonts.googleapis.com/css2?family=Kufam:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe8dc;
    --ink:#2a2438;
    --muted:#6a6178;
    --accent:#6d4fd8;
    --lilac:#d9d0f5;
    --border:rgba(42,36,56,0.10);
    --soft:rgba(255,255,255,0.55);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    font-weight:400;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  body::before,body::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:0;
    border-radius:50%;
    filter:blur(60px);
  }
  body::before{
    width:min(70vw,640px);
    height:min(70vw,640px);
    top:-12%;
    left:-8%;
    background:rgba(109,79,216,0.16);
    animation:drift 18s var(--ease) infinite alternate;
  }
  body::after{
    width:min(55vw,520px);
    height:min(55vw,520px);
    right:-10%;
    top:18%;
    background:rgba(217,208,245,0.55);
    animation:drift 22s var(--ease) infinite alternate-reverse;
  }
  #app{position:relative;z-index:1;}
  button,input,textarea,select{font-family:inherit;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes rise{from{opacity:0;transform:translateY(28px) scale(0.985)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(24px,18px)}}
  input:focus{border-color:rgba(109,79,216,0.4)!important;outline:none;box-shadow:0 0 0 4px rgba(109,79,216,0.12);}
  a,button{transition:transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), opacity .2s var(--ease), box-shadow .2s var(--ease);}
  button:not(:disabled):active{transform:translateY(1px);}
  a:hover,button:hover{opacity:0.94}
  button.primary:hover{opacity:1;transform:translateY(-1px);box-shadow:0 12px 28px rgba(109,79,216,0.22);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  ::placeholder{color:#9a92a8;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(90,80,120,0.18);border-radius:3px;}
  .pw-list{list-style:none;margin:10px 0 0;padding:12px 14px;background:rgba(255,255,255,0.55);border:1px solid var(--border);border-radius:16px;}
  .pw-list li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);line-height:1.6;}
  .pw-list li + li{margin-top:2px;}
  .pw-list li.ok{color:#1f7a4d;}
  .pw-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
  .otp{letter-spacing:0.35em;text-align:center;font-size:22px;font-weight:600;}
  .code-box{text-align:center;background:rgba(255,255,255,0.55);border:1px solid var(--border);border-radius:18px;padding:18px 16px;margin:0 0 18px;}
  .code-box .digits{font-size:28px;font-weight:600;letter-spacing:0.28em;color:var(--ink);margin-top:6px;font-family:'Kufam',system-ui,sans-serif;}
  .lc-nav-pill{
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.65);
    box-shadow:0 8px 32px rgba(42,36,56,0.06);
  }
  .lc-panel{
    background:rgba(255,255,255,0.72);
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    border:1px solid rgba(255,255,255,0.8);
    box-shadow:0 20px 60px rgba(42,36,56,0.08);
  }
  .lc-display{font-family:'Kufam',system-ui,sans-serif;}
  @media (max-width: 767px){
    body{overflow-x:hidden;}
    .login-shell{padding:0 16px!important;}
    .login-card{padding:22px!important;}
    .code-box{padding:14px 12px!important;}
    .code-box .digits{font-size:22px;letter-spacing:0.14em;}
    .otp{font-size:18px;letter-spacing:0.22em;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const C={deep:"#2a2438",mid:"#5b3fc4",accent:"#6d4fd8",light:"#6d4fd8",pale:"#6d4fd8",lilac:"#d9d0f5",surface:"#ffffff",card:"#ffffff",border:"rgba(42,36,56,0.10)",text:"#2a2438",muted:"#6a6178",white:"#ffffff",green:"#1f7a4d",greenBg:"rgba(238,247,241,0.9)",greenBorder:"rgba(31,122,77,0.18)",soft:"rgba(255,255,255,0.55)"};
const st={
  card:{background:"rgba(255,255,255,0.72)",border:"1px solid rgba(255,255,255,0.8)",borderRadius:28,padding:28,boxShadow:"0 20px 60px rgba(42,36,56,0.08)"},
  btn:{fontFamily:"inherit",cursor:"pointer",border:"none",borderRadius:999,fontWeight:600,transition:"transform 0.2s cubic-bezier(0.22,1,0.36,1), opacity 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s"},
  label:{fontSize:13,fontWeight:500,letterSpacing:"-0.01em",textTransform:"none",color:C.muted,marginBottom:8,display:"block"},
  inp:{width:"100%",background:"rgba(255,255,255,0.7)",border:`1px solid ${C.border}`,borderRadius:18,padding:"12px 16px",fontFamily:"inherit",fontSize:15,color:C.text,lineHeight:1.4,boxSizing:"border-box",letterSpacing:"-0.2px"},
  muted:{fontSize:15,color:C.muted,lineHeight:1.7,letterSpacing:"-0.2px"}
};

function styleStr(obj){return Object.entries(obj).map(([k,v])=>`${k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}:${v}`).join(';');}

async function apiFetch(path,opts={}) {
  const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});
  const data=await r.json().catch(()=> ({}));
  if(!r.ok) throw new Error(data.error||"Request failed");
  return data;
}

function qs(sel){return document.querySelector(sel);}

const PW_RULES = [
  {id:"length", label:"At least 12 characters", test:p=>p.length>=12},
  {id:"upper", label:"An uppercase letter (A–Z)", test:p=>/[A-Z]/.test(p)},
  {id:"lower", label:"A lowercase letter (a–z)", test:p=>/[a-z]/.test(p)},
  {id:"number", label:"A number (0–9)", test:p=>/[0-9]/.test(p)},
  {id:"special", label:"A special character (!@#$…)", test:p=>/[^A-Za-z0-9]/.test(p)}
];

function passwordChecks(p){
  const value=String(p||"");
  const out={};
  for(const rule of PW_RULES) out[rule.id]=rule.test(value);
  return out;
}

function isStrongPassword(p){
  const c=passwordChecks(p);
  return PW_RULES.every(rule=>c[rule.id]);
}

function isValidEmail(value){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value||"").trim());
}

let mode = "login"; // login | signup | 2fa-verify
let otpInfo = null;

function shell(inner){
  return `
    <div class="login-shell" style="max-width:520px;margin:0 auto;padding:20px 20px 48px;">
      <div class="lc-nav-pill" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:999px;margin-bottom:28px;gap:12px;">
        <div class="lc-display" style="font-size:20px;font-weight:600;color:${C.text};letter-spacing:-0.02em;padding-left:6px">Lingo<span style="color:${C.accent}">Check</span></div>
        <a href="/" style="text-decoration:none;font-size:13px;font-weight:600;color:${C.muted};border:1px solid ${C.border};padding:8px 14px;border-radius:999px;background:rgba(255,255,255,0.7);white-space:nowrap;">← Back to portal</a>
      </div>
      <div class="login-card lc-panel" style="animation:rise .55s cubic-bezier(0.22,1,0.36,1);border-radius:28px;padding:28px;${styleStr(st.card)}">${inner}</div>
    </div>
  `;
}

function renderPasswordChecklist(password){
  const checks=passwordChecks(password);
  return `<ul class="pw-list">${PW_RULES.map(rule=>{
    const ok=!!checks[rule.id];
    return `<li class="${ok?"ok":""}" data-rule="${rule.id}"><span class="pw-dot">${ok?"✓":""}</span>${rule.label}</li>`;
  }).join("")}</ul>`;
}

function bindPasswordChecklist(input){
  const update=()=>{
    const checks=passwordChecks(input.value);
    document.querySelectorAll(".pw-list li").forEach(li=>{
      const ok=!!checks[li.dataset.rule];
      li.classList.toggle("ok", ok);
      const dot=li.querySelector(".pw-dot");
      if(dot) dot.textContent=ok?"✓":"";
    });
    const btn=qs("#btn");
    if(btn && mode==="signup") btn.disabled=!isStrongPassword(input.value);
  };
  input.addEventListener("input", update);
  input.addEventListener("keyup", update);
  update();
}

function render(){
  const root = qs("#app");
  if(mode==="2fa-verify"){
    const delivered = !!otpInfo?.delivered;
    root.innerHTML = shell(`
      <div class="lc-display" style="font-size:28px;font-weight:400;color:${C.text};margin-bottom:8px;letter-spacing:-0.02em">Check your email</div>
      <div style="${styleStr(st.muted)};margin-bottom:18px">We sent a 6-digit code to <strong style="color:${C.text}">${otpInfo?.emailMasked || "your email"}</strong>. Enter it below — it expires in 10 minutes.</div>
      ${delivered?"":`
        <div class="code-box">
          <div style="font-size:12px;font-weight:500;color:${C.muted}">Email isn’t set up yet — use this code</div>
          <div class="digits" id="shownCode">${otpInfo?.code || "••••••"}</div>
        </div>
      `}
      <label style="${styleStr(st.label)}" for="code">Email code</label>
      <input id="code" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="${styleStr(st.inp)}" />
      <div id="err" style="display:none;margin-top:14px;font-size:12px;color:#c43d3d"></div>
      <button id="btn" class="primary" style="margin-top:18px;${styleStr(st.btn)};width:100%;padding:15px;background:${C.accent};font-size:15px;color:${C.white}">Verify</button>
      <button id="resend" style="margin-top:10px;${styleStr(st.btn)};width:100%;padding:10px;background:transparent;border:1px solid ${C.border};color:${C.muted};font-size:13px">Send a new code</button>
      <button id="back" style="margin-top:8px;${styleStr(st.btn)};width:100%;padding:10px;background:transparent;border:none;color:${C.muted};font-size:13px">← Back to login</button>
    `);
    qs("#back").addEventListener("click", ()=>{ mode="login"; otpInfo=null; render(); });
    bindVerify();
    return;
  }

  const isLogin = mode === "login";
  root.innerHTML = shell(`
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="lc-display" style="font-size:28px;font-weight:400;color:${C.text};letter-spacing:-0.02em;line-height:1.15">${isLogin?"Welcome back":"Join as a revisor"}</div>
        </div>
        <div style="${styleStr(st.muted)};margin-bottom:22px">
          ${isLogin?"Sign in to pick up jobs and finish careful reviews.":"Create an account to claim translations and get paid for your work."}
        </div>

        <div style="display:flex;gap:8px;margin-bottom:18px">
          <button id="tabLogin" style="${styleStr(st.btn)};flex:1;padding:10px;font-size:13px;background:${isLogin?C.lilac:"transparent"};border:1px solid ${isLogin?"rgba(109,79,216,0.28)":C.border};color:${isLogin?C.accent:C.muted}">Log in</button>
          <button id="tabSignup" style="${styleStr(st.btn)};flex:1;padding:10px;font-size:13px;background:${!isLogin?C.lilac:"transparent"};border:1px solid ${!isLogin?"rgba(109,79,216,0.28)":C.border};color:${!isLogin?C.accent:C.muted}">Sign up</button>
        </div>

        ${!isLogin ? `
          <label style="${styleStr(st.label)}">Display name</label>
          <input id="dn" autocomplete="name" style="${styleStr(st.inp)}" placeholder="e.g. Anna Janssen" />
          <div style="height:12px"></div>
        `:""}

        <label style="${styleStr(st.label)}" for="email">Email</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" required style="${styleStr(st.inp)}" placeholder="you@example.com" />
        <div style="height:12px"></div>

        <label style="${styleStr(st.label)}" for="p">Password</label>
        <input id="p" type="password" autocomplete="${isLogin?"current-password":"new-password"}" style="${styleStr(st.inp)}" placeholder="${isLogin?"Enter your password":"Create a strong password"}" />
        ${renderPasswordChecklist("")}

        <div id="err" style="display:none;margin-top:14px;font-size:12px;color:#c43d3d"></div>
        <button id="btn" class="primary" ${isLogin?"":"disabled"} style="margin-top:18px;${styleStr(st.btn)};width:100%;padding:15px;background:${C.accent};font-size:15px;color:${C.white}">
          ${isLogin?"Log in":"Create account"}
        </button>

        <div style="margin-top:16px;font-size:13px;color:${C.muted};line-height:1.65">
          ${isLogin?"We’ll email a short code to confirm it’s really you.":"Next we’ll email a short code. Revisors earn <strong style=\"color:"+C.text+"\">€0.025</strong> per source word."}
        </div>
  `);

  const email=qs("#email"), p=qs("#p"), err=qs("#err"), btn=qs("#btn");
  const dn=qs("#dn");

  qs("#tabLogin").addEventListener("click", ()=>{ mode="login"; render(); });
  qs("#tabSignup").addEventListener("click", ()=>{ mode="signup"; render(); });
  bindPasswordChecklist(p);

  function showError(message){
    err.textContent=message;
    err.style.display="block";
  }

  async function submit(){
    err.style.display="none";
    const emailValue = (email.value||"").trim();
    const password = p.value||"";
    if(!emailValue){
      showError("Email address is required.");
      email.focus();
      return;
    }
    if(!isValidEmail(emailValue)){
      showError("Enter a valid email address.");
      email.focus();
      return;
    }
    if(!password){
      showError("Password is required.");
      p.focus();
      return;
    }
    if(!isStrongPassword(password)){
      showError("Password does not meet all requirements yet.");
      p.focus();
      return;
    }
    btn.disabled=true;
    btn.textContent= isLogin ? "Logging in…" : "Creating…";
    try{
      if(isLogin){
        const data=await apiFetch("/api/auth/login",{method:"POST",body:JSON.stringify({email:emailValue,password})});
        if(data.requires2fa){ otpInfo={code:data.code, emailMasked:data.emailMasked, delivered:!!data.delivered}; mode="2fa-verify"; render(); return; }
        location.href="/revisor";
        return;
      }
      const data=await apiFetch("/api/auth/signup",{method:"POST",body:JSON.stringify({email:emailValue,displayName:(dn?.value||"").trim(),password})});
      otpInfo={code:data.code, emailMasked:data.emailMasked, delivered:!!data.delivered};
      mode="2fa-verify";
      render();
    }catch(e){
      showError(e.message);
      btn.disabled=!isLogin && !isStrongPassword(password);
      btn.textContent= isLogin ? "Log in" : "Create account";
    }
  }
  btn.addEventListener("click",submit);
  p.addEventListener("keydown",ev=>{ if(ev.key==="Enter") submit(); });
  if(dn) dn.addEventListener("keydown",ev=>{ if(ev.key==="Enter") email.focus(); });
  email.addEventListener("keydown",ev=>{ if(ev.key==="Enter") p.focus(); });
}

function bindVerify(){
  const code=qs("#code"), err=qs("#err"), btn=qs("#btn"), resend=qs("#resend");
  function showError(message){
    err.textContent=message;
    err.style.display="block";
  }
  async function submit(){
    err.style.display="none";
    const value=(code.value||"").replace(/\s/g,"");
    if(!/^\d{6}$/.test(value)){
      showError("Enter the 6-digit code from your email.");
      code.focus();
      return;
    }
    btn.disabled=true;
    btn.textContent="Verifying…";
    try{
      await apiFetch("/api/auth/2fa/verify",{method:"POST",body:JSON.stringify({code:value})});
      location.href="/revisor";
    }catch(e){
      showError(e.message);
      btn.disabled=false;
      btn.textContent="Verify";
    }
  }
  async function sendNew(){
    err.style.display="none";
    resend.disabled=true;
    try{
      const data=await apiFetch("/api/auth/2fa/resend",{method:"POST",body:"{}"});
      otpInfo={code:data.code, emailMasked:data.emailMasked, delivered:!!data.delivered};
      mode="2fa-verify";
      render();
    }catch(e){
      showError(e.message);
      resend.disabled=false;
    }
  }
  btn.addEventListener("click",submit);
  resend.addEventListener("click",sendNew);
  code.addEventListener("input",()=>{ code.value=code.value.replace(/\D/g,"").slice(0,6); });
  code.addEventListener("keydown",ev=>{ if(ev.key==="Enter") submit(); });
  code.focus();
}

async function boot(){
  try{
    const me=await apiFetch("/api/auth/me",{method:"GET"});
    if(me.authenticated){ location.href="/revisor"; return; }
  }catch{}
  render();
}

boot();
</script>
</body>
</html>
