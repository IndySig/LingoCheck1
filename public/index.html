function formatEuro(amount){
  const n = Math.round(Number(amount || 0) * 100) / 100;
  return "€" + n.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getClientId(){
  let id=localStorage.getItem("lc_cid");
  if(id && /^[A-Za-z0-9_-]{6,64}$/.test(id)) return id;
  const bytes=new Uint8Array(16);
  crypto.getRandomValues(bytes);
  id=Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
  localStorage.setItem("lc_cid",id);
  return id;
}

function isValidEmail(value){
  return /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/i.test(String(value||"").trim());
}

function savedEmail(){
  try{ return String(localStorage.getItem("lc_email")||""); }catch{ return ""; }
}

async function apiFetch(path,opts={}){
  const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||(r.status===429?"Too many requests. Please wait and try again.":"Request failed"));
  return data;
}

function honeypotValue(){

function Spinner({size=18}){return React.createElement("span",{style:{display:"inline-block",width:size,height:size,border:"2px solid rgba(109,79,216,0.18)",borderTopColor:C.accent,borderRadius:"50%",animation:"spin 0.55s linear infinite",verticalAlign:"middle"}});}

function useMedia(query){
  const [matches,setMatches]=useState(()=>window.matchMedia?window.matchMedia(query).matches:false);
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq=window.matchMedia(query);
    const onChange=()=>setMatches(mq.matches);
    onChange();
    if(mq.addEventListener) mq.addEventListener("change",onChange);
    else mq.addListener(onChange);
    return()=>{
      if(mq.removeEventListener) mq.removeEventListener("change",onChange);
      else mq.removeListener(onChange);
    };
  },[query]);
  return matches;
}

async function fileToArrayBuffer(file){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsArrayBuffer(file);});
}

function arrayBufferToBase64(buf){
  const bytes = new Uint8Array(buf);
  let binary = "";
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}

function base64ToUint8Array(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function escapeXml(s){
  return String(s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll("\"","&quot;")
    .replaceAll("'","&apos;");
}

async function makeDocxBlobFromText(text){
  if(!window.JSZip) throw new Error("DOCX support not loaded");
  const zip = new JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
  <Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>
</Types>`);

  zip.folder("_rels").file(".rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
  <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>
</Relationships>`);

  const lines = String(text||"").split(/\n{2,}/g).map(s=>s.trim()).filter(Boolean);
  const paras = (lines.length?lines:[String(text||"").trim()]).map(p=>{
    const run = escapeXml(p).split(/\n/g).map(x=>x.trim()).filter(Boolean).join(" ");
    return `<w:p><w:r><w:t xml:space="preserve">${run}</w:t></w:r></w:p>`;
  }).join("");

  zip.folder("word").file("document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paras}
    <w:sectPr/>
  </w:body>
</w:document>`);

  zip.folder("word").folder("_rels").file("document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`);

  const now = new Date().toISOString();
  zip.folder("docProps").file("core.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"
 xmlns:dc="http://purl.org/dc/elements/1.1/"
 xmlns:dcterms="http://purl.org/dc/terms/"
 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <dc:title>Translation</dc:title>
  <dc:creator>LingoCheck</dc:creator>
  <cp:lastModifiedBy>LingoCheck</cp:lastModifiedBy>
  <dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created>
  <dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified>
</cp:coreProperties>`);

  zip.folder("docProps").file("app.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"
 xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">
  <Application>LingoCheck</Application>
</Properties>`);

  const buf = await zip.generateAsync({ type: "uint8array" });
  return new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

function decodeXmlText(s){
  return String(s||"")
    .replace(/&amp;/g,"&")
    .replace(/&lt;/g,"<")
    .replace(/&gt;/g,">")
    .replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'");
}

function collectDocxParagraphTexts(xmlStr){
  const texts = [];
  const re = /<w:p\b[\s\S]*?<\/w:p>/g;
  let m;
  while((m = re.exec(xmlStr))){
    const parts = [...m[0].matchAll(/<w:t\b[^>]*>([\s\S]*?)<\/w:t>/g)].map(x=>decodeXmlText(x[1]));
    const text = parts.join("").replace(/\s+/g," ").trim();
    if(text) texts.push(text);
  }
  return texts;
}

function alignTranslatedParagraphs(translated, originalTexts){
  var TS = window.LcTextSegments;
  var originals = TS
    ? TS.normalizeDocumentSegments(originalTexts || [])
    : (originalTexts||[]).map(function(s){ return String(s||"").trim(); }).filter(Boolean);
  if(!originals.length) return [String(translated||"").trim()];
  var n = originals.length;
  var text = String(translated||"").trim();
  if(!text) return Array.from({length:n}, function(){ return ""; });

  var parts = text.split(/\n{2,}/).map(function(s){ return s.trim(); }).filter(Boolean);
  if(parts.length === n) return parts;

  if(parts.length > n){
    var out = [];
    var j = 0;
    for(var i=0;i<n;i++){
      if(i === n - 1){
        out.push(parts.slice(j).join("\n\n"));
        break;
      }
      var remaining = parts.length - j;
      var slotsLeft = n - i;
      var weights = originals.slice(i).map(function(s){ return Math.max(1, String(s).replace(/\s+/g,"").length); });
      var weightLeft = weights.reduce(function(a,b){ return a+b; }, 0) || 1;
      var take = Math.max(1, Math.round(remaining * (weights[0] / weightLeft)));
      take = Math.min(take, remaining - (slotsLeft - 1));
      out.push(parts.slice(j, j + take).join("\n\n"));
      j += take;
    }
    return out;
  }

  var weights = originals.map(function(s){ return Math.max(1, String(s).replace(/\s+/g,"").length); });
  return splitTextByWeights(text.replace(/\n+/g, " "), weights);
}

function replaceDocxParagraphTexts(xmlStr, newTexts){
  let slot = 0;
  return xmlStr.replace(/<w:p\b[\s\S]*?<\/w:p>/g, block=>{
    const found = [...block.matchAll(/<w:t\b([^>]*)>([\s\S]*?)<\/w:t>/g)];
    if(!found.length) return block;
    const original = found.map(x=>decodeXmlText(x[2])).join("").replace(/\s+/g," ").trim();
    if(!original) return block;
    const next = newTexts[slot] || "";
    slot += 1;
    let used = false;
    return block.replace(/<w:t\b([^>]*)>([\s\S]*?)<\/w:t>/g, (full, attrs)=>{
      if(!used){
        used = true;
        const a = /xml:space\s*=/.test(attrs) ? attrs : `${attrs} xml:space="preserve"`;
        return `<w:t${a}>${escapeXml(next)}</w:t>`;
      }
      return `<w:t${attrs}></w:t>`;
    });
  });
}

async function makeStyledDocxBlobFromTemplate(templateDocxB64, translatedText, originalSegments){
  if(!window.JSZip) throw new Error("DOCX support not loaded");
  var bytes = base64ToUint8Array(templateDocxB64);
  var zip = await JSZip.loadAsync(bytes);
  var docFile = zip.file("word/document.xml");
  if(!docFile) throw new Error("DOCX template missing document.xml");
  var xmlStr = await docFile.async("string");
  var originals = (originalSegments && originalSegments.length)
    ? originalSegments
    : collectDocxParagraphTexts(xmlStr);
  var slots = alignTranslatedParagraphs(translatedText, originals);
  zip.file("word/document.xml", replaceDocxParagraphTexts(xmlStr, slots));
  var out = await zip.generateAsync({ type:"uint8array", compression:"DEFLATE", compressionOptions:{ level:6 } });
  return new Blob([out], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

function winAnsiSafe(s){
  return String(s||"").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, "?");
}

function wrapPdfLine(font, str, fontSize, maxWidth){
  const words = String(str||"").split(/\s+/).filter(Boolean);
  if(!words.length) return [""];
  const lines = [];
  let cur = "";
  for(const w of words){
    const test = cur ? (cur + " " + w) : w;
    const width = font.widthOfTextAtSize(test, fontSize);
    if(width <= maxWidth){
      cur = test;
    }else{
      if(cur) lines.push(cur);
      cur = w;
    }
  }
  if(cur) lines.push(cur);
  return lines;
}

function splitTextByWeights(text, weights){
  const words = String(text||"").split(/\s+/).filter(Boolean);
  if(!weights.length) return [words.join(" ")];
  const total = weights.reduce((a,b)=>a+b,0) || 1;
  const result = [];
  let idx = 0;
  for(let i=0;i<weights.length;i++){
    const take = i === weights.length-1
      ? words.length - idx
      : Math.max(0, Math.round(words.length * (weights[i] / total)));
    result.push(words.slice(idx, idx + take).join(" "));
    idx += take;
  }
  if(idx < words.length && result.length){
    result[result.length-1] = [result[result.length-1], words.slice(idx).join(" ")].filter(Boolean).join(" ");
  }
  return result;
}

function drawPdfSlotText(page, font, text, slot){
  var safe = winAnsiSafe(String(text||"").trim());
  var fontSize = slot.fontSize || 11;
  var pad = 4;
  var blockX = Math.max(0, slot.x - pad);
  var maxW = Math.max(30, (slot.x2 - slot.x) || 200);
  var topY = slot.topY || slot.y2 || slot.y;
  var minH = fontSize * 1.5;
  if(!safe){
    page.drawRectangle({ x:blockX, y:topY - minH - pad, width:maxW + pad*2, height:minH + pad*2, color:PDFLib.rgb(1,1,1) });
    return;
  }
  var wrapped = wrapPdfLine(font, safe, fontSize, maxW);
  var lineH = fontSize * 1.25;
  var textH = wrapped.length * lineH;
  var rectH = Math.max(minH, textH) + pad * 2;
  page.drawRectangle({ x:blockX, y:topY - textH - pad, width:maxW + pad*2, height:rectH, color:PDFLib.rgb(1,1,1) });
  var y = topY;
  for(var i=0;i<wrapped.length;i++){
    if(!wrapped[i]) continue;
    var sz = fontSize;
    while(sz > 5 && font.widthOfTextAtSize(wrapped[i], sz) > maxW) sz -= 0.25;
    page.drawText(wrapped[i], { x:slot.x, y:y, size:sz, font:font, color:PDFLib.rgb(0,0,0) });
    y -= lineH;
  }
}

async function makeStyledPdfBlobFromTemplate(templatePdfB64, translatedText, originalSegments){
  if(!window.pdfjsLib || !window.PDFLib) throw new Error("PDF support not loaded");
  if(!window.LcDocExtract || !LcDocExtract.extractPdfReplaceLayout) throw new Error("Document parser not loaded");
  var bytes = base64ToUint8Array(templatePdfB64);
  var layout = await LcDocExtract.extractPdfReplaceLayout(bytes);
  if(!layout.pages.some(function(p){ return p.slots && p.slots.length; })){
    return { blob: await makePdfBlobFromText(translatedText), mode: "clean", reason: "no layout" };
  }

  var assessment = LcDocExtract.assessPdfLayoutPreserve
    ? LcDocExtract.assessPdfLayoutPreserve(layout)
    : { viable: false, reason: "complex layout" };
  if(!assessment.viable){
    return { blob: await makePdfBlobFromText(translatedText), mode: "clean", reason: assessment.reason || "complex layout" };
  }

  var slotTexts = (layout.slotTexts && layout.slotTexts.length)
    ? layout.slotTexts
    : layout.pages.flatMap(function(p){ return (p.slots || []).map(function(s){ return s.text; }); });
  var originals = (originalSegments && originalSegments.length)
    ? originalSegments
    : (layout.segments && layout.segments.length ? layout.segments : slotTexts);
  var transParts = alignTranslatedParagraphs(translatedText, originals);
  var pdfDoc = await PDFLib.PDFDocument.load(bytes);
  var font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  var pages = pdfDoc.getPages();
  var allSlots = layout.pages.flatMap(function(p){ return p.slots || []; });

  if(originals.length !== slotTexts.length && LcDocExtract.assignPdfSlotsToSegments){
    var groups = LcDocExtract.assignPdfSlotsToSegments(allSlots, originals);
    var pageStarts = [];
    var offset = 0;
    layout.pages.forEach(function(pageLayout){
      pageStarts.push(offset);
      offset += (pageLayout.slots || []).length;
    });
    groups.forEach(function(group, segIndex){
      if(!group.length) return;
      var slotPos = allSlots.indexOf(group[0]);
      var pageIndex = 0;
      for(var pi = pageStarts.length - 1; pi >= 0; pi--){
        if(slotPos >= pageStarts[pi]){ pageIndex = pi; break; }
      }
      var page = pages[pageIndex];
      if(!page) return;
      var bounds = LcDocExtract.mergePdfSlotBounds(group);
      if(bounds) drawPdfSlotText(page, font, transParts[segIndex] || "", bounds);
    });
  }else{
    var slotIdx = 0;
    layout.pages.forEach(function(pageLayout, pageIndex){
      var page = pages[pageIndex];
      if(!page || !pageLayout.slots) return;
      pageLayout.slots.forEach(function(slot){
        drawPdfSlotText(page, font, transParts[slotIdx] || "", slot);
        slotIdx += 1;
      });
    });
  }

  var out = await pdfDoc.save();
  return { blob: new Blob([out], { type: "application/pdf" }), mode: "layout" };
}

async function makePdfBlobFromText(text){
  if(!window.PDFLib) throw new Error("PDF export not loaded");
  const { PDFDocument, StandardFonts } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontSize = 11;
  const margin = 50;
  const lineHeight = 14;

  function wrapLine(str, maxWidth){
    const words = str.split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = "";
    for(const w of words){
      const test = cur ? (cur + " " + w) : w;
      const width = font.widthOfTextAtSize(test, fontSize);
      if(width <= maxWidth){
        cur = test;
      }else{
        if(cur) lines.push(cur);
        cur = w;
      }
    }
    if(cur) lines.push(cur);
    return lines;
  }

  const paragraphs = String(text||"").split(/\n{2,}/g);
  let page = pdfDoc.addPage();
  let { width, height } = page.getSize();
  let y = height - margin;
  const maxWidth = width - margin*2;

  for(const para of paragraphs){
    const raw = para.replace(/\s+/g," ").trim();
    const lines = raw ? wrapLine(raw, maxWidth) : [""];
    for(const line of lines){
      if(y < margin){
        page = pdfDoc.addPage();
        ({ width, height } = page.getSize());
        y = height - margin;
      }
      page.drawText(line, { x: margin, y, size: fontSize, font, color: PDFLib.rgb(0,0,0) });
      y -= lineHeight;
    }
    y -= lineHeight; // paragraph gap
  }

  const bytes = await pdfDoc.save();
  return new Blob([bytes], { type: "application/pdf" });
}

  function buildSentencePackFromInput(){

  async function handleTranslate(){

        text: inputText.trim(),
        language,
        sentences: pack ? pack.sentences : undefined,
        sentenceParaMap: pack ? pack.paraMap : undefined,
        ...botFields()
      });
      if(!challengeRef.current) await refreshChallenge();
      let data;
      try{
        data=await apiFetch("/api/translate",{method:"POST",body:JSON.stringify(payload())});
      }catch(first){
        const msg=String(first.message||"");
        if(/Verification expired|Confirm you are human/i.test(msg)){
          await refreshChallenge();
          data=await apiFetch("/api/translate",{method:"POST",body:JSON.stringify(payload())});
        }else throw first;
      }
      setAiResult(data.translation);
      if(
        pack &&
        Array.isArray(data.translationSentences) &&
        data.translationSentences.length === pack.sentences.length
      ){
        sentencePackRef.current = {
          ...pack,
          translationSentences: data.translationSentences

  function applyExtractedText(raw, segments, file, sourceExt, baseReason){
    const DX = window.LcDocExtract;
    const TS = window.LcTextSegments;
    const segs = TS
      ? TS.normalizeDocumentSegments((Array.isArray(segments) && segments.length) ? segments : raw)
      : (Array.isArray(segments) && segments.length ? segments : String(raw||"").split(/\n{2,}/).map(s => s.trim()).filter(Boolean));
    const text = DX ? DX.truncateExtractedText(TS ? TS.segmentsToDisplayText(segs) : segs.join("\n\n")) : String(raw||"").slice(0, 25000);
    const truncated = String(raw||"").length > text.length;
    textSegmentsRef.current = segs;
    setInputText(text);
    setFileScan({
      name: file.name,
      fit: true,
      reason: truncated ? baseReason + " (truncated to 25,000 characters)" : baseReason
    });
    setSourceFile({ name: file.name, ext: sourceExt });
  }

  async function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    setError("");setFileScan(null);setSourceFile(null);sourceFileB64Ref.current=null;textSegmentsRef.current=[];sentencePackRef.current=null;
    const name=(file.name||"").toLowerCase();
    const max=10*1024*1024;
    if(file.size>max){setError("File too large (max 10 MB).");return;}
    setFileBusy(true);
    try{
      const DX = window.LcDocExtract;
      if(!DX) throw new Error("Document parser not loaded");
      if(name.endsWith(".txt")||name.endsWith(".md")){
        const reader=new FileReader();
        reader.onload=ev=>{
          const raw=String(ev.target.result||"");
          const parsed=DX.extractPlainText(raw);
          applyExtractedText(parsed.text, parsed.segments, file, name.endsWith(".md")?"md":"txt", "Text file");
          setFileBusy(false);
        };
        reader.onerror=()=>{setError("Could not read file.");setFileBusy(false);};
        reader.readAsText(file);
        return;
      }
      if(name.endsWith(".pdf")){
        const buf = await fileToArrayBuffer(file);
        const r=await DX.extractPdfText(buf);
        if(r.isScannedLike || !r.text){
          setFileScan({name:file.name,fit:false,reason:"PDF has no usable text layer (likely scanned)."});
          setInputText("");
          return;
        }
        const reason = r.hasImages
          ? "Text extracted; images will be kept on download."
          : "PDF text extracted";
        applyExtractedText(r.text, r.segments, file, "pdf", reason);
        const fileB64=arrayBufferToBase64(buf);
        sourceFileB64Ref.current=fileB64;
        setSourceFile(prev=>({...prev, fileB64}));
        return;
      }
      if(name.endsWith(".docx")){
        const buf = await fileToArrayBuffer(file);
        const r=await DX.extractDocxText(buf);
        if(r.blocked){
          setFileScan({name:file.name,fit:false,reason:"Word document contains macros or executable content."});
          setInputText("");
          return;
        }
        if(!r.text){
          setFileScan({name:file.name,fit:false,reason:"Word document has no extractable text."});
          setInputText("");
          return;
        }
        const reason = (r.hasImages||r.hasDrawing)
          ? "Text extracted; images will be kept on download."
          : "Word text extracted";
        applyExtractedText(r.text, r.segments, file, "docx", reason);
        const fileB64=arrayBufferToBase64(buf);
        sourceFileB64Ref.current=fileB64;
        setSourceFile(prev=>({...prev, fileB64}));
        return;
      }
      setError("Unsupported file type. Upload .txt, .md, .docx, or .pdf.");
    }catch(err){
      setError("Could not process file: "+(err.message||"Unknown error"));
    }finally{
      setFileBusy(false);
    }
  }

  async function getSourceFileB64(meta){
    if(meta?.fileB64) return meta.fileB64;
    if(meta?.docxB64) return meta.docxB64;
    if(sourceFileB64Ref.current) return sourceFileB64Ref.current;
    if(!currentJob?.id) return null;
    try{
      const data=await apiFetch("/api/jobs/"+encodeURIComponent(currentJob.id)+"/source?"+jobAccessQuery());
      if(data?.fileB64) sourceFileB64Ref.current=data.fileB64;
      return data?.fileB64 || null;
    }catch{
      return null;
    }
  }

  async function downloadTranslated(){
    setDownloadNote("");
    const meta = currentJob.sourceFile || { name:"translation.txt", ext:"txt" };
    const baseName = (meta.name||"translation").replace(/\.[^.]+$/,"");
    const ext = (meta.ext||"txt").toLowerCase();
    const text = currentJob.revisedTranslation||"";
    const finalName = `${baseName}-translated.${ext}`;
    if(ext==="txt"||ext==="md"){
      return downloadBlob(new Blob([text],{type:"text/plain;charset=utf-8"}), finalName);
    }
    const segments = currentJob.originalSegments || null;
    const fileB64 = await getSourceFileB64(meta);
    if(!fileB64) throw new Error("Original file is unavailable. Open the link from your email and try again.");
    if(ext==="docx"){
      try{
        const blob = await makeStyledDocxBlobFromTemplate(fileB64, text, segments);
        return downloadBlob(blob, finalName);
      }catch(err){
        console.warn("Styled DOCX download failed, falling back to plain text:", err);
        setDownloadNote("Word layout could not be preserved; downloaded as plain text instead.");
        return downloadBlob(new Blob([text],{type:"text/plain;charset=utf-8"}), `${baseName}-translated.txt`);
      }
    }
    if(ext==="pdf"){
      try{
        const result = await makeStyledPdfBlobFromTemplate(fileB64, text, segments);
        const blob = result && result.blob ? result.blob : result;
        if(result && result.mode === "clean"){
          setDownloadNote("This manual has a complex layout (columns, diagrams, side notes). Downloaded as a clean readable PDF. Diagrams and original formatting are not included — use your original file alongside this translation.");
        }
        return downloadBlob(blob, finalName);
      }catch(err){
        console.warn("Styled PDF download failed, falling back to plain PDF:", err);
        setDownloadNote("Layout could not be preserved; downloaded as a clean readable PDF instead.");
        const blob = await makePdfBlobFromText(text);
        return downloadBlob(blob, finalName);
      }
    }
    return downloadBlob(new Blob([text],{type:"text/plain;charset=utf-8"}), `${baseName}-translated.txt`);
  }

              flowLabel,
              e("div",{style:{display:"flex",flexDirection:"row",alignItems:"flex-start",gap:4,width:"100%"}},...items)
            );
          })()
        ),

        e("div",null,
          e("label",{htmlFor:"use-own-ai",style:{display:"flex",alignItems:"flex-start",gap:10,marginBottom:14,cursor:"pointer",userSelect:"none",padding:"12px 14px",background:useOwnAi?"rgba(109,79,216,0.06)":C.soft,border:`1px solid ${useOwnAi?"rgba(109,79,216,0.28)":C.border}`,borderRadius:12}},
            e("input",{id:"use-own-ai",type:"checkbox",checked:useOwnAi,onChange:onToggleOwnAi,style:{marginTop:3,width:16,height:16,accentColor:C.accent,flexShrink:0,cursor:"pointer"}}),
            e("span",null,
              e("span",{style:{display:"block",fontSize:13,fontWeight:600,color:C.text,marginBottom:3}},"Use own AI translation for LingoCheck"),
              e("span",{style:{display:"block",fontSize:12,color:C.muted,lineHeight:1.45}},useOwnAi?"Quality check only — we will not generate a new translation.":"Leave unchecked to let LingoCheck translate first, then send to a revisor.")
            )
          ),
        e("div",{style:{...cardStyle(),border:useOwnAi?"1px solid rgba(109,79,216,0.28)":st.card.border}},
          e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:12,flexWrap:"wrap"}},
            e("span",{style:st.label},useOwnAi?"Your translation":"Your text"),
            useOwnAi&&e("span",{style:{fontSize:10,fontWeight:600,letterSpacing:"0.8px",textTransform:"uppercase",color:C.accent,background:"rgba(109,79,216,0.08)",border:"1px solid rgba(109,79,216,0.18)",padding:"4px 10px",borderRadius:999}},"QA only")
          ),
          useOwnAi
            ?e("div",{style:{background:C.amberBg,border:`1px solid ${C.amberBorder}`,borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:12,color:C.amber,lineHeight:1.55}},"Paste or upload the translation you already have. A certified translator will proofread it. LingoCheck will not run its own AI translation.")
            :null,
          useOwnAi
            ?e("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:16}},
              e("span",{style:{fontSize:12,color:C.muted,whiteSpace:"nowrap"}},"Translation language"),
              e("select",{value:language,onChange:ev=>setLanguage(ev.target.value),style:{flex:1,background:C.soft,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 14px",fontFamily:"inherit",fontSize:13,fontWeight:600,color:C.text,outline:"none",cursor:"pointer"}},
                e("option",null,"Dutch"),e("option",null,"Spanish"),e("option",null,"German")
              )
            )
            :e("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:16}},
              e("div",{style:{background:C.soft,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 14px",fontSize:13,color:C.muted}},"English"),
              e("span",{style:{color:C.accent,fontSize:18}},"→"),
              e("select",{value:language,onChange:ev=>setLanguage(ev.target.value),style:{flex:1,background:C.soft,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 14px",fontFamily:"inherit",fontSize:13,fontWeight:600,color:C.text,outline:"none",cursor:"pointer"}},
                e("option",null,"Dutch"),e("option",null,"Spanish"),e("option",null,"German")
              )
            ),
          e("div",{style:{position:"relative",marginBottom:14}},
            e("textarea",{style:{...st.ta,minHeight:sourceFile?88:(isWide?220:160),maxHeight:sourceFile?140:(isWide?280:220),overflow:"auto"},placeholder:useOwnAi?'Paste the translation here…':"Paste your text here… e.g. \"We are looking for a reliable translation partner.\"",value:inputText,onChange:ev=>{setInputText(ev.target.value);if(fileScan&&fileScan.fit===false)setFileScan(null);},maxLength:25000}),
            e("span",{style:{position:"absolute",bottom:10,right:12,fontSize:11,color:C.muted}},words," words")
          ),
          e("div",{style:{display:"flex",alignItems:isCompact?"stretch":"center",gap:10,marginBottom:20,flexDirection:isCompact?"column":"row",flexWrap:"wrap"}},
            e("input",{ref:fileRef,type:"file",accept:".txt,.md,.pdf,.docx",style:{display:"none"},onChange:handleFile}),
            e("button",{disabled:fileBusy,onClick:()=>fileRef.current.click(),style:{...st.btn,background:"transparent",border:`1px dashed ${C.border}`,color:C.muted,padding:"8px 14px",fontSize:12,width:isCompact?"100%":"auto"}},fileBusy?"Scanning…":"Upload file"),
            e("span",{style:{fontSize:11,color:C.muted,lineHeight:1.45}},isCompact?".txt, .docx, .pdf · max 10 MB · 25k chars":".txt, .docx, .pdf · max 10 MB · up to 25,000 characters")
          ),
          fileScan&&e("div",{style:{fontSize:12,marginBottom:12,color:fileScan.fit?C.green:C.error,background:fileScan.fit?C.greenBg:"#fdf2f2",border:`1px solid ${fileScan.fit?C.greenBorder:"rgba(196,61,61,0.22)"}`,borderRadius:10,padding:"10px 12px"}},
            e("div",{style:{fontWeight:600,marginBottom:4}},fileScan.fit?(useOwnAi?"File is fit for review":"File is fit for translation"):(useOwnAi?"File is not fit for review":"File is not fit for translation")),
            e("div",{style:{opacity:0.9}},fileScan.name," — ",fileScan.reason)
          ),
          e("label",{style:{...st.label,marginBottom:8}},"Email for delivery"),
          e("input",{type:"email",autoComplete:"email",placeholder:"you@example.com",value:clientEmail,onChange:ev=>setClientEmail(ev.target.value),style:{...st.ta,minHeight:0,resize:"none",marginBottom:8,padding:"10px 14px"}}),
          e("div",{style:{fontSize:12,color:C.muted,marginBottom:16,lineHeight:1.5}},"We’ll email the finished translation here. You can close this page after sending."),
          e("input",{id:"lc_hp_fax",className:"hp",tabIndex:-1,autoComplete:"off",name:"lc_hp_fax",defaultValue:""}),
          e("div",{ref:turnstileRef,style:{marginBottom:turnstileSiteKey?14:0,minHeight:turnstileSiteKey?65:0}}),
          error&&e("div",{style:{fontSize:12,color:C.error,marginBottom:12}},error),
          e("button",{disabled:!!(fileScan&&fileScan.fit===false)||fileBusy,onClick:useOwnAi?handleCheck:handleTranslate,style:{...st.btn,width:"100%",padding:14,background:C.accent,fontSize:15,color:C.white}},
            (fileScan&&fileScan.fit===false)?(useOwnAi?"File not suitable":"File not translatable"):(useOwnAi?"Check with LingoCheck":"Translate with LingoCheck")
          )
        )
        )
      )
    ),

    stage==="translating"&&e("div",{style:{...cardStyle(),textAlign:"center",padding:isCompact?"48px 20px":"64px 32px",animation:"fadeUp 0.25s ease"}},
      e("div",{style:{marginBottom:20}},e(Spinner,{size:26})),
      e("div",{style:{fontFamily:"inherit",fontSize:24,color:C.text,marginBottom:8}},"AI is translating…"),
      e("div",{style:st.muted},"Processing your text with our language model")
    ),

    stage==="translated"&&e("div",{style:{animation:"fadeUp 0.25s ease"}},
      e("div",{style:{...cardStyle(),border:`1px solid rgba(109,79,216,0.28)`,marginBottom:16}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
          e("span",{style:st.label},"AI Translation — ",language),
          e("span",{style:{fontSize:11,background:"rgba(109,79,216,0.08)",border:"1px solid rgba(109,79,216,0.18)",color:C.accent,borderRadius:999,padding:"3px 10px"}},"AI draft")
        ),
        e("div",{style:{display:"grid",gridTemplateColumns:isCompact?"1fr":"repeat(3, 1fr)",gap:10,marginBottom:12}},
          [
            [words,"Words","Source word count"],
            [formatEuro(lingoPrice),"Your price","LingoCheck price for this job"],
            [formatEuro(agencyPrice),"Typical agency price","Average a traditional translation agency would charge for the same job. Comparison only — not editable."]
          ].map(([v,l,hint],i)=>
            e("div",{key:i,title:hint,style:{background:C.soft,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",textAlign:"center"}},
              e("div",{style:{fontFamily:"inherit",fontSize:20,color:C.accent,marginBottom:3}},v),
              e("div",{style:{fontSize:11,fontWeight:600,color:C.text,display:"flex",alignItems:"center",justifyContent:"center",gap:4}},
                l,
                i===2&&e("span",{"aria-label":hint,title:hint,style:{display:"inline-flex",alignItems:"center",justifyContent:"center",width:14,height:14,borderRadius:"50%",border:`1px solid ${C.border}`,fontSize:9,fontWeight:700,color:C.muted,lineHeight:1,cursor:"help"}},"i")
              ),
              e("div",{style:{fontSize:10,color:C.muted,marginTop:4,lineHeight:1.35}},i===2?"Comparison only":"\u00a0")
            )
          )
        ),
        e("div",{role:"status",style:{background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:10,padding:"14px 16px",marginBottom:16,textAlign:"center"}},
          e("div",{style:{fontFamily:"inherit",fontSize:isWide?22:18,fontWeight:600,color:C.green,lineHeight:1.3}},"Save ",formatEuro(savings)," with LingoCheck!"),
          e("div",{style:{fontSize:11,color:C.muted,marginTop:4}},"Versus the typical agency rate for this job")
        ),
        e("div",{style:{background:C.amberBg,border:`1px solid ${C.amberBorder}`,borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:12,color:C.amber}},"✦  This is an AI draft. Once you approve, our revisor will check and refine every word."),
        e("label",{style:{...st.label,marginBottom:8}},"Email for delivery"),
        e("input",{type:"email",autoComplete:"email",placeholder:"you@example.com",value:clientEmail,onChange:ev=>setClientEmail(ev.target.value),style:{...st.ta,minHeight:0,resize:"none",marginBottom:8,padding:"10px 14px"}}),
        e("div",{style:{fontSize:12,color:C.muted,marginBottom:16,lineHeight:1.5}},"We’ll send the reviewed file to this address when it’s ready."),
        e("button",{onClick:handleSend,style:{...st.btn,width:"100%",padding:14,background:C.green,fontSize:15,color:C.white}},
          "✓ Approve & Send to Revisor  ·  ",e("span",{style:{opacity:0.8,fontSize:12}},"demo: skip payment")
        ),
        error&&e("div",{style:{fontSize:12,color:C.error,marginTop:12}},error)
      ),
      e("div",{style:{...cardStyle(),marginBottom:14}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:showFullDraft?12:0}},
          e("span",{style:{...st.label,marginBottom:0}},"Document text"),
          e("button",{onClick:()=>setShowFullDraft(v=>!v),style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"6px 12px",fontSize:12}},showFullDraft?"Hide text":"Show original and translation")
        ),
        showFullDraft
          ?e("div",{style:{display:"grid",gridTemplateColumns:isWide?"1fr 1fr":"1fr",gap:14}},
            e("div",null,
              e("div",{style:{fontSize:11,color:C.muted,letterSpacing:"1px",textTransform:"uppercase",marginBottom:8}},"Original — English"),
              e("div",{style:{fontSize:13,color:C.muted,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:280,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}},inputText)
            ),
            e("div",null,
              e("div",{style:{fontSize:11,color:C.accent,letterSpacing:"1px",textTransform:"uppercase",marginBottom:8}},"AI translation — ",language),
              e("div",{style:{fontSize:13,color:C.text,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:280,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}},aiResult)
            )
          )
          :e("div",{style:{fontSize:12,color:C.muted,lineHeight:1.55,marginTop:10}},sourceFile?.name?("Uploaded "+sourceFile.name+" · "+words+" words. Open only if you want to read the draft."):(words+" words ready for review. Open only if you want to read the draft."))
      ),
      e("button",{onClick:handleReset,style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"8px 16px",fontSize:12}},"← Start over")
    ),

    stage==="sent"&&e("div",{style:{...cardStyle(),textAlign:"center",padding:isCompact?"48px 20px":"64px 32px",border:"1px solid rgba(109,79,216,0.22)",animation:"glow 2.4s ease-in-out infinite, fadeUp 0.25s ease"}},
      e("div",{style:{fontSize:42,marginBottom:18}},"👁"),
      e("div",{style:{fontFamily:"inherit",fontSize:isCompact?22:26,color:C.text,marginBottom:10}},currentJob?.qaOnly?"Awaiting quality check":"Awaiting revisor"),
      e("div",{style:{...st.muted,maxWidth:380,margin:"0 auto 28px",lineHeight:1.7}},
        currentJob?.qaOnly
          ?"Your translation has been sent to a certified translator for proofreading."
          :"Your translation has been sent to our revisor. They will check and refine it.",
        " We’ll email ",
        e("strong",{style:{color:C.text}},currentJob?.clientEmailMasked||"you"),
        " when it’s ready — you can close this page."
      ),
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:C.muted,fontSize:12}},
        e("span",{style:{width:7,height:7,borderRadius:"50%",background:C.accent,display:"inline-block",animation:"pulse 1.5s ease-in-out infinite"}}),
        "Checking for updates every few seconds…"
      )
    ),

    stage==="complete"&&currentJob&&e("div",{style:{animation:"fadeUp 0.25s ease"}},
      e("div",{style:{background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:14,padding:"14px 20px",marginBottom:18,display:"flex",alignItems:"center",gap:10}},
        e("span",{style:{fontSize:20}},"✅"),
        e("div",null,
          e("div",{style:{fontSize:13,fontWeight:500,color:C.green}},"Revisor review complete"),
          e("div",{style:{fontSize:12,color:C.muted}},
            currentJob.clientEmailMasked
              ?"Your translation has been human-verified. We also emailed it to "+currentJob.clientEmailMasked+"."
              :"Your translation has been human-verified and is ready to use"
          )
        )
      ),
      e("div",{style:{...cardStyle(),border:`1px solid ${C.greenBorder}`,marginBottom:14}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
          e("span",{style:st.label},"Final Translation — ",currentJob.language),
          e("span",{style:{fontSize:11,background:C.greenBg,border:`1px solid ${C.greenBorder}`,color:C.green,borderRadius:20,padding:"3px 10px"}},"✓ Human reviewed")
        ),
        e("div",{style:{fontSize:14,lineHeight:1.8,color:C.text,whiteSpace:"pre-wrap",marginBottom:18}},currentJob.revisedTranslation),
        e("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
          e("button",{onClick:()=>navigator.clipboard.writeText(currentJob.revisedTranslation),style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"8px 16px",fontSize:12,flex:isCompact?"1 1 100%":"0 0 auto"}},isCompact?"Copy":"Copy translation"),
          e("button",{onClick:async()=>{
            try{ await downloadTranslated(); }
            catch(err){ setError("Could not download file: "+(err.message||"Unknown error")); }
          },style:{...st.btn,background:C.soft,border:`1px solid ${C.border}`,color:C.muted,padding:"8px 16px",fontSize:12,flex:isCompact?"1 1 100%":"0 0 auto"}},isCompact?"Download file":"Download translated file")
        ),
        downloadNote&&e("div",{style:{fontSize:12,color:C.muted,lineHeight:1.55,marginTop:12,padding:"10px 12px",background:C.soft,border:`1px solid ${C.border}`,borderRadius:10}},downloadNote),
        error&&e("div",{style:{fontSize:12,color:C.error,marginTop:12}},error)
      ),
      e("button",{onClick:handleReset,style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"8px 16px",fontSize:12}},"← Translate another document")
    ),

    e("div",{style:{textAlign:"center",marginTop:56,fontSize:10,color:"#b0a9c0",letterSpacing:"0.5px"}},"LINGOCHECK · AI + HUMAN TRANSLATION · INVESTOR DEMO")
  ));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
