  #root{position:relative;z-index:1;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes rise{from{opacity:0;transform:translateY(28px) scale(0.985)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(24px,18px)}}

  a,button{transition:transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), opacity .2s var(--ease), box-shadow .2s var(--ease);}

  textarea:focus,input:focus,select:focus{border-color:rgba(109,79,216,0.4)!important;outline:none;box-shadow:0 0 0 4px rgba(109,79,216,0.12);}
  select option{background:#ffffff;color:#2a2438;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  ::placeholder{color:#9a92a8;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(90,80,120,0.18);border-radius:3px;}
  .hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;}
  .lc-nav-pill{
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.65);
    box-shadow:0 8px 32px rgba(42,36,56,0.06);
  }
  .lc-panel{
    background:rgba(255,255,255,0.72);
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    border:1px solid rgba(255,255,255,0.8);
    box-shadow:0 20px 60px rgba(42,36,56,0.08);
  }
  .lc-display{font-family:'Kufam',system-ui,sans-serif;}
  @media (max-width: 767px){
    body{overflow-x:hidden;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}

<script>
const {useState,useEffect,useCallback,useRef}=React;

const C={deep:"#2a2438",mid:"#5b3fc4",accent:"#6d4fd8",light:"#6d4fd8",pale:"#6d4fd8",lilac:"#d9d0f5",surface:"#ffffff",card:"#ffffff",border:"rgba(42,36,56,0.10)",text:"#2a2438",muted:"#6a6178",white:"#ffffff",green:"#1f7a4d",greenBg:"rgba(238,247,241,0.9)",greenBorder:"rgba(31,122,77,0.18)",amber:"#8a6800",amberBg:"rgba(255,248,230,0.9)",amberBorder:"rgba(138,104,0,0.18)",soft:"rgba(255,255,255,0.55)",error:"#c43d3d"};
const st={
  card:{background:"rgba(255,255,255,0.72)",border:"1px solid rgba(255,255,255,0.8)",borderRadius:28,padding:28,boxShadow:"0 20px 60px rgba(42,36,56,0.08)"},
  btn:{fontFamily:"inherit",cursor:"pointer",border:"none",borderRadius:999,fontWeight:600,transition:"transform 0.2s cubic-bezier(0.22,1,0.36,1), opacity 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s"},
  label:{fontSize:13,fontWeight:500,letterSpacing:"-0.01em",textTransform:"none",color:C.muted,marginBottom:8,display:"block"},
  ta:{width:"100%",background:"rgba(255,255,255,0.7)",border:`1px solid ${C.border}`,borderRadius:18,padding:"16px 18px",fontFamily:"inherit",fontSize:16,color:C.text,lineHeight:1.7,resize:"vertical",boxSizing:"border-box",letterSpacing:"-0.2px"},
  muted:{fontSize:"var(--font-body, 17px)",color:C.muted,lineHeight:1.7,letterSpacing:"-0.2px"}
};

const DEFAULT_LINGO_PER_WORD_EUR = 0.04;
const DEFAULT_AGENCY_PER_WORD_EUR = 0.10;

function formatEuro(amount){
  const n = Math.round(Number(amount || 0) * 100) / 100;
  return "€" + n.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getClientId(){
  let id=localStorage.getItem("lc_cid");
  if(id && /^[A-Za-z0-9_-]{6,64}$/.test(id)) return id;
  const bytes=new Uint8Array(16);
  crypto.getRandomValues(bytes);
  id=Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
  localStorage.setItem("lc_cid",id);
  return id;
}

function isValidEmail(value){
  return /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/i.test(String(value||"").trim());
}

function savedEmail(){
  try{ return String(localStorage.getItem("lc_email")||""); }catch{ return ""; }
}

async function apiFetch(path,opts={}){
  const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||(r.status===429?"Too many requests. Please wait and try again.":"Request failed"));
  return data;
}

function honeypotValue(){
  const el=document.getElementById("lc_hp_fax");
  return el?String(el.value||""):"";
}

function Spinner({size=18}){return React.createElement("span",{style:{display:"inline-block",width:size,height:size,border:"2px solid rgba(109,79,216,0.18)",borderTopColor:C.accent,borderRadius:"50%",animation:"spin 0.55s linear infinite",verticalAlign:"middle"}});}

function useMedia(query){
  const [matches,setMatches]=useState(()=>window.matchMedia?window.matchMedia(query).matches:false);
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq=window.matchMedia(query);
    const onChange=()=>setMatches(mq.matches);
    onChange();
    if(mq.addEventListener) mq.addEventListener("change",onChange);
    else mq.addListener(onChange);
    return()=>{
      if(mq.removeEventListener) mq.removeEventListener("change",onChange);
      else mq.removeListener(onChange);
    };
  },[query]);
  return matches;
}

async function fileToArrayBuffer(file){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsArrayBuffer(file);});
}

function readAsText(file){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||""));r.onerror=()=>reject(new Error("Could not read file."));r.readAsText(file);});
}

function arrayBufferToBase64(buf){
  const bytes = new Uint8Array(buf);
  let binary = "";
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}

function base64ToUint8Array(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ROOT (Client portal only)
// ══════════════════════════════════════════════════════
function App(){
  const clientId=useRef(getClientId());
  return React.createElement("div",{style:{background:"transparent",minHeight:"100vh",paddingBottom:60}},
    React.createElement(ClientView,{clientId:clientId.current})
  );
}

// ══════════════════════════════════════════════════════
// CLIENT VIEW
// ══════════════════════════════════════════════════════
function ClientView({clientId}){
  const[stage,setStage]=useState("idle");
  const[inputText,setInputText]=useState("");
  const[language,setLanguage]=useState("Dutch");
  const[sourceLanguage,setSourceLanguage]=useState("English");
  const[selectedLanguages,setSelectedLanguages]=useState(["Dutch"]);
  const[extraLanguages,setExtraLanguages]=useState([]);
  const[langMenu,setLangMenu]=useState("");
  const[drafts,setDrafts]=useState({});
  const[bundleIds,setBundleIds]=useState([]);
  const[bundleJobs,setBundleJobs]=useState([]);
  const[busyNote,setBusyNote]=useState("");
  const[sending,setSending]=useState(false);
  const[aiResult,setAiResult]=useState("");
  const[currentJob,setCurrentJob]=useState(null);
  const[error,setError]=useState("");
  const[fileScan,setFileScan]=useState(null); // {name, fit, reason}
  const[fileBusy,setFileBusy]=useState(false);
  const[sourceFile,setSourceFile]=useState(null); // {name, ext, fileB64?}
  const[qaSourceText,setQaSourceText]=useState("");
  const[qaSourceName,setQaSourceName]=useState("");
  const[qaSourceScan,setQaSourceScan]=useState(null);
  const[qaSourceBusy,setQaSourceBusy]=useState(false);
  const[isWide,setIsWide]=useState(()=>window.matchMedia && window.matchMedia("(min-width: 980px)").matches);
  const isCompact=!useMedia("(min-width: 768px)");
  const pagePad=isCompact?"28px 18px 0":"40px 28px 0";
  const cardPad=isCompact?22:32;
  const cardStyle=(extra={})=>({...st.card,padding:cardPad,...extra});
  const[turnstileSiteKey,setTurnstileSiteKey]=useState(null);
  const[useOwnAi,setUseOwnAi]=useState(true); // default: check an existing translation
  const[clientEmail,setClientEmail]=useState(()=>savedEmail());
  const[privacyOk,setPrivacyOk]=useState(false);
  const[showFullDraft,setShowFullDraft]=useState(false);
  const[downloadNote,setDownloadNote]=useState("");
  const[qaFindings,setQaFindings]=useState(null);
  const[rates,setRates]=useState({
    clientPerWordEur: DEFAULT_LINGO_PER_WORD_EUR,
    agencyPerWordEur: DEFAULT_AGENCY_PER_WORD_EUR,
    payoutPerWordCents: 2.5
  });
  const[okapiReady,setOkapiReady]=useState(false);
  const fileRef=useRef();
  const qaSourceRef=useRef();
  const qaSourceSegmentsRef=useRef([]);
  const sourceFileB64Ref=useRef(null);
  const textSegmentsRef=useRef([]);
  const sentencePackRef=useRef(null);
  const okapiPackageRef=useRef(null);
  const extractLangRef=useRef("");
  const qaSourceFileRef=useRef(null);
  const qaExtractLangRef=useRef("");
  const deliveryTokenRef=useRef("");
  const turnstileRef=useRef();
  const turnstileWidget=useRef(null);
  const challengeRef=useRef("");

  function jobAccessQuery(){
    const token=deliveryTokenRef.current;
    if(token) return "token="+encodeURIComponent(token);
    return "clientId="+encodeURIComponent(clientId);
  }

  const refreshChallenge=useCallback(async()=>{
    try{
      const data=await apiFetch("/api/challenge");
      challengeRef.current=data.token||"";
    }catch{}
  },[]);

  useEffect(()=>{
    if(!langMenu) return;
    function close(ev){
      if(ev.target && ev.target.closest && ev.target.closest("[data-lang-menu]")) return;
      setLangMenu("");
    }
    function onKey(ev){ if(ev.key==="Escape") setLangMenu(""); }
    document.addEventListener("mousedown", close);
    document.addEventListener("keydown", onKey);
    return ()=>{
      document.removeEventListener("mousedown", close);
      document.removeEventListener("keydown", onKey);
    };
  },[langMenu]);

  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        const cfg=await apiFetch("/api/public-config");
        if(alive){
          setTurnstileSiteKey(cfg.turnstileSiteKey||null);
          setOkapiReady(!!cfg.okapiReady);
          setRates(prev=>({
            clientPerWordEur: typeof cfg.clientPerWordEur==="number"?cfg.clientPerWordEur:prev.clientPerWordEur,
            agencyPerWordEur: typeof cfg.agencyPerWordEur==="number"?cfg.agencyPerWordEur:prev.agencyPerWordEur,
            payoutPerWordCents: typeof cfg.payoutPerWordCents==="number"?cfg.payoutPerWordCents:prev.payoutPerWordCents
          }));
        }
      }catch{}
    })();
    refreshChallenge();
    const t=setInterval(refreshChallenge,4*60*1000);
    return()=>{alive=false;clearInterval(t);};
  },[refreshChallenge]);

  useEffect(()=>{
    if(stage!=="idle"){
      turnstileWidget.current=null;
      return;
    }
    if(!turnstileSiteKey || !turnstileRef.current) return;
    function renderWidget(){
      if(!window.turnstile || !turnstileRef.current) return;
      if(turnstileWidget.current!=null){
        try{window.turnstile.reset(turnstileWidget.current);}catch{}
        return;
      }
      turnstileWidget.current=window.turnstile.render(turnstileRef.current,{sitekey:turnstileSiteKey,theme:"light"});
    }
    if(window.turnstile){renderWidget();return;}
    if(document.getElementById("cf-turnstile-script")) return;
    const s=document.createElement("script");
    s.id="cf-turnstile-script";
    s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    s.async=true;
    s.onload=renderWidget;
    document.head.appendChild(s);
  },[turnstileSiteKey, stage]);

  useEffect(()=>{
    const ids = bundleIds.length ? bundleIds : (currentJob?.id ? [currentJob.id] : []);
    if(!ids.length||stage!=="sent") return;
    let cancelled=false;
    function keepFile(job, prev){
      const fileB64 = prev?.sourceFile?.fileB64 || sourceFileB64Ref.current || null;
      if(!fileB64) return job;
      if(!job.sourceFile) return { ...job, sourceFile: { ...(prev?.sourceFile||{}), fileB64 } };
      return { ...job, sourceFile: { ...job.sourceFile, fileB64: job.sourceFile.fileB64 || fileB64 } };
    }
    async function tick(){
      try{
        const jobs=[];
        for(const id of ids){
          const job=await apiFetch("/api/jobs/"+encodeURIComponent(id)+"?"+jobAccessQuery());
          if(job) jobs.push(job);
        }
        if(cancelled||!jobs.length) return;
        setBundleJobs(jobs);
        setCurrentJob(prev=>keepFile(jobs.find(j=>j.id===prev?.id)||jobs[0], prev));
        if(jobs.every(j=>j.status==="complete")) setStage("complete");
      }catch{}
    }
    tick();
    const t=setInterval(tick,4000);
    return()=>{cancelled=true;clearInterval(t);};
  },[stage,bundleIds,currentJob?.id,clientId]);

  useEffect(()=>{
    let cancelled=false;
    async function restore(){
      const params=new URLSearchParams(location.search);
      const pathDelivery=location.pathname.match(/^\/d\/([A-Za-z0-9_-]{6,64})\/([a-f0-9]{32,128})$/);
      const jobId=pathDelivery?pathDelivery[1]:params.get("job");
      const token=pathDelivery?pathDelivery[2]:(params.get("t")||params.get("token"));
      try{
        if(jobId && token && /^[A-Za-z0-9_-]{6,64}$/.test(jobId)){
          deliveryTokenRef.current=token;
          const job=await apiFetch("/api/jobs/"+encodeURIComponent(jobId)+"?token="+encodeURIComponent(token));
          if(cancelled||!job) return;
          setCurrentJob(job);
          setStage(job.status==="complete"?"complete":"sent");
          try{ localStorage.setItem("lc_open_job", JSON.stringify({id:job.id})); }catch{}
          return;
        }
        let saved=null;
        try{ saved=JSON.parse(localStorage.getItem("lc_open_job")||"null"); }catch{}
        const savedIds=Array.isArray(saved?.ids)&&saved.ids.length?saved.ids:(saved?.id?[saved.id]:[]);
        if(savedIds.length){
          const jobs=[];
          for(const id of savedIds){
            try{
              const job=await apiFetch("/api/jobs/"+encodeURIComponent(id)+"?clientId="+encodeURIComponent(clientId));
              if(job) jobs.push(job);
            }catch{}
          }
          if(cancelled||!jobs.length) return;
          setBundleIds(jobs.map(j=>j.id));
          setBundleJobs(jobs);
          setCurrentJob(jobs[0]);
          setStage(jobs.every(j=>j.status==="complete")?"complete":"sent");
        }
      }catch(e){
        if(jobId && token && !cancelled){
          setError(e.message==="Job not found"
            ?"This download link is no longer valid. Ask the reviewer to send the translation again."
            :(e.message||"Could not open the translation."));
        }
      }
    }
    restore();
    return()=>{cancelled=true;};
  },[clientId]);

  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq = window.matchMedia("(min-width: 980px)");
    const onChange = () => setIsWide(!!mq.matches);
    onChange();
    if(mq.addEventListener) mq.addEventListener("change", onChange);
    else mq.addListener(onChange);
    return () => {
      if(mq.removeEventListener) mq.removeEventListener("change", onChange);
      else mq.removeListener(onChange);
    };
  },[]);

  const words=inputText.trim().split(/\s+/).filter(Boolean).length;
  const extraDelivery=useOwnAi?extraLanguages.filter(lang=>lang&&lang!==language&&lang!==sourceLanguage):[];
  const deliveryLanguages=useOwnAi?[language,...extraDelivery]:selectedLanguages;
  const deliveryCount=Math.max(1, deliveryLanguages.length);
  const lingoPerWord=rates.clientPerWordEur||DEFAULT_LINGO_PER_WORD_EUR;
  const agencyPerWord=rates.agencyPerWordEur||DEFAULT_AGENCY_PER_WORD_EUR;
  const lingoPrice=words*lingoPerWord*deliveryCount;
  const agencyPrice=words*agencyPerWord*deliveryCount;
  const savings=Math.max(0, agencyPrice-lingoPrice);

  function botFields(){
    return {
      challengeToken: challengeRef.current,
      turnstileToken: (window.turnstile && turnstileWidget.current!=null) ? (window.turnstile.getResponse(turnstileWidget.current)||"") : "",
      lc_hp_fax: honeypotValue()
    };
  }

  function buildSentencePackFromInput(){
    const pack = sentencePackRef.current;
    if(
      pack &&
      Array.isArray(pack.sentences) &&
      pack.sentences.length &&
      pack.fromOkapi
    ){
      return {
        sentences: pack.sentences,
        paraMap: pack.paraMap || pack.sentences.map(()=>0),
        paragraphCount: pack.paragraphCount || (textSegmentsRef.current.length || 1),
        translationSentences: pack.translationSentences || null,
        fromOkapi: true
      };
    }
    const TS = window.LcTextSegments;
    if(!TS) return null;
    const segments = textSegmentsRef.current.length
      ? TS.normalizeDocumentSegments(textSegmentsRef.current)
      : TS.normalizeDocumentSegments(inputText.trim());
    if(!segments.length) return null;
    return TS.buildSentenceUnits(segments);
  }

  const ALL_LANGS=["English","Dutch","Spanish","German","French","Italian","Portuguese","Arabic","Chinese","Hindi","Indonesian","Japanese","Korean"];
  const LANG_ORDER=ALL_LANGS.filter(function(lang){ return lang!=="English"; });

  function chooseSource(next){
    setSourceLanguage(next);
    setLanguage(prev=>prev===next?(ALL_LANGS.find(lang=>lang!==next)||"English"):prev);
    setSelectedLanguages(prev=>{
      const kept=prev.filter(lang=>lang!==next);
      return kept.length?kept:[ALL_LANGS.find(lang=>lang!==next)];
    });
    setExtraLanguages(prev=>prev.filter(lang=>lang!==next));
  }

  function toggleDeliveryLanguage(lang){
    const has=selectedLanguages.includes(lang);
    if(has && selectedLanguages.length===1) return;
    const next=has
      ? selectedLanguages.filter(l=>l!==lang)
      : ALL_LANGS.filter(l=>l!==sourceLanguage&&(selectedLanguages.includes(l)||l===lang));
    setSelectedLanguages(next);
    if(!next.includes(language)) setLanguage(next[0]);
  }

  async function translateOneLanguage(lang, pack, text){
    const source = text != null ? text : inputText.trim();
    const payload=()=>({
      text: source,
      language: lang,
      sourceLanguage,
      sentences: pack ? pack.sentences : undefined,
      sentenceParaMap: pack ? pack.paraMap : undefined,
      ...botFields()
    });
    if(!challengeRef.current) await refreshChallenge();
    try{
      return await apiFetch("/api/translate",{method:"POST",body:JSON.stringify(payload())});
    }catch(first){
      const msg=String(first.message||"");
      if(/Verification expired|Confirm you are human/i.test(msg)){
        await refreshChallenge();
        return await apiFetch("/api/translate",{method:"POST",body:JSON.stringify(payload())});
      }
      throw first;
    }
  }

  async function handleTranslate(){
    if(!privacyOk){setError("Accept the privacy notice before sending a job.");return;}

      for(const lang of langs){
        setBusyNote(langs.length>1?("Translating into "+lang+"…"):"");

        const sentences=pack && Array.isArray(data.translationSentences) && data.translationSentences.length===pack.sentences.length
          ? data.translationSentences

  }

  function newBundleId(){
    const bytes=new Uint8Array(8);
    crypto.getRandomValues(bytes);
    return "b_"+Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  function withLocalFile(job){
    const fileB64=sourceFile?.fileB64 || sourceFileB64Ref.current || null;
    if(!job) return job;
    if(!job.sourceFile) return fileB64 ? { ...job, sourceFile:{ fileB64 } } : job;
    return { ...job, sourceFile:{ ...job.sourceFile, fileB64: job.sourceFile.fileB64 || fileB64 } };
  }

  async function packFor(packId, extractedAs, lang){
    if(!packId) return "";
    if(!extractedAs || lang===extractedAs) return packId;
    if(!challengeRef.current) await refreshChallenge();
    const payload=()=>({ packId, language: lang, ...botFields() });
    let data;
    try{
      data=await apiFetch("/api/okapi/retarget",{method:"POST",body:JSON.stringify(payload())});
    }catch(first){
      const msg=String(first.message||"");
      if(/Verification expired|Confirm you are human/i.test(msg)){
        await refreshChallenge();
        data=await apiFetch("/api/okapi/retarget",{method:"POST",body:JSON.stringify(payload())});
      }else throw first;
    }
    await refreshChallenge();
    return (data && data.okapi && data.okapi.packId) || packId;
  }

  async function packIdForLanguage(lang){
    const current=okapiPackageRef.current;
    const packId=(sourceFile?.okapi && sourceFile.okapi.packId) || (current && current.packId) || "";
    return packFor(packId, extractLangRef.current || language, lang);
  }

          let draft=drafts[lang]||{};

  function applyExtractedText(raw, segments, file, sourceExt, baseReason, extras){
    const DX = window.LcDocExtract;
    const TS = window.LcTextSegments;
    const fromOkapi = !!(extras && extras.fromOkapi);
    let segs;
    if(fromOkapi && Array.isArray(segments) && segments.length){
      segs = segments.map(function(s){ return String(s||"").trim(); }).filter(Boolean);
    } else if(TS){
      segs = TS.normalizeDocumentSegments((Array.isArray(segments) && segments.length) ? segments : raw);
    } else {
      segs = Array.isArray(segments) && segments.length
        ? segments
        : String(raw||"").split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
    }
    const joined = fromOkapi
      ? segs.join("\n\n")
      : (TS ? TS.segmentsToDisplayText(segs) : segs.join("\n\n"));
    const text = DX ? DX.truncateExtractedText(joined) : String(raw||"").slice(0, 25000);
    const truncated = String(raw||"").length > text.length;
    textSegmentsRef.current = segs;
    if(extras && Array.isArray(extras.sentences) && extras.sentences.length){
      sentencePackRef.current = {
        sentences: extras.sentences,
        paraMap: extras.sentenceParaMap || extras.sentences.map(()=>0),
        paragraphCount: segs.length || 1,
        translationSentences: null,
        fromOkapi: fromOkapi
      };
    } else {
      sentencePackRef.current = null;
    }
    if(extras && extras.okapi){
      okapiPackageRef.current = extras.okapi;
      extractLangRef.current = language;
    } else if(sourceExt !== "docx") {
      okapiPackageRef.current = null;
    }
    setInputText(text);
    setFileScan({
      name: file.name,
      fit: true,
      reason: truncated ? baseReason + " (truncated to 25,000 characters)" : baseReason
    });
    setSourceFile({
      name: file.name,
      ext: sourceExt,
      okapi: extras && extras.okapi ? extras.okapi : undefined
    });
  }

  async function postOkapiExtract(file, buf, targetLanguage){
    if(!challengeRef.current) await refreshChallenge();
    const send = async () => {
      const r = await fetch("/api/okapi/extract", {
        method: "POST",
        headers: {
          "Content-Type": "application/octet-stream",
          "X-LC-Filename": encodeURIComponent(file.name || "document.docx"),
          "X-LC-Language": targetLanguage || language,
          "X-LC-Source-Language": sourceLanguage,
          "X-LC-Challenge": challengeRef.current || "",
          "X-LC-Turnstile": (window.turnstile && turnstileWidget.current!=null) ? (window.turnstile.getResponse(turnstileWidget.current)||"") : "",
          "X-LC-Honeypot": honeypotValue()
        },
        body: buf
      });
      const data = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error||"Request failed");
      return data;
    };
    try {
      return await send();
    } catch(first) {
      const msg = String(first.message||"");
      if(/Verification expired|Confirm you are human/i.test(msg)){
        await refreshChallenge();
        return await send();
      }
      throw first;
    }
  }

  async function inspectUpload(file, opts){
    const keepLayout = !opts || opts.layout !== false;
    const name=(file.name||"").toLowerCase();
    const DX = window.LcDocExtract;
    if(!DX) throw new Error("Document parser not loaded");
    if(name.endsWith(".txt")||name.endsWith(".md")){
      const raw = await readAsText(file);
      const parsed = DX.extractPlainText(raw);
      return { fit:true, ext:name.endsWith(".md")?"md":"txt", text:parsed.text, segments:parsed.segments, reason:"Text file" };
    }
    if(!(name.endsWith(".pdf")||name.endsWith(".docx"))){
      throw new Error("Unsupported file type. Upload .txt, .md, .docx, or .pdf.");
    }
    const buf = await fileToArrayBuffer(file);
    if(name.endsWith(".pdf")){
      const fileB64 = arrayBufferToBase64(buf);
      const r = await DX.extractPdfText(buf);
      if(r.isScannedLike || !r.text){
        return { fit:false, reason:"PDF has no usable text layer (likely scanned)." };
      }
      return {
        fit:true,
        ext:"pdf",
        text:r.text,
        segments:r.segments,
        reason: r.hasImages ? "Text extracted; images will be kept on download." : "PDF text extracted",
        fileB64
      };
    }
    if(keepLayout && okapiReady){
      try{
        const data = await postOkapiExtract(file, buf, opts && opts.targetLanguage);
        if(data && data.okapi && data.okapi.packId && data.text && Array.isArray(data.sentences) && data.sentences.length){
          refreshChallenge();
          return {
            fit:true,
            ext:"docx",
            text:data.text,
            segments:data.segments || data.sentences,
            reason:"Word extracted with Okapi (layout-preserving round-trip)",
            okapi:data.okapi,
            sentences:data.sentences,
            sentenceParaMap:data.sentenceParaMap,
            fromOkapi:true
          };
        }
      }catch(okErr){
        console.warn("Okapi extract failed, falling back to browser parser:", okErr);
      }
    }
    const fileB64 = arrayBufferToBase64(buf);
    const r = await DX.extractDocxText(buf);
    if(r.blocked) return { fit:false, reason:"Word document contains macros or executable content." };
    if(!r.text) return { fit:false, reason:"Word document has no extractable text." };
    return {
      fit:true,
      ext:"docx",
      text:r.text,
      segments:r.segments,
      reason:(r.hasImages||r.hasDrawing) ? "Text extracted; images will be kept on download." : "Word text extracted",
      fileB64
    };
  }

  async function handleFile(e){

    }catch(err){
      setError("Could not process file: "+(err.message||"Unknown error"));
    }finally{
      setFileBusy(false);
    }
  }

    if(meta?.okapi?.packId) return meta.okapi;

  function exactOkapiSentences(job){
    const target = job || currentJob;
    const expected = (okapiPackageRef.current && okapiPackageRef.current.sentenceCount)
      || (sentencePackRef.current && sentencePackRef.current.sentences && sentencePackRef.current.sentences.length)
      || 0;
    const stored = target && Array.isArray(target.translationSentences) ? target.translationSentences : null;
    if(stored && stored.length && (!expected || stored.length === expected)) return stored;
    const pack = sentencePackRef.current;
    if(
      pack?.fromOkapi &&
      Array.isArray(pack.translationSentences) &&
      pack.translationSentences.length &&
      (!expected || pack.translationSentences.length === expected) &&
      (!target || target.id === currentJob?.id)
    ){
      return pack.translationSentences;
    }
    return null;
  }

  async function downloadTranslated(job){
    setDownloadNote("");
    const target = job || currentJob;
    const meta = target.sourceFile || { name:"translation.txt", ext:"txt" };
    const baseName = (meta.name||"translation").replace(/\.[^.]+$/,"");
    const ext = (meta.ext||"txt").toLowerCase();

    const multi = bundleJobs.length > 1 || bundleIds.length > 1;
    const finalName = multi ? `${baseName}-${target.language||"translation"}.${ext}` : `${baseName}-translated.${ext}`;
    if(ext==="txt"||ext==="md"){
      return downloadBlob(new Blob([text],{type:"text/plain;charset=utf-8"}), finalName);
    }
    const segments = target.originalSegments || null;
    if(ext==="docx"){
      const okapiPkg = await getOkapiPackage(meta, target);
      if(okapiReady && okapiPkg?.packId){
        if(!challengeRef.current) await refreshChallenge();
        const translations = exactOkapiSentences(target);
        const sendMerge = async () => {
          const r = await fetch("/api/okapi/merge", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              packId: okapiPkg.packId,
              translations: translations || undefined,
              fullText: text,
              ...botFields()
            })
          });
          if(!r.ok){
            const data = await r.json().catch(()=>({}));
            throw new Error(data.error||"Request failed");
          }
          return await r.blob();
        };
        try{
          let blob;
          try{
            blob = await sendMerge();
          }catch(first){
            const msg=String(first.message||"");
            if(/Verification expired|Confirm you are human/i.test(msg)){
              await refreshChallenge();
              blob = await sendMerge();
            }else throw first;
          }
          setDownloadNote("Downloaded with Okapi — original Word layout preserved.");
          refreshChallenge();
          return downloadBlob(blob, finalName);
        }catch(okErr){
          console.warn("Okapi merge failed:", okErr);
          throw okErr;
        }
      }
    }
    const fileB64 = await getSourceFileB64(meta, target);
    if(!fileB64) throw new Error("Original file is unavailable. Open the link from your email and try again.");
    if(ext==="docx"){
      const okapiPkg = await getOkapiPackage(meta, target);
      if(okapiReady && okapiPkg?.xliffB64){
        try{
          if(!challengeRef.current) await refreshChallenge();
          const translations = exactOkapiSentences(target);
          const payload=()=>({
            fileB64,
            okapi: okapiPkg,
            translations: translations || undefined,
            fullText: text,
            ...botFields()
          });
          let data;
          try{
            data=await apiFetch("/api/okapi/merge",{method:"POST",body:JSON.stringify(payload())});
          }catch(first){
            const msg=String(first.message||"");
            if(/Verification expired|Confirm you are human/i.test(msg)){
              await refreshChallenge();
              data=await apiFetch("/api/okapi/merge",{method:"POST",body:JSON.stringify(payload())});
            }else throw first;
          }
          if(data?.fileB64){
            const bytes = base64ToUint8Array(data.fileB64);
            setDownloadNote("Downloaded with Okapi — original Word layout preserved.");
            refreshChallenge();
            return downloadBlob(new Blob([bytes], {
              type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            }), finalName);
          }
        }catch(okErr){
          console.warn("Okapi merge failed, falling back to styled template:", okErr);
        }
      }
      try{
        const blob = await makeStyledDocxBlobFromTemplate(fileB64, text, segments);
        return downloadBlob(blob, finalName);
      }catch(err){
        console.warn("Styled DOCX download failed, falling back to plain text:", err);
        setDownloadNote("Word layout could not be preserved; downloaded as plain text instead.");
        return downloadBlob(new Blob([text],{type:"text/plain;charset=utf-8"}), `${baseName}-translated.txt`);
      }
    }
    if(ext==="pdf"){
      try{
        const result = await makeStyledPdfBlobFromTemplate(fileB64, text, segments);
        const blob = result && result.blob ? result.blob : result;
        if(result && result.mode === "clean"){
          setDownloadNote("This manual has a complex layout (columns, diagrams, side notes). Downloaded as a clean readable PDF. Diagrams and original formatting are not included — use your original file alongside this translation.");
        }
        return downloadBlob(blob, finalName);
      }catch(err){
        console.warn("Styled PDF download failed, falling back to plain PDF:", err);
        try{
          const blob = await makePdfBlobFromText(text);
          setDownloadNote("Layout could not be preserved; downloaded as a clean readable PDF instead.");
          return downloadBlob(blob, finalName);
        }catch(pdfErr){
          console.warn("Clean PDF download failed, falling back to text:", pdfErr);
          setDownloadNote("PDF layout/export failed; downloaded as plain text instead.");
          return downloadBlob(new Blob([text],{type:"text/plain;charset=utf-8"}), `${baseName}-translated.txt`);
        }
      }
    }
    return downloadBlob(new Blob([text],{type:"text/plain;charset=utf-8"}), `${baseName}-translated.txt`);
  }

          e("span",{style:{fontSize:12,fontWeight:500,background:C.soft,border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"4px 10px"}},"AI scan")
        ),
        e("div",{style:{display:"grid",gridTemplateColumns:isCompact?"1fr":"repeat(3, 1fr)",gap:10,marginBottom:12}},
          [
            [words,"Words","Translation word count"],
            [formatEuro(lingoPrice),"Your price","LingoCheck price for this job"],
            [formatEuro(agencyPrice),"Typical agency price","Average a traditional translation agency would charge for the same job. Comparison only — not editable."]
          ].map(([v,l,hint],i)=>
            e("div",{key:i,title:hint,style:{background:C.soft,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",textAlign:"center"}},
              e("div",{style:{fontFamily:"inherit",fontSize:20,color:C.accent,marginBottom:3}},v),
              e("div",{style:{fontSize:11,fontWeight:600,color:C.text,display:"flex",alignItems:"center",justifyContent:"center",gap:4}},
                l,
                i===2&&e("span",{"aria-label":hint,title:hint,style:{display:"inline-flex",alignItems:"center",justifyContent:"center",width:14,height:14,borderRadius:"50%",border:`1px solid ${C.border}`,fontSize:9,fontWeight:700,color:C.muted,lineHeight:1,cursor:"help"}},"i")
              ),
              e("div",{style:{fontSize:10,color:C.muted,marginTop:4,lineHeight:1.35}},i===2?"Comparison only":"\u00a0")
            )
          )
        ),
        e("div",{role:"status",style:{background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:10,padding:"14px 16px",marginBottom:16,textAlign:"center"}},
          e("div",{style:{fontFamily:"inherit",fontSize:isWide?22:18,fontWeight:600,color:C.green,lineHeight:1.3}},"Save ",formatEuro(savings)," with LingoCheck!"),
          e("div",{style:{fontSize:11,color:C.muted,marginTop:4}},"Versus the typical agency rate for this job")
        ),
        e("div",{style:{background:C.soft,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:12,color:C.muted,lineHeight:1.55}},
          (aiResult.trim() && aiResult.trim()!==inputText.trim())
            ?"LingoCheck changed parts of this translation. The revisor sees those changes highlighted, and can open your original wording from each highlight."
            :"LingoCheck kept your wording. A revisor will still proofread it against the "+sourceLanguage+" source.",
          qaSourceName?e("div",{style:{marginTop:6}},"Source: ",qaSourceName):null
        ),
        e("label",{style:{...st.label,marginBottom:8}},"Email for delivery"),
        e("input",{type:"email",autoComplete:"email",placeholder:"you@example.com",value:clientEmail,onChange:ev=>setClientEmail(ev.target.value),style:{...st.ta,minHeight:0,resize:"none",marginBottom:8,padding:"10px 14px"}}),
        e("div",{style:{fontSize:12,color:C.muted,marginBottom:16,lineHeight:1.5}},extraDelivery.length?"We’ll email the checked file and each extra language to this address.":"We’ll send the reviewed file to this address when it’s ready."),
        e("button",{onClick:()=>handleSend({qaOnly:true}),disabled:sending,style:{...st.btn,width:"100%",padding:14,background:C.green,fontSize:15,color:C.white,opacity:sending?0.7:1}},
          sending?(busyNote||"Sending…"):(extraDelivery.length?("Send the check and "+extraDelivery.join(" + ")): "Approve and send")
        ),
        error&&e("div",{style:{fontSize:12,color:C.error,marginTop:12}},error)
      ),
      e("div",{style:{...cardStyle(),marginBottom:14}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:showFullDraft?12:0}},
          e("span",{style:{...st.label,marginBottom:0}},"Document text"),
          e("button",{onClick:()=>setShowFullDraft(v=>!v),style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"6px 12px",fontSize:12}},showFullDraft?"Hide text":"Show submitted and checked text")
        ),
        showFullDraft
          ?e("div",{style:{display:"grid",gridTemplateColumns:isWide?"1fr 1fr":"1fr",gap:14}},
            e("div",null,
              e("div",{style:{fontSize:12,color:C.muted,marginBottom:8}},"Your submitted translation"),
              e("div",{style:{fontSize:13,color:C.muted,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:280,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}},inputText)
            ),
            e("div",null,
              e("div",{style:{fontSize:12,color:C.muted,marginBottom:8}},"After AI check — ",language),
              e("div",{style:{fontSize:13,color:C.text,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:280,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}},aiResult)
            )
          )
          :e("div",{style:{fontSize:12,color:C.muted,lineHeight:1.55,marginTop:10}},sourceFile?.name?("Uploaded "+sourceFile.name+" · "+words+" words. Open only if you want to compare the checked draft."):(words+" words ready for review. Open only if you want to compare the checked draft."))
      ),
      e("button",{onClick:handleReset,style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"8px 16px",fontSize:12}},"← Start over")
    ),

    stage==="translated"&&e("div",{style:{animation:"fadeUp 0.25s ease"}},
      e("div",{style:{...cardStyle(),border:`1px solid rgba(109,79,216,0.28)`,marginBottom:16}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
          e("span",{style:st.label},"AI Translation — ",language),
          e("span",{style:st.label},"AI Translation — ",deliveryCount>1?selectedLanguages.join(", "):language),
        ),
        e("div",{style:{display:"grid",gridTemplateColumns:isCompact?"1fr":"repeat(3, 1fr)",gap:10,marginBottom:12}},
          [
            [words,"Words","Source word count"],
            [formatEuro(lingoPrice),"Your price","LingoCheck price for this job"],
            [formatEuro(agencyPrice),"Typical agency price","Average a traditional translation agency would charge for the same job. Comparison only — not editable."]
          ].map(([v,l,hint],i)=>
            e("div",{key:i,title:hint,style:{background:C.soft,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",textAlign:"center"}},
              e("div",{style:{fontFamily:"inherit",fontSize:20,color:C.accent,marginBottom:3}},v),
              e("div",{style:{fontSize:11,fontWeight:600,color:C.text,display:"flex",alignItems:"center",justifyContent:"center",gap:4}},
                l,
                i===2&&e("span",{"aria-label":hint,title:hint,style:{display:"inline-flex",alignItems:"center",justifyContent:"center",width:14,height:14,borderRadius:"50%",border:`1px solid ${C.border}`,fontSize:9,fontWeight:700,color:C.muted,lineHeight:1,cursor:"help"}},"i")
              ),
              e("div",{style:{fontSize:10,color:C.muted,marginTop:4,lineHeight:1.35}},i===2?"Comparison only":"\u00a0")
            )
          )
        ),
        e("div",{role:"status",style:{background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:10,padding:"14px 16px",marginBottom:16,textAlign:"center"}},
          e("div",{style:{fontFamily:"inherit",fontSize:isWide?22:18,fontWeight:600,color:C.green,lineHeight:1.3}},"Save ",formatEuro(savings)," with LingoCheck!"),
          e("div",{style:{fontSize:11,color:C.muted,marginTop:4}},"Versus the typical agency rate for this job")
        ),
        e("div",{style:{background:C.amberBg,border:`1px solid ${C.amberBorder}`,borderRadius:10,padding:"12px 16px",marginBottom:16,fontSize:12,color:C.amber,lineHeight:1.55}},deliveryCount>1?"These are AI drafts. Once you approve, a revisor checks each language separately.":"This is an AI draft. Once you approve, a revisor will check and refine every word."),
        deliveryCount>1&&e("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}},
          selectedLanguages.filter(lang=>drafts[lang]).map(lang=>e("button",{
            key:lang,type:"button","aria-pressed":language===lang,
            onClick:()=>{
              setLanguage(lang);
              setAiResult((drafts[lang]&&drafts[lang].translation)||"");
              if(sentencePackRef.current) sentencePackRef.current={...sentencePackRef.current, translationSentences:(drafts[lang]&&drafts[lang].translationSentences)||null};
            },
            style:{...st.btn,padding:"6px 12px",fontSize:12,background:language===lang?C.accent:"transparent",color:language===lang?C.white:C.muted,border:`1px solid ${language===lang?C.accent:C.border}`}
          },lang))
        ),
        e("input",{type:"email",autoComplete:"email",placeholder:"you@example.com",value:clientEmail,onChange:ev=>setClientEmail(ev.target.value),style:{...st.ta,minHeight:0,resize:"none",marginBottom:8,padding:"10px 14px"}}),
        e("div",{style:{fontSize:12,color:C.muted,marginBottom:16,lineHeight:1.5}},deliveryCount>1?"We’ll email each finished language to this address.":"We’ll send the reviewed file to this address when it’s ready."),
        e("button",{onClick:handleSend,disabled:sending,style:{...st.btn,width:"100%",padding:14,background:C.green,fontSize:15,color:C.white,opacity:sending?0.7:1}},
          sending?(busyNote||"Sending…"):(deliveryCount>1?("Send "+deliveryCount+" languages"):"Approve and send")
        ),
        error&&e("div",{style:{fontSize:12,color:C.error,marginTop:12}},error)
      ),
      e("div",{style:{...cardStyle(),marginBottom:14}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:showFullDraft?12:0}},
          e("span",{style:{...st.label,marginBottom:0}},"Document text"),
          e("button",{onClick:()=>setShowFullDraft(v=>!v),style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"6px 12px",fontSize:12}},showFullDraft?"Hide text":"Show original and translation")
        ),
        showFullDraft
          ?e("div",{style:{display:"grid",gridTemplateColumns:isWide?"1fr 1fr":"1fr",gap:14}},
            e("div",null,
              e("div",{style:{fontSize:12,color:C.muted,marginBottom:8}},"Original — ",sourceLanguage),
              e("div",{style:{fontSize:13,color:C.muted,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:280,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}},inputText)
            ),
            e("div",null,
              e("div",{style:{fontSize:12,color:C.muted,marginBottom:8}},"AI translation — ",language),
              e("div",{style:{fontSize:13,color:C.text,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:280,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}},aiResult)
            )
          )
          :e("div",{style:{fontSize:12,color:C.muted,lineHeight:1.55,marginTop:10}},sourceFile?.name?("Uploaded "+sourceFile.name+" · "+words+" words. Open only if you want to read the draft."):(words+" words ready for review. Open only if you want to read the draft."))
      ),
      e("button",{onClick:handleReset,style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"8px 16px",fontSize:12}},"← Start over")
    ),

    stage==="sent"&&e("div",{style:{...cardStyle(),textAlign:"center",padding:isCompact?"48px 20px":"64px 32px",animation:"fadeUp 0.25s ease"}},
      e("div",{style:{fontFamily:"inherit",fontSize:isCompact?22:26,color:C.text,marginBottom:10}},
        currentJob?.status==="in_progress"
          ?(currentJob?.qaOnly?"A revisor is reading it now":"A revisor is working on it")
          :(currentJob?.qaOnly?"Waiting for a revisor":"Waiting for a revisor")
      ),
      e("div",{style:{...st.muted,maxWidth:400,margin:"0 auto 28px",lineHeight:1.7}},
        currentJob?.status==="in_progress"
          ?"Someone has claimed your job and is carefully going through the text."
          :(currentJob?.qaOnly
            ?"Your translation is in the queue. A professional revisor will proofread every word."
            :(bundleJobs.length>1
              ?"Each language is reviewed separately. We’ll email you as each file is ready."
              :"Your draft is in the queue. A revisor will check and refine it.")),
        e("strong",{style:{color:C.text}},currentJob?.clientEmailMasked||"you"),
        " when it’s ready — feel free to close this page."
      ),
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:C.muted,fontSize:12}},
      bundleJobs.length>1&&e("div",{style:{textAlign:"left",maxWidth:460,margin:"8px auto 0"}},
        bundleJobs.map(job=>e("div",{key:job.id,style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,padding:"12px 0",borderTop:`1px solid ${C.border}`}},
          e("div",null,
            e("div",{style:{fontSize:14,fontWeight:600,color:C.text}},job.language),
            e("div",{style:{fontSize:12,color:C.muted,marginTop:2}},job.status==="complete"?"Ready to download":(job.status==="in_progress"?"A revisor is working on it":"Waiting for a revisor"))
          ),
          job.status==="complete"&&e("button",{onClick:async()=>{
            try{ await downloadTranslated(job); }
            catch(err){ setError("Could not download file: "+(err.message||"Unknown error")); }
          },style:{...st.btn,background:C.soft,border:`1px solid ${C.border}`,color:C.text,padding:"8px 14px",fontSize:12}},"Download")
        ))
      ),
      ),
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:C.muted,fontSize:12,marginTop:18}},
        "Checking for updates every few seconds…"
      )
    ),

    stage==="complete"&&currentJob&&e("div",{style:{animation:"fadeUp 0.25s ease"}},
      e("div",{style:{background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:14,padding:"14px 20px",marginBottom:18,display:"flex",alignItems:"center",gap:10}},
        e("span",{style:{fontSize:20}},"✅"),
        e("div",null,
          e("div",{style:{fontSize:13,fontWeight:500,color:C.green}},"Revisor review complete"),
          e("div",{style:{fontSize:12,color:C.muted}},
            currentJob.clientEmailMasked
              ?"Your translation has been human-verified. We also emailed it to "+currentJob.clientEmailMasked+"."
              :"Your translation has been human-verified and is ready to use"
          )
        )
      ),
      currentJob.qaFindings&&(currentJob.qaFindings.summary||(Array.isArray(currentJob.qaFindings.issues)&&currentJob.qaFindings.issues.length>0))&&e("div",{style:{background:C.amberBg,border:`1px solid ${C.amberBorder}`,borderRadius:14,padding:"14px 18px",marginBottom:18}},
        e("div",{style:{fontSize:12,fontWeight:600,color:C.amber,marginBottom:6}},"AI check summary"),
        currentJob.qaFindings.summary&&e("div",{style:{fontSize:13,color:C.text,lineHeight:1.6}},currentJob.qaFindings.summary),
        Array.isArray(currentJob.qaFindings.issues)&&currentJob.qaFindings.issues.length>0&&e("ul",{style:{margin:"10px 0 0",paddingLeft:18,fontSize:12,color:C.muted,lineHeight:1.55}},
          currentJob.qaFindings.issues.map((issue,i)=>e("li",{key:i,style:{marginBottom:4}},
            e("strong",{style:{textTransform:"uppercase",letterSpacing:"0.4px",fontSize:10,color:C.amber}},issue.severity||"note"),
            " — ",issue.detail
          ))
        )
      ),
      e("div",{style:{...cardStyle(),border:`1px solid ${C.greenBorder}`,marginBottom:14}},
      (bundleJobs.length?bundleJobs:[currentJob]).map(job=>e("div",{key:job.id,style:{...cardStyle(),border:`1px solid ${C.greenBorder}`,marginBottom:14}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
          e("span",{style:st.label},"Final Translation — ",job.language),
          e("span",{style:{fontSize:11,background:C.greenBg,border:`1px solid ${C.greenBorder}`,color:C.green,borderRadius:20,padding:"3px 10px"}},"✓ Human reviewed")
        ),
        e("div",{style:{fontSize:14,lineHeight:1.8,color:C.text,whiteSpace:"pre-wrap",marginBottom:18}},job.revisedTranslation),
        e("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
          e("button",{onClick:()=>navigator.clipboard.writeText(job.revisedTranslation||""),style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"8px 16px",fontSize:12,flex:isCompact?"1 1 100%":"0 0 auto"}},isCompact?"Copy":"Copy translation"),
          e("button",{onClick:async()=>{
            try{ await downloadTranslated(job); }
            catch(err){ setError("Could not download file: "+(err.message||"Unknown error")); }
          },style:{...st.btn,background:C.soft,border:`1px solid ${C.border}`,color:C.muted,padding:"8px 16px",fontSize:12,flex:isCompact?"1 1 100%":"0 0 auto"}},isCompact?"Download file":("Download "+(job.language||"file")))
        )
      )),
      downloadNote&&e("div",{style:{fontSize:12,color:C.muted,lineHeight:1.55,marginTop:12,padding:"10px 12px",background:C.soft,border:`1px solid ${C.border}`,borderRadius:10}},downloadNote),
      error&&e("div",{style:{fontSize:12,color:C.error,marginTop:12}},error),
    ),
    e("div",{style:{textAlign:"center",marginTop:4}},
      e("button",{type:"button",onClick:handleReset,style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.text,padding:"10px 18px",fontSize:13}},"Check another file")
    )
    ),

    e("footer",{style:{textAlign:"center",marginTop:88,paddingBottom:48,fontSize:14,color:C.muted,letterSpacing:"-0.2px"}},"Made for careful translations — with a human in the loop. ",e("a",{href:"/about",style:{color:C.accent}},"About Us")," · ",e("a",{href:"/privacy",style:{color:C.accent}},"Privacy"))
  ));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script src="privacy-modal.js"></script>
</body>
</html>
