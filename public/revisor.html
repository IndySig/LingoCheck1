<meta charset="UTF-8">

<style>
  :root{
    --bg:#efe8dc;
    --ink:#2a2438;
    --muted:#6a6178;
    --accent:#6d4fd8;
    --lilac:#d9d0f5;
    --border:rgba(42,36,56,0.10);
    --soft:rgba(255,255,255,0.55);
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    font-weight:400;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  body::before,body::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:0;
    border-radius:50%;
    filter:blur(60px);
  }
  body::before{
    width:min(70vw,640px);
    height:min(70vw,640px);
    top:-12%;
    left:-8%;
    background:rgba(109,79,216,0.16);
    animation:drift 18s var(--ease) infinite alternate;
  }
  body::after{
    width:min(55vw,520px);
    height:min(55vw,520px);
    right:-10%;
    top:18%;
    background:rgba(217,208,245,0.55);
    animation:drift 22s var(--ease) infinite alternate-reverse;
  }
  #root{position:relative;z-index:1;}
  button,input,textarea,select{font-family:inherit;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes rise{from{opacity:0;transform:translateY(28px) scale(0.985)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(24px,18px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  a,button{transition:transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), opacity .2s var(--ease), box-shadow .2s var(--ease);}
  button:not(:disabled):active{transform:translateY(1px);}
  a:hover,button:hover{opacity:0.94}
  button.primary:hover{opacity:1;transform:translateY(-1px);box-shadow:0 12px 28px rgba(109,79,216,0.22);}
  textarea:focus,input:focus,select:focus{border-color:rgba(109,79,216,0.4)!important;outline:none;box-shadow:0 0 0 4px rgba(109,79,216,0.12);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  ::placeholder{color:#9a92a8;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(90,80,120,0.18);border-radius:3px;}
  .lc-nav-pill{
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.65);
    box-shadow:0 8px 32px rgba(42,36,56,0.06);
  }
  .lc-panel{
    background:rgba(255,255,255,0.72);
    backdrop-filter:blur(18px) saturate(1.2);
    -webkit-backdrop-filter:blur(18px) saturate(1.2);
    border:1px solid rgba(255,255,255,0.8);
    box-shadow:0 20px 60px rgba(42,36,56,0.08);
  }
  .lc-display{font-family:'Kufam',system-ui,sans-serif;}
  @media (max-width: 767px){
    body{overflow-x:hidden;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}
  }

<body>
<div id="root"></div>
<script>
const {useState,useEffect,useCallback,useMemo}=React;

const C={deep:"#2a2438",mid:"#5b3fc4",accent:"#6d4fd8",light:"#6d4fd8",pale:"#6d4fd8",lilac:"#d9d0f5",surface:"#ffffff",card:"#ffffff",border:"rgba(42,36,56,0.10)",text:"#2a2438",muted:"#6a6178",white:"#ffffff",green:"#1f7a4d",greenBg:"rgba(238,247,241,0.9)",greenBorder:"rgba(31,122,77,0.18)",amber:"#8a6800",amberBg:"rgba(255,248,230,0.9)",amberBorder:"rgba(138,104,0,0.18)",soft:"rgba(255,255,255,0.55)"};
const st={
  card:{background:"rgba(255,255,255,0.72)",border:"1px solid rgba(255,255,255,0.8)",borderRadius:24,padding:28,boxShadow:"0 20px 60px rgba(42,36,56,0.08)"},
  btn:{fontFamily:"inherit",cursor:"pointer",border:"none",borderRadius:999,fontWeight:600,transition:"transform 0.2s cubic-bezier(0.22,1,0.36,1), opacity 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s"},
  label:{fontSize:13,fontWeight:500,letterSpacing:"-0.01em",textTransform:"none",color:C.muted,marginBottom:8,display:"block"},
  ta:{width:"100%",background:"rgba(255,255,255,0.7)",border:`1px solid ${C.border}`,borderRadius:18,padding:14,fontFamily:"inherit",fontSize:15,color:C.text,lineHeight:1.7,resize:"vertical",boxSizing:"border-box",letterSpacing:"-0.2px"},
  muted:{fontSize:14,color:C.muted,lineHeight:1.65,letterSpacing:"-0.2px"}
};

async function apiFetch(path,opts={}){const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});const data=await r.json().catch(()=> ({}));if(!r.ok){throw new Error(data.error||"Request failed");}return data;}

function Spinner({size=18}){return React.createElement("span",{style:{display:"inline-block",width:size,height:size,border:"2px solid rgba(109,79,216,0.18)",borderTopColor:C.accent,borderRadius:"50%",animation:"spin 0.55s linear infinite",verticalAlign:"middle"}});}

function useMedia(query){
  const [matches,setMatches]=useState(()=>window.matchMedia?window.matchMedia(query).matches:false);
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq=window.matchMedia(query);
    const onChange=()=>setMatches(mq.matches);
    onChange();
    if(mq.addEventListener) mq.addEventListener("change",onChange);
    else mq.addListener(onChange);
    return()=>{
      if(mq.removeEventListener) mq.removeEventListener("change",onChange);
      else mq.removeListener(onChange);
    };
  },[query]);
  return matches;
}

function coalesceShortSegments(segments){
  const src = (segments || []).map(s => String(s || "").trim()).filter(Boolean);
  if(src.length <= 1) return src;
  const avg = src.reduce((sum, s) => sum + s.length, 0) / src.length;
  if(avg >= 28) return src;
  const out = [];
  let buf = [];
  for(const t of src){
    const words = t.split(/\s+/).filter(Boolean).length;
    const short = words <= 12 && t.length < 140 && !/[.!?]$/.test(t) && !/^\d+[\.\)]/.test(t);
    if(short) buf.push(t);
    else{
      if(buf.length){ out.push(buf.join(" ")); buf = []; }
      out.push(t);
    }
  }
  if(buf.length) out.push(buf.join(" "));
  return out.length ? out : src;
}

function getTextSegments(job, text){
  const TS = window.LcTextSegments;
  let segs;
  if(job && Array.isArray(job.originalSegments) && job.originalSegments.length){
    segs = TS ? TS.normalizeDocumentSegments(job.originalSegments) : job.originalSegments.map(s => String(s||"").trim()).filter(Boolean);
  }else{
    const raw = String(text||"").trim();
    if(!raw) return [];
    segs = TS ? TS.normalizeDocumentSegments(raw) : raw.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
  }
  return coalesceShortSegments(segs);
}

function splitIntoSentences(segment){
  const TS = window.LcTextSegments;
  return TS ? TS.splitSegmentIntoSentences(segment) : [String(segment||"").trim()].filter(Boolean);
}

function splitTextByWeights(text, weights){
  const words = String(text||"").split(/\s+/).filter(Boolean);
  if(!weights.length) return [words.join(" ")];
  const total = weights.reduce((a,b)=>a+b,0) || 1;
  const result = [];
  let idx = 0;
  for(let i=0;i<weights.length;i++){
    const take = i === weights.length - 1
      ? words.length - idx
      : Math.max(0, Math.round(words.length * (weights[i] / total)));
    result.push(words.slice(idx, idx + take).join(" "));
    idx += take;
  }
  if(idx < words.length && result.length){
    result[result.length - 1] = [result[result.length - 1], words.slice(idx).join(" ")].filter(Boolean).join(" ");
  }
  return result;
}

function alignTranslationToSegments(origSegments, translationText){
  const TS = window.LcTextSegments;
  const orig = Array.isArray(origSegments)
    ? (TS ? TS.normalizeDocumentSegments(origSegments) : origSegments.map((s) => String(s || "").trim()).filter(Boolean))
    : getTextSegments(null, origSegments);
  const n = orig.length;
  if(n === 0) return [];
  const t = String(translationText||"").trim();
  if(!t) return Array.from({length:n}, ()=>"");

  const parts = window.LcTextSegments
    ? LcTextSegments.normalizeDocumentSegments(t)
    : t.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
  if(parts.length === n) return parts;

  const weights = orig.map(s => Math.max(1, String(s||"").replace(/\s+/g," ").trim().length));

  if(parts.length > n){
    const out = [];
    let j = 0;
    for(let i=0;i<n;i++){
      if(i === n - 1){
        out.push(parts.slice(j).join("\n\n"));
        break;
      }
      const remaining = parts.length - j;
      const slotsLeft = n - i;
      const weightLeft = weights.slice(i).reduce((a,b)=>a+b,0) || 1;
      let take = Math.max(1, Math.round(remaining * (weights[i] / weightLeft)));
      take = Math.min(take, remaining - (slotsLeft - 1));
      out.push(parts.slice(j, j + take).join("\n\n"));
      j += take;
    }
    return out;
  }

  return splitTextByWeights(t.replace(/\n+/g, " "), weights);
}

function buildSentenceReview(job, sourceText, translationText){
  const TS = window.LcTextSegments;
  const segments = getTextSegments(job, sourceText);
  if(!segments.length) return { sentences: [], transSentences: [], paraMap: [], paragraphCount: 0 };

  if(TS && TS.alignSentenceTranslations){
    const storedTrans = job?.translationSentences;
    const review = TS.alignSentenceTranslations(
      segments,
      translationText,
      storedTrans
    );
    if(job && job.qaOnly){
      return {
        sentences: review.sentences,
        transSentences: review.sentences.slice(),
        paraMap: review.paraMap,
        paragraphCount: review.paragraphCount
      };
    }
    return review;
  }

  const units = TS ? TS.buildSentenceUnits(segments) : { sentences: [], paraMap: [], paragraphCount: 0 };
  return {
    sentences: units.sentences,
    transSentences: units.sentences.map(() => ""),
    paraMap: units.paraMap,
    paragraphCount: units.paragraphCount
  };
}

function sentencesToParagraphText(sentences, paraMap, paragraphCount){
  const buckets = Array.from({ length: Math.max(1, paragraphCount) }, () => []);
  (sentences || []).forEach((s, i) => {
    const pi = paraMap[i] ?? 0;
    const part = String(s || "").trim();
    if(part) buckets[pi].push(part);
  });
  const paras = buckets.map((b) => b.join(" ")).filter(Boolean);
  return window.LcTextSegments ? LcTextSegments.segmentsToDisplayText(paras) : paras.join("\n\n");
}

function fmtEur(cents){
  const eur = (cents||0)/100;
  return eur.toLocaleString(undefined,{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
}

function localMonthKey(ts){
  const d = new Date(ts||Date.now());
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function localMonthLabel(ts){
  const d = new Date(ts||Date.now());
  return d.toLocaleDateString(undefined,{year:"numeric",month:"long"});
}

function formatDateTime(ts){
  if(!ts) return "—";
  return new Date(ts).toLocaleString();
}

const STALE_CLAIM_MS = 4 * 60 * 60 * 1000;

function isStaleClaim(job){
  if(!job || job.status==="complete" || !job.claimedByRevisorId) return false;
  const claimedAt = typeof job.claimedAt==="number" ? job.claimedAt : 0;
  return claimedAt>0 && (Date.now()-claimedAt)>STALE_CLAIM_MS;
}

function isQueuedJob(job){
  if(!job || job.status==="complete") return false;
  if(!job.claimedByRevisorId) return true;
  return isStaleClaim(job);
}

function formatWaiting(ts){
  const ms = Math.max(0, Date.now()-(ts||0));
  const m = Math.floor(ms/60000);
  if(m<1) return "just now";
  if(m<60) return "waiting "+m+"m";
  const h = Math.floor(m/60);
  if(h<48) return "waiting "+h+"h";
  return "waiting "+Math.floor(h/24)+"d";
}

function jobPayoutCents(job, rateCents){
  if(typeof job.payoutCents==="number") return Math.round(job.payoutCents);
  const words = typeof job.sourceWordCount==="number" ? job.sourceWordCount : 0;
  return Math.round(words * (rateCents||2.5));
}

function RevisorApp(){
  const[ready,setReady]=useState(false);
  const[authErr,setAuthErr]=useState("");
  const[me,setMe]=useState(null);
  const[allJobs,setAllJobs]=useState([]);
  const[tab,setTab]=useState("queue"); // queue | mine | finance
  const[focusJobId,setFocusJobId]=useState(null);
  const[payoutRate,setPayoutRate]=useState(2.5);

  const refresh=useCallback(async()=>{
    try{
      const loaded=await apiFetch("/api/revisor/jobs?scope=all");
      setAllJobs(Array.isArray(loaded)?loaded:[]);
    }catch{}
  },[]);

  useEffect(()=>{
    let cancelled=false;
    let timer=null;
    (async()=>{
      try{
        const meResp=await apiFetch("/api/auth/me",{method:"GET"});
        if(!meResp.authenticated){location.href="/login";return;}
        if(cancelled) return;
        setMe(meResp);
        try{
          const cfg=await apiFetch("/api/public-config");
          if(!cancelled && typeof cfg.payoutPerWordCents==="number") setPayoutRate(cfg.payoutPerWordCents);
        }catch{}
        setReady(true);
        refresh();
        timer=setInterval(refresh,2500);
      }catch(e){
        setAuthErr(e.message);
      }
    })();
    return ()=>{cancelled=true; if(timer) clearInterval(timer);};
  },[refresh]);

  async function logout(){
    try{await apiFetch("/api/auth/logout",{method:"POST"});}catch{}
    location.href="/login";
  }

  const updateJob=async(id,patch)=>apiFetch(`/api/revisor/jobs/${id}`,{method:"PATCH",body:JSON.stringify(patch)})
    .then(j=>{setAllJobs(prev=>prev.map(x=>x.id===id?j:x));return j;});

  async function claimJob(id){
    const j=await apiFetch(`/api/revisor/jobs/${id}/claim`,{method:"POST"});
    setAllJobs(prev=>{
      const exists=prev.some(x=>x.id===id);
      return exists?prev.map(x=>x.id===id?j:x):[j,...prev];
    });
    return j;
  }

  async function unclaimJob(id){
    const j=await apiFetch(`/api/revisor/jobs/${id}/unclaim`,{method:"POST"});
    setAllJobs(prev=>prev.map(x=>x.id===id?j:x));
    return j;
  }

  if(authErr){
    return React.createElement("div",{style:{maxWidth:640,margin:"0 auto",padding:"60px 20px",textAlign:"center"}},
      React.createElement("div",{style:{...st.card}},React.createElement("div",{style:{fontSize:12,color:"#c43d3d"}},authErr))
    );
  }
  if(!ready||!me){
    return React.createElement("div",{style:{maxWidth:640,margin:"0 auto",padding:"60px 20px",textAlign:"center"}},
      React.createElement("div",{style:{...st.card}},React.createElement(Spinner,{size:24}),React.createElement("div",{style:{marginTop:10,fontSize:13,color:C.muted}},"Loading revisor panel…"))
    );
  }

  return React.createElement(RevisorView,{me,allJobs,tab,setTab,updateJob,claimJob,unclaimJob,focusJobId,setFocusJobId,payoutRate,onLogout:logout});
}

function Header({me,tab,setTab,onLogout,counts,isCompact}){
  const e=React.createElement;
  function tabBtn(id,label,badge){
    const active=tab===id;
    return e("button",{onClick:()=>setTab(id),style:{...st.btn,padding:isCompact?"8px 10px":"8px 14px",fontSize:12,background:active?C.lilac:"rgba(255,255,255,0.55)",border:`1px solid ${active?"rgba(109,79,216,0.28)":C.border}`,color:active?C.accent:C.muted,display:"inline-flex",alignItems:"center",gap:6,flex:isCompact?"1 1 calc(50% - 4px)":"0 0 auto",justifyContent:"center"}},
      label,
      typeof badge==="number"&&badge>0&&e("span",{style:{fontSize:11,fontWeight:600,background:active?"rgba(255,255,255,0.7)":C.soft,borderRadius:999,padding:"1px 8px",color:active?C.accent:C.text}},badge)
    );
  }
  return e("div",{style:{padding:isCompact?"14px 0 0":"20px 0 0",marginBottom:isCompact?18:24}},
    e("div",{className:"lc-nav-pill",style:{borderRadius:isCompact?24:999,padding:isCompact?"12px":"10px 14px",display:"flex",alignItems:isCompact?"stretch":"center",justifyContent:"space-between",gap:12,flexDirection:isCompact?"column":"row"}},
      e("div",{style:{paddingLeft:isCompact?4:6}},
        e("div",{className:"lc-display",style:{fontSize:isCompact?20:22,fontWeight:600,color:C.text,letterSpacing:"-0.02em"}},"Lingo",e("span",{style:{color:C.accent}},"Check")),
        e("div",{style:{fontSize:13,color:C.muted,marginTop:2,wordBreak:"break-word"}},"Reviewer · ",e("span",{style:{color:C.text}},me.displayName||me.email||me.username))
      ),
      e("div",{style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",width:isCompact?"100%":"auto"}},
        tabBtn("queue","Queue",counts.queue),
        tabBtn("mine","My jobs",counts.mine),
        tabBtn("finance","Finance"),
        e("button",{onClick:onLogout,style:{...st.btn,background:"rgba(255,255,255,0.7)",border:`1px solid ${C.border}`,color:C.muted,fontSize:12,padding:"8px 14px",flex:isCompact?"1 1 100%":"0 0 auto"}},"Log out")
      )
    )
  );
}

function QueueTab({me,allJobs,claimJob,setTab,setFocusJobId,isCompact,payoutRate}){
  const e=React.createElement;
  const [claimingId,setClaimingId]=useState(null);
  const [err,setErr]=useState("");
  const [langFilter,setLangFilter]=useState("all");

  const languages=useMemo(()=>{
    const set=new Set();
    allJobs.forEach(j=>{ if(isQueuedJob(j) && j.language) set.add(j.language); });
    return Array.from(set).sort();
  },[allJobs]);

  const queue=useMemo(()=>allJobs
    .filter(isQueuedJob)
    .filter(j=>langFilter==="all"||j.language===langFilter)
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))
  ,[allJobs,langFilter]);

  async function onClaim(id){
    setErr("");
    setClaimingId(id);
    try{
      const j=await claimJob(id);
      setFocusJobId(j.id);
      setTab("mine");
    }catch(ex){
      setErr(ex.message);
    }finally{
      setClaimingId(null);
    }
  }

  if(queue.length===0 && langFilter==="all"){
    return e("div",{style:{textAlign:"center",padding:"80px 0"}},
      e("div",{style:{fontSize:40,marginBottom:18}},"✓"),
      e("div",{className:"lc-display",style:{fontSize:24,color:C.text,marginBottom:8}},"No jobs waiting"),
      e("div",{style:st.muted},"New unclaimed requests will appear here automatically"),
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginTop:18,fontSize:11,color:C.muted}},
        e("span",{style:{width:6,height:6,borderRadius:"50%",background:C.accent,display:"inline-block",animation:"pulse 1.5s ease-in-out infinite"}}),
        "Listening for new requests…"
      )
    );
  }

  return e("div",null,
    e("div",{style:{display:"flex",alignItems:isCompact?"stretch":"center",justifyContent:"space-between",gap:10,marginBottom:12,flexWrap:"wrap"}},
      e("span",{style:{...st.label,marginBottom:0}},"Available jobs · claim to start working"),
      e("select",{value:langFilter,onChange:ev=>setLangFilter(ev.target.value),style:{background:"rgba(255,255,255,0.7)",border:`1px solid ${C.border}`,borderRadius:14,padding:"8px 12px",fontFamily:"inherit",fontSize:12,fontWeight:600,color:C.text,outline:"none",cursor:"pointer",minWidth:isCompact?"100%":140}},
        e("option",{value:"all"},"All languages"),
        languages.map(lang=>e("option",{key:lang,value:lang},lang))
      )
    ),
    err&&e("div",{style:{margin:"0 0 12px",fontSize:12,color:"#c43d3d"}},err),
    queue.length===0
      ?e("div",{style:{...st.card,textAlign:"center",padding:36,color:C.muted,fontSize:13}},"No open jobs for this language filter.")
      :e("div",{style:{display:"grid",gridTemplateColumns:"1fr",gap:12}},
        queue.map(job=>{
          const payout=jobPayoutCents(job, payoutRate);
          const stale=isStaleClaim(job);
          return e("div",{key:job.id,style:{...st.card,padding:isCompact?16:18,animation:"fadeUp 0.25s ease",display:"grid",gridTemplateColumns:isCompact?"1fr":"1fr auto",gap:16,alignItems:isCompact?"stretch":"center"}},
            e("div",null,
              e("div",{style:{fontSize:13,fontWeight:600,color:C.text,marginBottom:6,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
                job.qaOnly?job.language:"EN → "+job.language,
                job.qaOnly&&e("span",{style:{fontSize:11,fontWeight:500,color:C.muted,background:C.soft,border:`1px solid ${C.border}`,padding:"2px 8px",borderRadius:8}},"QA only"),
                stale&&e("span",{style:{fontSize:11,fontWeight:500,color:C.amber,background:C.amberBg,border:`1px solid ${C.amberBorder}`,padding:"2px 8px",borderRadius:8}},"Stale — reclaim"),
                typeof job.sourceWordCount==="number"&&e("span",{style:{fontSize:11,fontWeight:500,color:C.muted}}, job.sourceWordCount," words · ",fmtEur(payout))
              ),
              e("div",{style:{fontSize:12,color:C.muted,lineHeight:1.6,maxHeight:60,overflow:"hidden"}},(job.qaOnly?job.aiTranslation:job.originalText||"").substring(0,260),(job.qaOnly?job.aiTranslation:job.originalText||"").length>260?"…":""),

function ReviewEditor({selectedJob,updateJob,unclaimJob,onDone,onReleased,isCompact,payoutRate}){
  const e=React.createElement;
  const[editedText,setEditedText]=useState(selectedJob.revisedTranslation||selectedJob.aiTranslation||"");
  const[mode,setMode]=useState("sentences");
  const[origSentences,setOrigSentences]=useState([]);
  const[editedSentences,setEditedSentences]=useState([]);
  const[sentenceParaMap,setSentenceParaMap]=useState([]);
  const[paragraphCount,setParagraphCount]=useState(0);
  const[sending,setSending]=useState(false);
  const[saving,setSaving]=useState(false);
  const[releasing,setReleasing]=useState(false);
  const[savedNote,setSavedNote]=useState("");
  const[isWide,setIsWide]=useState(()=>window.matchMedia && window.matchMedia("(min-width: 900px)").matches);

  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq = window.matchMedia("(min-width: 900px)");
    const onChange = () => setIsWide(!!mq.matches);
    onChange();
    if(mq.addEventListener) mq.addEventListener("change", onChange);
    else mq.addListener(onChange);
    return () => {
      if(mq.removeEventListener) mq.removeEventListener("change", onChange);
      else mq.removeListener(onChange);
    };
  },[]);

  useEffect(()=>{
    setEditedText(selectedJob.revisedTranslation||selectedJob.aiTranslation||"");
    const source = selectedJob.qaOnly ? (selectedJob.aiTranslation||"") : selectedJob.originalText;
    const translation = selectedJob.revisedTranslation||selectedJob.aiTranslation||"";
    const review = buildSentenceReview(selectedJob, source, translation);
    setOrigSentences(review.sentences);
    setEditedSentences(review.transSentences);
    setSentenceParaMap(review.paraMap);
    setParagraphCount(review.paragraphCount);
    setMode("sentences");
    setSavedNote("");
  },[selectedJob.id]);

  function draftPayload(){
    const finalText = mode==="sentences"
      ? sentencesToParagraphText(editedSentences, sentenceParaMap, paragraphCount)
      : (editedText||"").trim();
    const patch = { revisedTranslation: finalText };
    if(mode==="sentences" && editedSentences.length){
      patch.translationSentences = editedSentences.map(s => String(s||"").trim());
    }
    return { finalText, patch };
  }

  async function handleSaveDraft(){
    const { finalText, patch } = draftPayload();
    if(!finalText){ alert("Nothing to save yet."); return; }
    setSaving(true);
    try{
      await updateJob(selectedJob.id, patch);
      setSavedNote("Draft saved");
      setTimeout(()=>setSavedNote(""),2500);
    }catch(ex){
      alert(ex.message);
    }finally{
      setSaving(false);
    }
  }

  async function handleSend(){
    const { finalText, patch } = draftPayload();
    if(!finalText) return;
    setSending(true);
    try{
      await updateJob(selectedJob.id, { ...patch, status:"complete" });
      onDone&&onDone();
    }catch(ex){
      alert(ex.message);
    }finally{
      setSending(false);
    }
  }

  async function handleRelease(){
    if(!confirm("Release this job back to the queue?")) return;
    setReleasing(true);
    try{
      await unclaimJob(selectedJob.id);
      onReleased&&onReleased();
    }catch(ex){
      alert(ex.message);
    }finally{
      setReleasing(false);
    }
  }

  const paneHeight = isWide ? 420 : (isCompact ? 260 : 320);
  const payoutHint = fmtEur(jobPayoutCents(selectedJob, payoutRate));

  return e("div",{style:{animation:"fadeUp 0.25s ease"}},
    e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:10,flexWrap:"wrap"}},
      e("span",{style:{...st.label,marginBottom:0}},selectedJob.qaOnly?"Proofread client translation":"Review & edit translation"),
      e("div",{style:{fontSize:12,color:C.muted}},
        typeof selectedJob.sourceWordCount==="number"?selectedJob.sourceWordCount+" words · ":"",
        "payout ",payoutHint
      )
    ),
    selectedJob.qaOnly&&e("div",{style:{background:C.amberBg,border:`1px solid ${C.amberBorder}`,borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:12,color:C.amber,lineHeight:1.55}},
      "This client submitted their own AI translation. LingoCheck already ran a hallucination scan — proofread the text below.",
      selectedJob.qaFindings?.summary&&e("div",{style:{marginTop:8,opacity:0.95}},selectedJob.qaFindings.summary),
      Array.isArray(selectedJob.qaFindings?.issues)&&selectedJob.qaFindings.issues.length>0&&e("ul",{style:{margin:"8px 0 0",paddingLeft:18}},
        selectedJob.qaFindings.issues.map((issue,i)=>e("li",{key:i,style:{marginBottom:3}},
          e("strong",{style:{textTransform:"uppercase",fontSize:10,letterSpacing:"0.4px"}},issue.severity||"note"),
          " — ",issue.detail
        ))

    ),
    e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",margin:"0 0 10px",flexWrap:"wrap",gap:10}},
      e("div",{style:{fontSize:12,color:C.muted,flex:isCompact?"1 1 100%":"0 0 auto"}},"Mode:"),
      e("div",{style:{display:"flex",gap:8,flex:isCompact?"1 1 100%":"0 0 auto"}},
        e("button",{onClick:()=>setMode("full"),style:{...st.btn,background:mode==="full"?C.lilac:"rgba(255,255,255,0.55)",border:`1px solid ${mode==="full"?"rgba(109,79,216,0.28)":C.border}`,color:mode==="full"?C.accent:C.muted,fontSize:12,padding:"6px 10px",flex:isCompact?1:"0 0 auto"}},"Full text"),

function FinanceTab({me,allJobs,isCompact,payoutRate}){
  const e=React.createElement;
  const RATE = payoutRate||2.5;

  const completed = useMemo(()=>allJobs
    .filter(j=>j.completedByRevisorId===me.revisorId && j.status==="complete")
    .sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))
  ,[allJobs,me.revisorId]);

  const items = useMemo(()=>completed.map(j=>{
    const words = typeof j.sourceWordCount==="number" ? j.sourceWordCount : 0;
    const earningsCents = jobPayoutCents(j, RATE);
    return {id:j.id,language:j.language,completedAt:j.completedAt||j.createdAt,sourceWordCount:words,earningsCents};
  }),[completed,RATE]);

  const totalCents = items.reduce((a,b)=>a+b.earningsCents,0);
  const totalWords = items.reduce((a,b)=>a+b.sourceWordCount,0);

  const nowKey = localMonthKey(Date.now());
  const monthGroups = useMemo(()=>{
    const map = new Map();
    for(const it of items){
      const key = localMonthKey(it.completedAt);
      const label = localMonthLabel(it.completedAt);
      const cur = map.get(key) || {key,label,items:[],cents:0,words:0};
      cur.items.push(it);
      cur.cents += it.earningsCents;
      cur.words += it.sourceWordCount;
      map.set(key, cur);
    }
    const arr = Array.from(map.values());
    arr.sort((a,b)=> b.key.localeCompare(a.key));
    return arr;
  },[items]);

  const thisMonth = monthGroups.find(g=>g.key===nowKey) || {cents:0,words:0,items:[]};
  const rateLabel = "€"+(RATE/100).toFixed(3).replace(/0+$/,"").replace(/\.$/,"")+" / word";

  function statCard(label,value,sub){

      statCard("This month", fmtEur(thisMonth.cents), thisMonth.words+" words · "+(thisMonth.items?.length||0)+" jobs"),
      statCard("All time", fmtEur(totalCents), totalWords+" words · "+items.length+" jobs"),
      statCard("Rate", rateLabel, "Per source word")
    ),

    monthGroups.length===0
      ? e("div",{style:{...st.card,textAlign:"center",padding:40,color:C.muted,fontSize:13}},"No completed assignments yet — finish a job to see earnings here.")
      : e("div",{style:{display:"flex",flexDirection:"column",gap:14}},
          monthGroups.map(g=>e("div",{key:g.key,style:{...st.card,padding:0,overflow:"hidden"}},
            e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px",borderBottom:`1px solid ${C.border}`,background:C.soft}},
              e("div",null,
                e("div",{style:{fontFamily:"inherit",fontSize:18,color:C.text}},g.label),
                e("div",{style:{fontSize:11,color:C.muted,marginTop:2}},g.items.length," job",g.items.length===1?"":"s"," · ",g.words," words")
              ),
              e("div",{style:{fontFamily:"inherit",fontSize:22,color:C.pale}}, fmtEur(g.cents))
            ),
            e("div",{style:{padding:"4px 0"}},
              g.items.map((it,i)=>e("div",{key:it.id,style:{display:"grid",gridTemplateColumns:isCompact?"1fr":"1fr 120px 100px 110px",gap:isCompact?4:8,padding:isCompact?"12px 16px":"10px 20px",borderTop:i===0?"none":`1px solid ${C.border}`,fontSize:13,alignItems:isCompact?"start":"center"}},

                e("div",{style:{color:C.muted,fontSize:12}}, it.sourceWordCount," words"),

              ))
            )

    mine: allJobs.filter(j=>(j.claimedByRevisorId===me.revisorId || j.completedByRevisorId===me.revisorId) && j.status!=="complete").length
  };

  return e("div",{style:{maxWidth:1280,margin:"0 auto",padding:isCompact?"0 16px 40px":"0 24px 48px"}},
    e(Header,{me,tab,setTab,onLogout,counts,isCompact}),
    e("div",{style:{animation:"rise 0.45s var(--ease)"}},
      tab==="queue" && e(QueueTab,{me,allJobs,claimJob,setTab,setFocusJobId,isCompact,payoutRate}),
      tab==="mine" && e(MyAssignmentsTab,{me,allJobs,updateJob,unclaimJob,focusJobId,setFocusJobId,isCompact,payoutRate}),
      tab==="finance" && e(FinanceTab,{me,allJobs,isCompact,payoutRate})
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(RevisorApp));
</script>
</body>
</html>
