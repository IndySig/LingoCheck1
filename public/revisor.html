<script>
const {useState,useEffect,useCallback,useMemo,useRef}=React;

const C={deep:"#2a2438",mid:"#5b3fc4",accent:"#6d4fd8",light:"#6d4fd8",pale:"#6d4fd8",lilac:"#d9d0f5",surface:"#ffffff",card:"#ffffff",border:"rgba(42,36,56,0.10)",text:"#2a2438",muted:"#6a6178",white:"#ffffff",green:"#1f7a4d",greenBg:"rgba(238,247,241,0.9)",greenBorder:"rgba(31,122,77,0.18)",amber:"#8a6800",amberBg:"rgba(255,248,230,0.9)",amberBorder:"rgba(138,104,0,0.18)",soft:"rgba(255,255,255,0.55)"};
const st={
  card:{background:"rgba(255,255,255,0.72)",border:"1px solid rgba(255,255,255,0.8)",borderRadius:24,padding:28,boxShadow:"0 20px 60px rgba(42,36,56,0.08)"},
  btn:{fontFamily:"inherit",cursor:"pointer",border:"none",borderRadius:999,fontWeight:600,transition:"transform 0.2s cubic-bezier(0.22,1,0.36,1), opacity 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s"},
  label:{fontSize:13,fontWeight:500,letterSpacing:"-0.01em",textTransform:"none",color:C.muted,marginBottom:8,display:"block"},
  ta:{width:"100%",background:"rgba(255,255,255,0.7)",border:`1px solid ${C.border}`,borderRadius:18,padding:14,fontFamily:"inherit",fontSize:15,color:C.text,lineHeight:1.7,resize:"vertical",boxSizing:"border-box",letterSpacing:"-0.2px"},
  muted:{fontSize:14,color:C.muted,lineHeight:1.65,letterSpacing:"-0.2px"}
};

async function apiFetch(path,opts={}){const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});const data=await r.json().catch(()=> ({}));if(!r.ok){throw new Error(data.error||"Request failed");}return data;}

function Spinner({size=18}){return React.createElement("span",{style:{display:"inline-block",width:size,height:size,border:"2px solid rgba(109,79,216,0.18)",borderTopColor:C.accent,borderRadius:"50%",animation:"spin 0.55s linear infinite",verticalAlign:"middle"}});}

function useMedia(query){
  const [matches,setMatches]=useState(()=>window.matchMedia?window.matchMedia(query).matches:false);
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq=window.matchMedia(query);
    const onChange=()=>setMatches(mq.matches);
    onChange();
    if(mq.addEventListener) mq.addEventListener("change",onChange);
    else mq.addListener(onChange);
    return()=>{
      if(mq.removeEventListener) mq.removeEventListener("change",onChange);
      else mq.removeListener(onChange);
    };
  },[query]);
  return matches;
}

function coalesceShortSegments(segments){
  const src = (segments || []).map(s => String(s || "").trim()).filter(Boolean);
  if(src.length <= 1) return src;
  const avg = src.reduce((sum, s) => sum + s.length, 0) / src.length;
  if(avg >= 28) return src;
  const out = [];
  let buf = [];
  for(const t of src){
    const words = t.split(/\s+/).filter(Boolean).length;
    const short = words <= 12 && t.length < 140 && !/[.!?]$/.test(t) && !/^\d+[\.\)]/.test(t);
    if(short) buf.push(t);
    else{
      if(buf.length){ out.push(buf.join(" ")); buf = []; }
      out.push(t);
    }
  }
  if(buf.length) out.push(buf.join(" "));
  return out.length ? out : src;
}

function getTextSegments(job, text){
  const TS = window.LcTextSegments;
  let segs;
  if(job && Array.isArray(job.originalSegments) && job.originalSegments.length){
    segs = TS ? TS.normalizeDocumentSegments(job.originalSegments) : job.originalSegments.map(s => String(s||"").trim()).filter(Boolean);
  }else{
    const raw = String(text||"").trim();
    if(!raw) return [];
    segs = TS ? TS.normalizeDocumentSegments(raw) : raw.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
  }
  return coalesceShortSegments(segs);
}

function splitIntoSentences(segment){
  const TS = window.LcTextSegments;
  return TS ? TS.splitSegmentIntoSentences(segment) : [String(segment||"").trim()].filter(Boolean);
}

function splitTextByWeights(text, weights){
  const words = String(text||"").split(/\s+/).filter(Boolean);
  if(!weights.length) return [words.join(" ")];
  const total = weights.reduce((a,b)=>a+b,0) || 1;
  const result = [];
  let idx = 0;
  for(let i=0;i<weights.length;i++){
    const take = i === weights.length - 1
      ? words.length - idx
      : Math.max(0, Math.round(words.length * (weights[i] / total)));
    result.push(words.slice(idx, idx + take).join(" "));
    idx += take;
  }
  if(idx < words.length && result.length){
    result[result.length - 1] = [result[result.length - 1], words.slice(idx).join(" ")].filter(Boolean).join(" ");
  }
  return result;
}

function alignTranslationToSegments(origSegments, translationText){
  const TS = window.LcTextSegments;
  const orig = Array.isArray(origSegments)
    ? (TS ? TS.normalizeDocumentSegments(origSegments) : origSegments.map((s) => String(s || "").trim()).filter(Boolean))
    : getTextSegments(null, origSegments);
  const n = orig.length;
  if(n === 0) return [];
  const t = String(translationText||"").trim();
  if(!t) return Array.from({length:n}, ()=>"");

  const parts = window.LcTextSegments
    ? LcTextSegments.normalizeDocumentSegments(t)
    : t.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
  if(parts.length === n) return parts;

  const weights = orig.map(s => Math.max(1, String(s||"").replace(/\s+/g," ").trim().length));

  if(parts.length > n){
    const out = [];
    let j = 0;
    for(let i=0;i<n;i++){
      if(i === n - 1){
        out.push(parts.slice(j).join("\n\n"));
        break;
      }
      const remaining = parts.length - j;
      const slotsLeft = n - i;
      const weightLeft = weights.slice(i).reduce((a,b)=>a+b,0) || 1;
      let take = Math.max(1, Math.round(remaining * (weights[i] / weightLeft)));
      take = Math.min(take, remaining - (slotsLeft - 1));
      out.push(parts.slice(j, j + take).join("\n\n"));
      j += take;
    }
    return out;
  }

  return splitTextByWeights(t.replace(/\n+/g, " "), weights);
}

function splitDocumentSentences(text){
  const raw = String(text || "").trim();
  if(!raw) return [];
  const TS = window.LcTextSegments;
  if(!TS) return [raw];
  return TS.normalizeDocumentSegments(raw).flatMap(function(part){
    const bits = TS.splitSegmentIntoSentences(part);
    return bits.length ? bits : [part];
  });
}

function fitSentenceList(parts, count){
  const src = (parts || []).slice();
  if(count <= 0) return [];
  if(src.length === count) return src;
  if(src.length > count){
    const head = src.slice(0, count - 1);
    head.push(src.slice(count - 1).join(" "));
    return head;
  }
  while(src.length < count) src.push("");
  return src;
}

function buildSentenceReview(job, sourceText, translationText){
  const TS = window.LcTextSegments;
  const segments = getTextSegments(job, sourceText);
  if(!segments.length) return { sentences: [], transSentences: [], paraMap: [], paragraphCount: 0 };

  if(TS && TS.alignSentenceTranslations){
    const storedTrans = job?.qaOnly ? null : job?.translationSentences;
    const review = TS.alignSentenceTranslations(
      segments,
      translationText,
      storedTrans
    );
    return review;
  }

  const units = TS ? TS.buildSentenceUnits(segments) : { sentences: [], paraMap: [], paragraphCount: 0 };
  return {
    sentences: units.sentences,
    transSentences: units.sentences.map(() => ""),
    paraMap: units.paraMap,
    paragraphCount: units.paragraphCount
  };
}

function jobHasEnglishSource(job){
  return !!String(job && job.originalText || "").trim();
}

function jobPreviewText(job){
  if(job && job.qaOnly && jobHasEnglishSource(job)) return job.originalText || "";
  if(job && job.qaOnly) return job.aiTranslation || "";
  return (job && job.originalText) || "";
}

function aiChangedTranslation(job){
  const customer = String(job && job.customerTranslation || "");
  const checked = String(job && job.aiTranslation || "");
  return !!customer && customer !== checked;
}

const trackDelStyle = {
  textDecoration:"line-through",
  textDecorationColor:"#f87171",
  color:"#b45454",
  background:"none",
  whiteSpace:"pre-wrap",
  margin:"0 1px"
};
const trackInsStyle = {
  textDecoration:"none",
  background:"rgba(109,79,216,0.22)",
  borderRadius:3,
  padding:"0 2px",
  margin:"0 1px",
  color:"inherit",
  whiteSpace:"pre-wrap"
};

function trackChangeNodes(e, parts){
  return (parts || []).map(function(p, i){
    if(p.type === "removed") return e("del",{key:i,style:trackDelStyle}, p.text);
    if(p.type === "added") return e("ins",{key:i,style:trackInsStyle}, p.text);
    return e("span",{key:i}, p.text);
  });
}

function customerCorrectionParts(oldText, newText){
  const diff = window.LcCharDiff;
  if(!diff || typeof diff.charDiff !== "function") return [{ type:"equal", text:String(newText || "") }];
  return diff.charDiff(oldText || "", newText || "");
}

function MarkedTranslation({customerText, checkedText}){
  const e = React.createElement;
  const parts = useMemo(function(){
    if(typeof customerText !== "string") return [];
    return customerCorrectionParts(customerText, checkedText || "");
  }, [customerText, checkedText]);
  const changed = parts.some(function(p){ return p.type !== "equal"; });
  if(!customerText) return null;
  return e("div",null,
    e("div",{style:{fontSize:12,color:C.muted,lineHeight:1.5,marginBottom:8}},
      changed
        ?"Struck-out text is the customer’s wording. Highlighted text was added by LingoCheck."
        :"LingoCheck did not change the customer’s translation."
    ),
    e("div",{style:{fontSize:13,color:C.text,lineHeight:1.75,whiteSpace:"pre-wrap"}},
      trackChangeNodes(e, parts)
    )
  );
}

function shortLang(language){
  const name = String(language || "").trim().toLowerCase();
  const known = {dutch:"NL",nederlands:"NL",english:"EN",german:"DE",deutsch:"DE",french:"FR",spanish:"ES",italian:"IT",portuguese:"PT"};
  if(known[name]) return known[name];
  if(/^[a-z]{2}([-_][a-z]{2})?$/i.test(name)) return name.slice(0, 2).toUpperCase();
  return "";
}

function growSentenceField(el){
  if(!el || !el.style) return;
  el.style.height = "0px";
  el.style.height = el.scrollHeight + "px";
}

function sentencesToParagraphText(sentences, paraMap, paragraphCount){
  const buckets = Array.from({ length: Math.max(1, paragraphCount) }, () => []);
  (sentences || []).forEach((s, i) => {
    const pi = paraMap[i] ?? 0;
    const part = String(s || "").trim();
    if(part) buckets[pi].push(part);
  });
  const paras = buckets.map((b) => b.join(" ")).filter(Boolean);
  return window.LcTextSegments ? LcTextSegments.segmentsToDisplayText(paras) : paras.join("\n\n");
}

function fmtEur(cents){
  const eur = (cents||0)/100;
  return eur.toLocaleString(undefined,{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
}

function localMonthKey(ts){
  const d = new Date(ts||Date.now());
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function localMonthLabel(ts){
  const d = new Date(ts||Date.now());
  return d.toLocaleDateString(undefined,{year:"numeric",month:"long"});
}

function formatDateTime(ts){
  if(!ts) return "—";
  return new Date(ts).toLocaleString();
}

const STALE_CLAIM_MS = 4 * 60 * 60 * 1000;

function isStaleClaim(job){
  if(!job || job.status==="complete" || !job.claimedByRevisorId) return false;
  const claimedAt = typeof job.claimedAt==="number" ? job.claimedAt : 0;
  return claimedAt>0 && (Date.now()-claimedAt)>STALE_CLAIM_MS;
}

function isQueuedJob(job){
  if(!job || job.status==="complete") return false;
  if(!job.claimedByRevisorId) return true;
  return isStaleClaim(job);
}

function formatWaiting(ts){
  const ms = Math.max(0, Date.now()-(ts||0));
  const m = Math.floor(ms/60000);
  if(m<1) return "just now";
  if(m<60) return "waiting "+m+"m";
  const h = Math.floor(m/60);
  if(h<48) return "waiting "+h+"h";
  return "waiting "+Math.floor(h/24)+"d";
}

function jobPayoutCents(job, rateCents){
  if(typeof job.payoutCents==="number") return Math.round(job.payoutCents);
  const words = typeof job.sourceWordCount==="number" ? job.sourceWordCount : 0;
  return Math.round(words * (rateCents||2.5));
}

function RevisorApp(){
  const[ready,setReady]=useState(false);
  const[authErr,setAuthErr]=useState("");
  const[me,setMe]=useState(null);
  const[allJobs,setAllJobs]=useState([]);
  const[tab,setTab]=useState("queue"); // queue | mine | finance
  const[focusJobId,setFocusJobId]=useState(null);
  const[payoutRate,setPayoutRate]=useState(2.5);

  const refresh=useCallback(async()=>{
    try{
      const loaded=await apiFetch("/api/revisor/jobs?scope=all");
      setAllJobs(Array.isArray(loaded)?loaded:[]);
    }catch{}
  },[]);

  useEffect(()=>{
    let cancelled=false;
    let timer=null;
    (async()=>{
      try{
        const meResp=await apiFetch("/api/auth/me",{method:"GET"});
        if(!meResp.authenticated){location.href="/login";return;}
        if(cancelled) return;
        setMe(meResp);
        try{
          const cfg=await apiFetch("/api/public-config");
          if(!cancelled && typeof cfg.payoutPerWordCents==="number") setPayoutRate(cfg.payoutPerWordCents);
        }catch{}
        setReady(true);
        refresh();
        timer=setInterval(refresh,2500);
      }catch(e){
        setAuthErr(e.message);
      }
    })();
    return ()=>{cancelled=true; if(timer) clearInterval(timer);};
  },[refresh]);

  async function logout(){
    try{await apiFetch("/api/auth/logout",{method:"POST"});}catch{}
    location.href="/login";
  }

  const updateJob=async(id,patch)=>apiFetch(`/api/revisor/jobs/${id}`,{method:"PATCH",body:JSON.stringify(patch)})
    .then(j=>{setAllJobs(prev=>prev.map(x=>x.id===id?j:x));return j;});

  async function claimJob(id){
    const j=await apiFetch(`/api/revisor/jobs/${id}/claim`,{method:"POST"});
    setAllJobs(prev=>{
      const exists=prev.some(x=>x.id===id);
      return exists?prev.map(x=>x.id===id?j:x):[j,...prev];
    });
    return j;
  }

  async function unclaimJob(id){
    const j=await apiFetch(`/api/revisor/jobs/${id}/unclaim`,{method:"POST"});
    setAllJobs(prev=>prev.map(x=>x.id===id?j:x));
    return j;
  }

  if(authErr){
    return React.createElement("div",{style:{maxWidth:640,margin:"0 auto",padding:"60px 20px",textAlign:"center"}},
      React.createElement("div",{style:{...st.card}},React.createElement("div",{style:{fontSize:12,color:"#c43d3d"}},authErr))
    );
  }
  if(!ready||!me){
    return React.createElement("div",{style:{maxWidth:640,margin:"0 auto",padding:"60px 20px",textAlign:"center"}},
      React.createElement("div",{style:{...st.card}},React.createElement(Spinner,{size:24}),React.createElement("div",{style:{marginTop:10,fontSize:13,color:C.muted}},"Loading revisor panel…"))
    );
  }

  return React.createElement(RevisorView,{me,allJobs,tab,setTab,updateJob,claimJob,unclaimJob,focusJobId,setFocusJobId,payoutRate,onLogout:logout});
}

function Header({me,tab,setTab,onLogout,counts,isCompact}){
  const e=React.createElement;
  function tabBtn(id,label,badge){
    const active=tab===id;
    return e("button",{onClick:()=>setTab(id),style:{...st.btn,padding:isCompact?"8px 10px":"8px 14px",fontSize:12,background:active?C.lilac:"rgba(255,255,255,0.55)",border:`1px solid ${active?"rgba(109,79,216,0.28)":C.border}`,color:active?C.accent:C.muted,display:"inline-flex",alignItems:"center",gap:6,flex:isCompact?"1 1 calc(50% - 4px)":"0 0 auto",justifyContent:"center"}},
      label,
      typeof badge==="number"&&badge>0&&e("span",{style:{fontSize:11,fontWeight:600,background:active?"rgba(255,255,255,0.7)":C.soft,borderRadius:999,padding:"1px 8px",color:active?C.accent:C.text}},badge)
    );
  }
  return e("div",{style:{padding:isCompact?"14px 0 0":"20px 0 0",marginBottom:isCompact?18:24}},
    e("div",{className:"lc-nav-pill",style:{borderRadius:isCompact?24:999,padding:isCompact?"12px":"10px 14px",display:"flex",alignItems:isCompact?"stretch":"center",justifyContent:"space-between",gap:12,flexDirection:isCompact?"column":"row"}},
      e("div",{style:{paddingLeft:isCompact?4:6}},
        e("div",{className:"lc-display",style:{fontSize:isCompact?20:22,fontWeight:600,color:C.text,letterSpacing:"-0.02em"}},"Lingo",e("span",{style:{color:C.accent}},"Check")),
        e("div",{style:{fontSize:13,color:C.muted,marginTop:2,wordBreak:"break-word"}},"Reviewer · ",e("span",{style:{color:C.text}},me.displayName||me.email||me.username))
      ),
      e("div",{style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",width:isCompact?"100%":"auto"}},
        tabBtn("queue","Queue",counts.queue),
        tabBtn("mine","My jobs",counts.mine),
        tabBtn("finance","Finance"),
        e("button",{onClick:onLogout,style:{...st.btn,background:"rgba(255,255,255,0.7)",border:`1px solid ${C.border}`,color:C.muted,fontSize:12,padding:"8px 14px",flex:isCompact?"1 1 100%":"0 0 auto"}},"Log out")
      )
    )
  );
}

function QueueTab({me,allJobs,claimJob,setTab,setFocusJobId,isCompact,payoutRate}){
  const e=React.createElement;
  const [claimingId,setClaimingId]=useState(null);
  const [err,setErr]=useState("");
  const [langFilter,setLangFilter]=useState("all");

  const languages=useMemo(()=>{
    const set=new Set();

      ?e("div",{style:{...st.card,textAlign:"center",padding:36,color:C.muted,fontSize:13}},"No open jobs for this language filter.")
      :e("div",{style:{display:"grid",gridTemplateColumns:"1fr",gap:12}},
        queue.map(job=>{
          const payout=jobPayoutCents(job, payoutRate);
          const stale=isStaleClaim(job);
          return e("div",{key:job.id,style:{...st.card,padding:isCompact?16:18,animation:"fadeUp 0.25s ease",display:"grid",gridTemplateColumns:isCompact?"1fr":"1fr auto",gap:16,alignItems:isCompact?"stretch":"center"}},
            e("div",null,
              e("div",{style:{fontSize:13,fontWeight:600,color:C.text,marginBottom:6,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
                job.qaOnly?job.language:"EN → "+job.language,
                job.qaOnly&&e("span",{style:{fontSize:11,fontWeight:500,color:C.muted,background:C.soft,border:`1px solid ${C.border}`,padding:"2px 8px",borderRadius:8}},"QA only"),

              e("div",{style:{fontSize:11,color:C.muted,marginTop:8}},formatWaiting(job.createdAt)," · submitted ",formatDateTime(job.createdAt))

              claimingId===job.id?e(React.Fragment,null,e(Spinner,{size:14})," Claiming…"):(stale?"Reclaim job":"Claim job")

function loadPropagateMode(revisorId){
  try{
    return localStorage.getItem("lc_propagate_mode_"+(revisorId||"anon"))==="auto" ? "auto" : "confirm";
  }catch(e){
    return "confirm";
  }
}

function normalizePropagateSource(text){
  return String(text == null ? "" : text).trim().replace(/\s+/g, " ");
}

function sameSourceOrder(sources, sourceIndex){
  const needle = normalizePropagateSource(sources[sourceIndex]);
  if(!needle) return [];
  const order = [];
  for(let i = 0; i < sources.length; i++){
    if(normalizePropagateSource(sources[i]) === needle) order.push(i);
  }
  return order;
}

function nextRepeatIndex(indexes, currentIndex){
  if(!indexes || !indexes.length) return -1;
  const at = indexes.indexOf(currentIndex);
  if(at < 0) return indexes[0];
  return indexes[(at + 1) % indexes.length];
}

function repeatCounts(sources, targets, status, sourceIndex){
  const needle = normalizePropagateSource(sources[sourceIndex]);
  const next = String(targets[sourceIndex] == null ? "" : targets[sourceIndex]).trim();
  let checked = 0;
  let unchecked = 0;
  for(let i = 0; i < sources.length; i++){
    if(i === sourceIndex) continue;
    if(normalizePropagateSource(sources[i]) !== needle) continue;
    if(String(targets[i] == null ? "" : targets[i]).trim() === next) continue;
    if(status[i] === "checked") checked++;
    else unchecked++;
  }
  return {checked:checked, unchecked:unchecked, total:checked + unchecked};
}

function pendingRepeatIndexes(order, sourceIndex, targets, proposed, reviewed){
  const proposedText = String(proposed == null ? "" : proposed).trim();
  const done = new Set(reviewed || []);
  return (order || []).filter(function(index){
    if(index === sourceIndex || done.has(index)) return false;
    const current = targets && targets[index] != null ? String(targets[index]).trim() : "";
    return current !== proposedText;
  });
}

function nextUntreatedIndex(order, cursor, pending){
  const list = order || [];
  const allowed = new Set(pending || []);
  if(!list.length || !allowed.size) return -1;
  const start = list.indexOf(cursor);
  const from = start < 0 ? 0 : start + 1;
  for(let step = 0; step < list.length; step++){
    const index = list[(from + step) % list.length];
    if(allowed.has(index)) return index;
  }
  return -1;
}

const propagateDelStyle = {
  background:"#fde8e8",
  color:"#8f2d2d",
  textDecoration:"line-through",
  borderRadius:3,
  padding:"0 2px",
  whiteSpace:"pre-wrap"
};
const propagateInsStyle = {
  background:"#e5f6ea",
  color:"#1f7a4d",
  textDecoration:"none",
  borderRadius:3,
  padding:"0 2px",
  whiteSpace:"pre-wrap"
};

function propagateWordNodes(e, oldText, newText){
  const diff = window.LcWordDiff;
  const parts = diff && typeof diff.wordDiffParts === "function"
    ? diff.wordDiffParts(oldText, newText)
    : [{type:"equal", text:String(newText || "")}];
  return parts.map(function(part, i){
    if(part.type === "removed") return e("del",{key:i,style:propagateDelStyle}, part.text);
    if(part.type === "added") return e("ins",{key:i,style:propagateInsStyle}, part.text);
    return e("span",{key:i}, part.text);
  });
}

function ReviewEditor({selectedJob,updateJob,unclaimJob,onDone,onReleased,isCompact,payoutRate,revisorId}){
  const e=React.createElement;
  const[editedText,setEditedText]=useState(selectedJob.revisedTranslation||selectedJob.aiTranslation||"");
  const[mode,setMode]=useState("sentences");
  const[origSentences,setOrigSentences]=useState([]);
  const[editedSentences,setEditedSentences]=useState([]);
  const[sentenceParaMap,setSentenceParaMap]=useState([]);
  const[paragraphCount,setParagraphCount]=useState(0);
  const[sending,setSending]=useState(false);
  const[saving,setSaving]=useState(false);
  const[releasing,setReleasing]=useState(false);
  const[savedNote,setSavedNote]=useState("");
  const[customerSentences,setCustomerSentences]=useState([]);
  const[aiSentences,setAiSentences]=useState([]);
  const[sentenceStatus,setSentenceStatus]=useState([]);
  const[sentenceMeta,setSentenceMeta]=useState([]);
  const[propagateMode,setPropagateMode]=useState(()=>loadPropagateMode(revisorId));
  const propagateModeRef=useRef(loadPropagateMode(revisorId));
  const[propagateBar,setPropagateBar]=useState(null);
  const[propagateToast,setPropagateToast]=useState(null);
  const[propagateHighlights,setPropagateHighlights]=useState({});
  const focusSnapRef=useRef(null);
  const jumpFocusIndexRef=useRef(null);
  const applyingPropagateRef=useRef(false);
  const propagatedSkipRef=useRef(null);
  const[isWide,setIsWide]=useState(()=>window.matchMedia && window.matchMedia("(min-width: 900px)").matches);
  const sentenceColumns = useMedia("(min-width: 768px)");

  useEffect(()=>{
    if(!propagateToast) return;
    const timer = setTimeout(()=>setPropagateToast(null), 8000);
    return ()=>clearTimeout(timer);
  },[propagateToast]);

  useEffect(function(){
    if(mode !== "sentences") return;
    document.querySelectorAll("textarea.sentence-target").forEach(growSentenceField);
  },[mode, editedSentences]);

  useEffect(function(){
    if(!propagateBar || (propagateBar.phase !== "review" && propagateBar.phase !== "browse")) return;
    function onKey(ev){
      if(ev.key !== "Escape") return;
      setPropagateBar(null);
    }
    document.addEventListener("keydown", onKey);
    return function(){ document.removeEventListener("keydown", onKey); };
  },[propagateBar]);

  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq = window.matchMedia("(min-width: 900px)");
    const onChange = () => setIsWide(!!mq.matches);
    onChange();
    if(mq.addEventListener) mq.addEventListener("change", onChange);
    else mq.addListener(onChange);
    return () => {
      if(mq.removeEventListener) mq.removeEventListener("change", onChange);
      else mq.removeListener(onChange);
    };
  },[]);

  useEffect(()=>{
    setEditedText(selectedJob.revisedTranslation||selectedJob.aiTranslation||"");
    const showSource = jobHasEnglishSource(selectedJob);
    const legacyQa = selectedJob.qaOnly && !showSource;
    const source = legacyQa ? (selectedJob.aiTranslation||"") : selectedJob.originalText;
    const translation = selectedJob.revisedTranslation||selectedJob.aiTranslation||"";
    const review = buildSentenceReview(selectedJob, source, translation);
    let sentences = review.sentences;
    let transSentences = review.transSentences;
    let paraMap = review.paraMap;
    let paragraphCount = review.paragraphCount;
    if(selectedJob.qaOnly && showSource && window.LcTextSegments){
      const units = LcTextSegments.buildSentenceUnits(getTextSegments(selectedJob, selectedJob.originalText));
      sentences = units.sentences;
      paraMap = units.paraMap;
      paragraphCount = units.paragraphCount;
      transSentences = fitSentenceList(splitDocumentSentences(translation), sentences.length);
    }
    setOrigSentences(sentences);
    setEditedSentences(transSentences);
    setSentenceParaMap(paraMap);
    setParagraphCount(paragraphCount);
    const savedStatus = Array.isArray(selectedJob.sentenceStatus) ? selectedJob.sentenceStatus : [];
    setSentenceStatus((sentences || []).map((_, i) => savedStatus[i] === "checked" ? "checked" : ""));
    const savedMeta = Array.isArray(selectedJob.sentenceMeta) ? selectedJob.sentenceMeta : [];
    setSentenceMeta((sentences || []).map(function(_, i){
      return {
        id: (savedMeta[i] && savedMeta[i].id) || ("s"+i),
        propagatedFrom: (savedMeta[i] && savedMeta[i].propagatedFrom) || null,
        propagatedAt: (savedMeta[i] && savedMeta[i].propagatedAt) || null
      };
    }));
    setPropagateBar(null);
    setPropagateHighlights({});
    if(selectedJob.qaOnly && selectedJob.customerTranslation && showSource){
      setCustomerSentences(fitSentenceList(splitDocumentSentences(selectedJob.customerTranslation), sentences.length));
      setAiSentences(fitSentenceList(splitDocumentSentences(selectedJob.aiTranslation||""), sentences.length));
      setMode("full");
    }else{
      setCustomerSentences([]);
      setAiSentences([]);
      setMode("sentences");
    }
    setSavedNote("");
  },[selectedJob.id]);

  function draftPayload(){
    const finalText = mode==="sentences"
      ? sentencesToParagraphText(editedSentences, sentenceParaMap, paragraphCount)
      : (editedText||"").trim();
    const patch = { revisedTranslation: finalText };
    if(mode==="sentences" && editedSentences.length){
      patch.translationSentences = editedSentences.map(s => String(s||"").trim());
      patch.sentenceStatus = editedSentences.map((_, i) => sentenceStatus[i] === "checked" ? "checked" : "");
    }
    return { finalText, patch };
  }

  function statusList(){
    return editedSentences.map((_, i) => sentenceStatus[i] === "checked" ? "checked" : "");
  }

  function savePartStatus(next){
    setSentenceStatus(next);
    updateJob(selectedJob.id, { sentenceStatus: next }).catch(function(){});
  }

  function openPropagateBar(idx, statusNext, targets){
    if(propagateModeRef.current !== "confirm" || statusNext[idx] !== "checked"){
      setPropagateBar(function(bar){
        if(bar && bar.sourceIndex === idx) return null;
        return bar;
      });
      return false;
    }
    const order = sameSourceOrder(origSentences, idx);
    if(order.length < 2){
      setPropagateBar(null);
      return false;
    }
    const counts = repeatCounts(origSentences, targets, statusNext, idx);
    setPropagateBar({
      phase: "start",
      sourceIndex: idx,
      order: order,
      cursor: idx,
      position: order.indexOf(idx) + 1,
      proposed: targets[idx] == null ? "" : targets[idx],
      reviewed: [],
      applied: 0,
      skipped: 0,
      revisionIds: [],
      total: counts.total,
      checked: counts.checked,
      unchecked: counts.unchecked
    });
    return true;
  }

  function togglePartStatus(idx){
    const next = statusList();
    next[idx] = next[idx] === "checked" ? "" : "checked";
    savePartStatus(next);
    if(next[idx] === "checked") openPropagateBar(idx, next, editedSentences);
    else setPropagateBar(function(bar){ return bar && bar.sourceIndex === idx ? null : bar; });
  }

  function markPartChecked(idx){
    const next = statusList();
    next[idx] = "checked";
    savePartStatus(next);
    if(propagateBar && (propagateBar.phase === "review" || propagateBar.phase === "browse") && propagateBar.cursor === idx) return;
    if(openPropagateBar(idx, next, editedSentences)) return;
    const following = document.querySelector('[data-sentence-index="'+(idx+1)+'"]');
    if(following && following.focus) following.focus();
  }

  function onSentenceKeyDown(ev, idx){
    if(!((ev.ctrlKey || ev.metaKey) && ev.key === "Enter")) return;
    ev.preventDefault();
    markPartChecked(idx);
  }

  function choosePropagateMode(next){
    propagateModeRef.current = next;
    setPropagateMode(next);
    if(next !== "confirm") setPropagateBar(null);
    try{ localStorage.setItem("lc_propagate_mode_"+(revisorId||"anon"), next); }catch(e){}
  }

  function releasePropagateLock(){
    setTimeout(function(){ applyingPropagateRef.current = false; }, 0);
  }

  async function maybePropagate(idx, previousTarget, newTarget, targets){
    if(applyingPropagateRef.current || propagateModeRef.current !== "auto") return;
    if(previousTarget === newTarget) return;
    applyingPropagateRef.current = true;
    try{
      const data = await apiFetch("/api/revisor/jobs/"+encodeURIComponent(selectedJob.id)+"/propagate", {method:"POST", body:JSON.stringify({
        sources: origSentences,
        targets: targets,
        status: statusList(),
        meta: sentenceMeta,
        paraMap: sentenceParaMap,
        sourceIndex: idx,
        previousTarget: previousTarget,
        newTarget: newTarget,
        mode: "auto",
        scope: "all",
        apply: true
      })});
      if(data.targets) setEditedSentences(data.targets);
      if(data.sentenceMeta) setSentenceMeta(data.sentenceMeta);
      if(data.sentenceStatus) setSentenceStatus(data.sentenceStatus);
      if(data.applied){
        propagatedSkipRef.current = {value:String(newTarget).trim(), indexes:new Set(data.appliedIndexes||[])};
        rememberPropagateHighlights(data.appliedIndexes, targets, newTarget);
        setPropagateToast({count:data.applied, revisionId:data.revisionId, appliedIndexes:data.appliedIndexes||[]});
      }
    }catch(ex){
      setSavedNote(ex.message || "Could not repeat this correction");
    }finally{
      releasePropagateLock();
    }
  }

  function onSentenceFocus(idx, value){
    focusSnapRef.current = {idx:idx, value:value};
    const fromJump = jumpFocusIndexRef.current === idx;
    if(fromJump) jumpFocusIndexRef.current = null;
    if(fromJump) return;
    setPropagateHighlights(function(current){
      if(!Object.prototype.hasOwnProperty.call(current, idx)) return current;
      const next = Object.assign({}, current);
      delete next[idx];
      return next;
    });
    setPropagateBar(function(bar){
      if(!bar) return bar;
      if(bar.phase === "review" || bar.phase === "browse") return bar.cursor === idx ? bar : null;
      if(bar.sourceIndex !== idx) return null;
      return bar;
    });
  }

  function onSentenceBlur(idx, ev){
    const snap = focusSnapRef.current;
    if(!snap || snap.idx !== idx) return;
    const next = ev.target.value;
    if(next === snap.value) return;
    const skip = propagatedSkipRef.current;
    if(skip && skip.indexes.has(idx) && next.trim() === skip.value){
      skip.indexes.delete(idx);
      return;
    }
    const targets = editedSentences.slice();
    targets[idx] = next;
    maybePropagate(idx, snap.value, next, targets);
  }

  function focusRepeat(index){
    jumpFocusIndexRef.current = index;
    const el = document.querySelector('[data-sentence-index="'+index+'"]');
    if(el && el.scrollIntoView) el.scrollIntoView({block:"center"});
    if(el && el.focus) el.focus();
    setTimeout(function(){
      if(jumpFocusIndexRef.current === index && document.activeElement !== el) jumpFocusIndexRef.current = null;
    }, 0);
  }

  function rememberPropagateHighlights(indexes, beforeTargets, newTarget){
    setPropagateHighlights(function(current){
      const next = Object.assign({}, current);
      (indexes || []).forEach(function(index){
        const oldText = beforeTargets && beforeTargets[index] != null ? beforeTargets[index] : "";
        if(String(oldText).trim() === String(newTarget == null ? "" : newTarget).trim()) return;
        next[index] = {oldText:oldText, newText:newTarget};
      });
      return next;
    });
  }

  function finishReviewRound(bar){
    setPropagateBar(null);
    if(!bar || (!bar.applied && !bar.skipped)) return;
    setPropagateToast({
      kind:"round",
      applied:bar.applied || 0,
      skipped:bar.skipped || 0,
      revisionIds:(bar.revisionIds || []).slice(),
      highlightIndexes:(bar.highlightIndexes || []).slice()
    });
  }

  function moveReview(bar, reviewed, applied, skipped, revisionIds, highlightIndexes, targets, keepCursor){
    const pending = pendingRepeatIndexes(bar.order, bar.sourceIndex, targets, bar.proposed, reviewed);
    const stay = keepCursor && pending.indexOf(bar.cursor) >= 0;
    const next = stay ? bar.cursor : nextUntreatedIndex(bar.order, bar.cursor, pending);
    const patch = {
      phase:"review",
      reviewed:reviewed,
      applied:applied,
      skipped:skipped,
      revisionIds:revisionIds,
      highlightIndexes:highlightIndexes
    };
    if(next < 0){
      finishReviewRound(Object.assign({}, bar, patch));
      return;
    }
    setPropagateBar(Object.assign({}, bar, patch, {cursor:next}));
    if(!stay) focusRepeat(next);
  }

  function jumpToNextRepeat(){
    const bar = propagateBar;
    if(!bar || bar.phase === "browse" || bar.phase === "review") return;
    const proposed = editedSentences[bar.sourceIndex] == null ? "" : editedSentences[bar.sourceIndex];
    const pending = pendingRepeatIndexes(bar.order, bar.sourceIndex, editedSentences, proposed, []);
    const next = nextUntreatedIndex(bar.order, bar.sourceIndex, pending);
    if(next < 0){
      setPropagateBar(null);
      return;
    }
    setPropagateBar(Object.assign({}, bar, {
      phase:"review",
      proposed:proposed,
      cursor:next,
      reviewed:[],
      applied:0,
      skipped:0,
      revisionIds:[],
      highlightIndexes:[]
    }));
    focusRepeat(next);
  }

  function skipReviewedChange(){
    const bar = propagateBar;
    if(!bar || bar.phase !== "review") return;
    moveReview(bar, (bar.reviewed || []).concat([bar.cursor]), bar.applied || 0, (bar.skipped || 0) + 1, bar.revisionIds || [], bar.highlightIndexes || [], editedSentences, false);
  }

  function browsePropagatedChanges(){
    const order = (propagateToast && propagateToast.appliedIndexes ? propagateToast.appliedIndexes : []).slice().sort(function(a, b){ return a - b; });
    if(!order.length) return;
    setPropagateToast(null);
    setPropagateBar({
      phase:"browse",
      sourceIndex:order[0],
      order:order,
      cursor:order[0],
      proposed:"",
      reviewed:[],
      applied:0,
      skipped:0,
      revisionIds:[]
    });
    focusRepeat(order[0]);
  }

  function browseNextChange(){
    const bar = propagateBar;
    if(!bar || bar.phase !== "browse") return;
    const at = bar.order.indexOf(bar.cursor);
    if(at < 0 || at >= bar.order.length - 1){
      setPropagateBar(null);
      return;
    }
    const next = bar.order[at + 1];
    setPropagateBar(Object.assign({}, bar, {cursor:next}));
    focusRepeat(next);
  }

  async function postPropagate(body){
    return apiFetch("/api/revisor/jobs/"+encodeURIComponent(selectedJob.id)+"/propagate", {method:"POST", body:JSON.stringify(body)});
  }

  async function applyReviewedChange(){
    const bar = propagateBar;
    if(!bar || bar.phase !== "review" || applyingPropagateRef.current) return;
    applyingPropagateRef.current = true;
    const targets = editedSentences.slice();
    const reviewed = (bar.reviewed || []).concat([bar.cursor]);
    try{
      const data = await postPropagate({
        sources: origSentences,
        targets: targets,
        status: statusList(),
        meta: sentenceMeta,
        paraMap: sentenceParaMap,
        sourceIndex: bar.sourceIndex,
        previousTarget: bar.proposed,
        newTarget: bar.proposed,
        mode: "confirm",
        scope: "all",
        onlyIndexes: [bar.cursor],
        apply: true
      });
      const nextTargets = data.targets || targets;
      if(data.targets) setEditedSentences(data.targets);
      if(data.sentenceMeta) setSentenceMeta(data.sentenceMeta);
      if(data.sentenceStatus) setSentenceStatus(data.sentenceStatus);
      let applied = bar.applied || 0;
      let skipped = bar.skipped || 0;
      const revisionIds = (bar.revisionIds || []).slice();
      const highlightIndexes = (bar.highlightIndexes || []).slice();
      if(data.applied){
        applied += data.applied;
        if(data.revisionId) revisionIds.push(data.revisionId);
        (data.appliedIndexes || [bar.cursor]).forEach(function(index){ highlightIndexes.push(index); });
        rememberPropagateHighlights(data.appliedIndexes || [bar.cursor], targets, bar.proposed);
        propagatedSkipRef.current = {value:String(bar.proposed).trim(), indexes:new Set(data.appliedIndexes||[])};
      }else{
        skipped += 1;
      }
      moveReview(bar, reviewed, applied, skipped, revisionIds, highlightIndexes, nextTargets, false);
    }catch(ex){
      setSavedNote(ex.message || "Could not apply the repeated correction");
    }finally{
      releasePropagateLock();
    }
  }

  async function applyPropagateScope(scope){
    const bar = propagateBar;
    if(!bar || bar.phase === "browse" || applyingPropagateRef.current) return;
    applyingPropagateRef.current = true;

        sources: origSentences,
        targets: targets,
        status: statusList(),
        meta: sentenceMeta,
        paraMap: sentenceParaMap,
        sourceIndex: bar.sourceIndex,
        previousTarget: proposed,
        newTarget: proposed,
        mode: "confirm",

        excludeIndexes: reviewed,
        apply: true

      if(data.targets) setEditedSentences(data.targets);
      if(data.sentenceMeta) setSentenceMeta(data.sentenceMeta);
      if(data.sentenceStatus) setSentenceStatus(data.sentenceStatus);
      if(data.applied){
        rememberPropagateHighlights(data.appliedIndexes, targets, proposed);
        propagatedSkipRef.current = {value:String(proposed).trim(), indexes:new Set(data.appliedIndexes||[])};
      }

  async function undoPropagate(){
    const toast = propagateToast;
    const ids = toast && toast.revisionIds && toast.revisionIds.length ? toast.revisionIds : (toast && toast.revisionId ? [toast.revisionId] : []);
    if(!ids.length) return;
    applyingPropagateRef.current = true;
    try{
      const body = ids.length === 1 ? {revisionId:ids[0]} : {revisionIds:ids};
      const data = await apiFetch("/api/revisor/jobs/"+encodeURIComponent(selectedJob.id)+"/propagate/undo", {method:"POST", body:JSON.stringify(body)});
      if(data.targets) setEditedSentences(data.targets);
      if(data.sentenceMeta) setSentenceMeta(data.sentenceMeta);
      if(data.sentenceStatus) setSentenceStatus(data.sentenceStatus);
      const clearIndexes = toast.highlightIndexes || toast.appliedIndexes || [];
      setPropagateHighlights(function(current){
        const next = Object.assign({}, current);
        clearIndexes.forEach(function(index){ delete next[index]; });
        return next;
      });
      setPropagateToast(null);
    }catch(ex){
      setSavedNote(ex.message || "Could not undo");
    }finally{
      releasePropagateLock();
    }
  }

      propagateToast.appliedIndexes&&propagateToast.appliedIndexes.length&&e("button",{type:"button",onClick:browsePropagatedChanges,style:{...st.btn,fontSize:12,padding:"5px 10px",background:"transparent",color:C.white,border:"1px solid rgba(255,255,255,0.35)"}},"Bekijk wijzigingen"),
      ((propagateToast.revisionIds&&propagateToast.revisionIds.length)||propagateToast.revisionId)&&e("button",{type:"button",onClick:undoPropagate,style:{...st.btn,fontSize:12,padding:"5px 10px",background:"transparent",color:C.white,border:"1px solid rgba(255,255,255,0.35)"}},"Ongedaan maken"),
      e("button",{type:"button",title:"Sluiten",onClick:()=>setPropagateToast(null),style:{...st.btn,fontSize:16,lineHeight:1,padding:"2px 6px",background:"transparent",color:C.white,border:"none"}},"×")
    )
  );
}

function MyAssignmentsTab({me,allJobs,updateJob,unclaimJob,focusJobId,setFocusJobId,isCompact,payoutRate}){
  const e=React.createElement;
  const isWide=useMedia("(min-width: 900px)");
  const[selectedId,setSelectedId]=useState(null);
  const[justSent,setJustSent]=useState(false);
  const[showList,setShowList]=useState(true);
  const[listFilter,setListFilter]=useState("active"); // active | completed | all

  const mine=useMemo(()=>allJobs
    .filter(j=>j.claimedByRevisorId===me.revisorId || j.completedByRevisorId===me.revisorId)
    .sort((a,b)=>{
      const aActive = a.status!=="complete" ? 1 : 0;
      const bActive = b.status!=="complete" ? 1 : 0;
      if(aActive!==bActive) return bActive-aActive;
      const aTs = a.completedAt||a.claimedAt||a.createdAt||0;
      const bTs = b.completedAt||b.claimedAt||b.createdAt||0;
      return bTs-aTs;
    })
  ,[allJobs,me.revisorId]);

  const filtered=useMemo(()=>{
    if(listFilter==="active") return mine.filter(j=>j.status!=="complete");
    if(listFilter==="completed") return mine.filter(j=>j.status==="complete");
    return mine;
  },[mine,listFilter]);

  useEffect(()=>{
    if(focusJobId){
      setSelectedId(focusJobId);
      setListFilter("active");
      setShowList(false);
      setFocusJobId&&setFocusJobId(null);
    }
  },[focusJobId,setFocusJobId]);

  useEffect(()=>{
    if(selectedId && !mine.find(j=>j.id===selectedId)) setSelectedId(null);
  },[mine,selectedId]);

  useEffect(()=>{
    if(selectedId) setShowList(false);
    else setShowList(true);
  },[selectedId]);

  const selectedJob=mine.find(j=>j.id===selectedId);

  if(mine.length===0){
    return e("div",{style:{textAlign:"center",padding:"80px 0"}},
      e("div",{style:{fontSize:40,marginBottom:18}},"📋"),
      e("div",{className:"lc-display",style:{fontSize:24,color:C.text,marginBottom:8}},"No assignments yet"),
      e("div",{style:st.muted},"Claim a job from the Queue to get started.")
    );
  }

  function listItem(job){
    const isComplete=job.status==="complete";
    const isSelected=selectedId===job.id;
    const payout=jobPayoutCents(job, payoutRate);
    return e("div",{key:job.id,onClick:()=>setSelectedId(job.id),style:{...st.card,padding:14,marginBottom:8,cursor:"pointer",border:`1px solid ${isSelected?"rgba(109,79,216,0.32)":C.border}`,background:isSelected?"rgba(109,79,216,0.06)":undefined,transition:"border-color 0.12s, background 0.12s",animation:"fadeUp 0.25s ease"}},
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:6}},
        e("div",{style:{fontSize:13,fontWeight:600,color:C.text,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
          job.qaOnly?job.language:"EN → "+job.language,
          job.qaOnly&&e("span",{style:{fontSize:11,fontWeight:500,color:C.muted,background:C.soft,border:`1px solid ${C.border}`,padding:"2px 8px",borderRadius:8}},"QA only"),
          aiChangedTranslation(job)&&e("span",{style:{fontSize:11,fontWeight:500,color:C.accent,background:C.lilac,padding:"2px 8px",borderRadius:8}},"AI changes")
        ),
        e("span",{style:{fontSize:11,fontWeight:500,padding:"3px 8px",borderRadius:8,background:isComplete?C.greenBg:C.amberBg,border:`1px solid ${isComplete?C.greenBorder:C.amberBorder}`,color:isComplete?C.green:C.amber}},isComplete?"Completed":"In progress")
      ),
      e("div",{style:{fontSize:12,color:C.muted,marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},jobPreviewText(job).substring(0,60),"…"),
      e("div",{style:{fontSize:11,color:C.muted}},
        typeof job.sourceWordCount==="number"?job.sourceWordCount+" words · "+fmtEur(payout)+" · ":"",
        isComplete?("Completed "+formatDateTime(job.completedAt)):("Claimed "+formatDateTime(job.claimedAt))
      )
    );
  }

  function filterBtn(id,label){
    const active=listFilter===id;
    return e("button",{onClick:()=>setListFilter(id),style:{...st.btn,padding:"6px 10px",fontSize:11,background:active?C.lilac:"rgba(255,255,255,0.55)",border:`1px solid ${active?"rgba(109,79,216,0.28)":C.border}`,color:active?C.accent:C.muted}},label);
  }

  return e("div",{style:{display:"grid",gridTemplateColumns:(selectedJob&&!showList)?"1fr":(selectedJob&&isWide?"260px 1fr":"1fr"),gap:16,alignItems:"start"}},
    (showList||!selectedJob)&&e("div",null,
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,gap:8,flexWrap:"wrap"}},
        e("span",{style:{...st.label,marginBottom:0}},"My assignments"),
        e("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          filterBtn("active","Active"),
          filterBtn("completed","Completed"),
          filterBtn("all","All"),
          selectedJob&&e("button",{onClick:()=>setShowList(false),title:"Hide list",style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,fontSize:11,padding:"4px 10px"}},"Hide")
        )
      ),
      filtered.length===0
        ?e("div",{style:{...st.card,padding:24,textAlign:"center",color:C.muted,fontSize:13}},listFilter==="active"?"No active jobs.":"No jobs in this filter.")
        :filtered.map(listItem)
    ),
    selectedJob&&!showList&&e("div",{style:{marginBottom:8}},
      e("button",{onClick:()=>{setSelectedId(null);setShowList(true);},style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,fontSize:12,padding:"6px 12px",marginBottom:12}},"← Back to list")
    ),
    selectedJob
      ? e("div",null,
          justSent&&selectedJob.status==="complete"&&e("div",{style:{background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:10,padding:"12px 16px",marginBottom:14,fontSize:13,color:C.green,animation:"fadeUp 0.25s ease"}},"✅ Translation sent to client successfully."),
          selectedJob.status==="complete"
            ? e("div",{style:{...st.card,padding:isCompact?18:28}},
                e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}},
                  e("div",{style:{fontFamily:"inherit",fontSize:isCompact?18:22,color:C.text}},"Completed assignment"),
                  e("span",{style:{fontSize:11,fontWeight:500,padding:"4px 10px",borderRadius:8,background:C.greenBg,border:`1px solid ${C.greenBorder}`,color:C.green}},"Delivered")
                ),
                e("div",{style:{display:"grid",gridTemplateColumns:isCompact?"1fr":"1fr 1fr",gap:12,marginBottom:18}},
                  e("div",null,e("div",{style:{fontSize:12,color:C.muted}},"Language"),e("div",{style:{fontSize:14,color:C.text,marginTop:4}}, selectedJob.qaOnly?selectedJob.language:"EN → "+selectedJob.language)),
                  e("div",null,e("div",{style:{fontSize:12,color:C.muted}},"Words / payout"),e("div",{style:{fontSize:14,color:C.text,marginTop:4}}, (selectedJob.sourceWordCount||0)," · ",fmtEur(jobPayoutCents(selectedJob,payoutRate)))),
                  e("div",null,e("div",{style:{fontSize:12,color:C.muted}},"Claimed"),e("div",{style:{fontSize:14,color:C.text,marginTop:4}}, formatDateTime(selectedJob.claimedAt))),
                  e("div",null,e("div",{style:{fontSize:12,color:C.muted}},"Completed"),e("div",{style:{fontSize:14,color:C.text,marginTop:4}}, formatDateTime(selectedJob.completedAt)))
                ),
                e("div",{style:{display:"grid",gridTemplateColumns:(jobHasEnglishSource(selectedJob)&&isWide)?"1fr 1fr":"1fr",gap:14}},
                  jobHasEnglishSource(selectedJob)&&e("div",null,
                    e("div",{style:{fontSize:12,color:C.muted,marginBottom:8}},selectedJob.qaOnly?"Source — English":"Original"),
                    e("div",{style:{fontSize:13,color:C.muted,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:300,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}},selectedJob.originalText)
                  ),
                  e("div",null,
                    e("div",{style:{fontSize:12,color:C.muted,marginBottom:8}},"Final translation"),
                    e("div",{style:{fontSize:13,color:C.text,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:300,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}}, selectedJob.revisedTranslation||"")
                  )
                ),
                selectedJob.customerTranslation&&e("div",{style:{marginTop:14,padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft,maxHeight:320,overflow:"auto"}},
                  e("div",{style:{fontSize:12,color:C.muted,marginBottom:8}},"LingoCheck changes"),
                  e(MarkedTranslation,{customerText:selectedJob.customerTranslation,checkedText:selectedJob.aiTranslation||""})
                )
              )
            : e(ReviewEditor,{selectedJob,updateJob,unclaimJob,payoutRate,revisorId:me.revisorId,onDone:()=>{setJustSent(true); setTimeout(()=>setJustSent(false),3500);},onReleased:()=>{setSelectedId(null);setShowList(true);},isCompact})
        )
      : (!showList && e("div",{style:st.muted},"Select an assignment to open it."))
  );
}

function FinanceTab({me,allJobs,isCompact,payoutRate}){
  const e=React.createElement;
  const RATE = payoutRate||2.5;

  const completed = useMemo(()=>allJobs
    .filter(j=>j.completedByRevisorId===me.revisorId && j.status==="complete")
    .sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))
  ,[allJobs,me.revisorId]);

  const items = useMemo(()=>completed.map(j=>{
    const words = typeof j.sourceWordCount==="number" ? j.sourceWordCount : 0;
    const earningsCents = jobPayoutCents(j, RATE);
    return {id:j.id,language:j.language,completedAt:j.completedAt||j.createdAt,sourceWordCount:words,earningsCents};
  }),[completed,RATE]);

  const totalCents = items.reduce((a,b)=>a+b.earningsCents,0);
  const totalWords = items.reduce((a,b)=>a+b.sourceWordCount,0);

  const nowKey = localMonthKey(Date.now());
  const monthGroups = useMemo(()=>{
    const map = new Map();
    for(const it of items){
      const key = localMonthKey(it.completedAt);
      const label = localMonthLabel(it.completedAt);
      const cur = map.get(key) || {key,label,items:[],cents:0,words:0};
      cur.items.push(it);
      cur.cents += it.earningsCents;
      cur.words += it.sourceWordCount;
      map.set(key, cur);
    }
    const arr = Array.from(map.values());
    arr.sort((a,b)=> b.key.localeCompare(a.key));
    return arr;
  },[items]);

  const thisMonth = monthGroups.find(g=>g.key===nowKey) || {cents:0,words:0,items:[]};
  const rateLabel = "€"+(RATE/100).toFixed(3).replace(/0+$/,"").replace(/\.$/,"")+" / word";

  function statCard(label,value,sub){
    return e("div",{style:{...st.card,padding:20}},
      e("div",{style:{fontSize:12,color:C.muted,marginBottom:8}},label),
      e("div",{style:{fontSize:28,fontFamily:"inherit",color:C.text}},value),
      sub&&e("div",{style:{fontSize:12,color:C.muted,marginTop:4}},sub)
    );
  }

  return e("div",null,
    e("span",{style:st.label},"Finance overview"),
    e("div",{style:{fontSize:12,color:C.muted,marginBottom:14}},"Earnings are calculated at ", e("strong",{style:{color:C.pale}}, rateLabel), " of completed translations (from stored job payout when available)."),
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(200px, 1fr))",gap:14,marginBottom:20}},
      statCard("This month", fmtEur(thisMonth.cents), thisMonth.words+" words · "+(thisMonth.items?.length||0)+" jobs"),
      statCard("All time", fmtEur(totalCents), totalWords+" words · "+items.length+" jobs"),
      statCard("Rate", rateLabel, "Per source word")
    ),

    monthGroups.length===0
      ? e("div",{style:{...st.card,textAlign:"center",padding:40,color:C.muted,fontSize:13}},"No completed assignments yet — finish a job to see earnings here.")
      : e("div",{style:{display:"flex",flexDirection:"column",gap:14}},
          monthGroups.map(g=>e("div",{key:g.key,style:{...st.card,padding:0,overflow:"hidden"}},
            e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px",borderBottom:`1px solid ${C.border}`,background:C.soft}},
              e("div",null,
                e("div",{style:{fontFamily:"inherit",fontSize:18,color:C.text}},g.label),
                e("div",{style:{fontSize:11,color:C.muted,marginTop:2}},g.items.length," job",g.items.length===1?"":"s"," · ",g.words," words")
              ),
              e("div",{style:{fontFamily:"inherit",fontSize:22,color:C.pale}}, fmtEur(g.cents))
            ),
            e("div",{style:{padding:"4px 0"}},
              g.items.map((it,i)=>e("div",{key:it.id,style:{display:"grid",gridTemplateColumns:isCompact?"1fr":"1fr 120px 100px 110px",gap:isCompact?4:8,padding:isCompact?"12px 16px":"10px 20px",borderTop:i===0?"none":`1px solid ${C.border}`,fontSize:13,alignItems:isCompact?"start":"center"}},
                e("div",{style:{color:C.text}},"EN → ",it.language),
                e("div",{style:{color:C.muted,fontSize:12}}, it.sourceWordCount," words"),
                e("div",{style:{color:C.muted,fontSize:12}}, new Date(it.completedAt).toLocaleDateString()),
                e("div",{style:{color:C.pale,textAlign:isCompact?"left":"right",fontWeight:600}}, fmtEur(it.earningsCents))
              ))
            )
          ))
        )
  );
}

function RevisorView({me,allJobs,tab,setTab,updateJob,claimJob,unclaimJob,focusJobId,setFocusJobId,payoutRate,onLogout}){
  const e=React.createElement;
  const isCompact=!useMedia("(min-width: 768px)");

  const counts = {
    queue: allJobs.filter(isQueuedJob).length,
    mine: allJobs.filter(j=>(j.claimedByRevisorId===me.revisorId || j.completedByRevisorId===me.revisorId) && j.status!=="complete").length
  };

  return e("div",{style:{maxWidth:1280,margin:"0 auto",padding:isCompact?"0 16px 40px":"0 24px 48px"}},
    e(Header,{me,tab,setTab,onLogout,counts,isCompact}),
    e("div",{style:{animation:"rise 0.45s var(--ease)"}},
      tab==="queue" && e(QueueTab,{me,allJobs,claimJob,setTab,setFocusJobId,isCompact,payoutRate}),
      tab==="mine" && e(MyAssignmentsTab,{me,allJobs,updateJob,unclaimJob,focusJobId,setFocusJobId,isCompact,payoutRate}),
      tab==="finance" && e(FinanceTab,{me,allJobs,isCompact,payoutRate})
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(RevisorApp));
</script>
