    --bg:#ffffff;
    --ink:#1c1430;
    --muted:#6b6480;
    --accent:#6d4fd8;

  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(720px 280px at 10% -12%, rgba(109,79,216,0.07), transparent 58%),
      #ffffff;
    color:var(--ink);

  button,input,textarea,select{font-family:inherit;}
  @keyframes spin{to{transform:rotate(360deg)}}

  button:not(:disabled):active{transform:translateY(1px);}
  a:hover,button:hover{opacity:0.92}
  textarea:focus,input:focus,select:focus{border-color:var(--accent)!important;outline:none;box-shadow:0 0 0 3px rgba(109,79,216,0.12);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  ::placeholder{color:#9a93ad;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(109,79,216,0.22);border-radius:3px;}
</style>

<body>
<div id="root"></div>
<script>
const {useState,useEffect,useCallback,useMemo}=React;

const C={deep:"#1c1430",mid:"#5b3fc4",accent:"#6d4fd8",light:"#6d4fd8",pale:"#6d4fd8",surface:"#ffffff",card:"#ffffff",border:"rgba(92,70,168,0.14)",text:"#1c1430",muted:"#6b6480",white:"#ffffff",green:"#187a4c",greenBg:"#eef8f2",greenBorder:"rgba(24,122,76,0.22)",amber:"#8a6800",amberBg:"#fff8e6",amberBorder:"rgba(138,104,0,0.22)",soft:"#f7f5fb"};
const st={
  card:{background:"#ffffff",border:`1px solid ${C.border}`,borderRadius:14,padding:28},
  btn:{fontFamily:"inherit",cursor:"pointer",border:"none",borderRadius:10,fontWeight:600,transition:"opacity 0.12s, background 0.12s, border-color 0.12s"},
  label:{fontSize:11,fontWeight:600,letterSpacing:"1.2px",textTransform:"uppercase",color:C.accent,marginBottom:10,display:"block"},
  ta:{width:"100%",background:C.soft,border:`1px solid ${C.border}`,borderRadius:10,padding:14,fontFamily:"inherit",fontSize:14,color:C.text,lineHeight:1.7,resize:"vertical",boxSizing:"border-box"},
  muted:{fontSize:13,color:C.muted}
};

async function apiFetch(path,opts={}){const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});const data=await r.json().catch(()=> ({}));if(!r.ok){throw new Error(data.error||"Request failed");}return data;}

function Spinner({size=18}){return React.createElement("span",{style:{display:"inline-block",width:size,height:size,border:"2px solid rgba(109,79,216,0.18)",borderTopColor:C.accent,borderRadius:"50%",animation:"spin 0.55s linear infinite",verticalAlign:"middle"}});}

function splitSentences(text){
  var raw=(text||"").trim();
  if(!raw) return [];
  // Split on newlines first: each non-empty line is its own unit.
  // Handles numbered lists ("1. Question?") without merging them.
  var lines=raw.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  if(lines.length>1){
    var out=[];
    for(var li=0;li<lines.length;li++){
      var line=lines[li];
      var isNumbered=/^\s*\d+[.)\]]\s/.test(line);
      if(isNumbered){ out.push(line); }
      else{ var ss=splitSentences(line); for(var si=0;si<ss.length;si++) out.push(ss[si]); }
    }
    return out;
  }
  // Single line: split on .  !  ? followed by space + uppercase letter.
  var t=raw.replace(/\s+/g," ");
  var out=[];
  var re=/([.!?]["')\]]*) +(?=[A-Z\u00C0-\u024F\u0400-\u04FF])/g;
  var last=0,m;
  while((m=re.exec(t))!==null){
    // Skip abbreviations: single uppercase letter before the dot
    var before=t.slice(0,m.index);
    if(/\b[A-Z]$/.test(before)) continue;
    out.push(t.slice(last,m.index+m[1].length).trim());
    last=m.index+m[0].length;
  }
  out.push(t.slice(last).trim());
  var result=out.filter(Boolean);
  return result.length?result:[t];
}

function alignTranslationToOriginalSentences(origSentences, translationText){
  const orig = Array.isArray(origSentences) ? origSentences : [];
  const n = orig.length;
  if(n === 0) return [];
  const t = String(translationText||"").trim();
  if(!t) return Array.from({length:n}, ()=>"");

  const transSentences = splitSentences(t);

  // If we have at least as many translation sentences as original, assign 1:1
  // and only merge leftovers into the last slot — never collapse multiple
  // originals into one cell.
  if(transSentences.length >= n){
    const out = transSentences.slice(0, n - 1);
    out.push(transSentences.slice(n - 1).join(" "));
    return out;
  }

  // Fewer translation sentences than originals: distribute by proportional length,
  // but never assign more than 1 translation sentence per original slot (leave
  // excess slots empty rather than merging).
  const origLens = orig.map(s => Math.max(1, String(s||"").replace(/\s+/g," ").trim().length));
  const totalOrig = origLens.reduce((a,b)=>a+b,0);
  const transLens = transSentences.map(s => Math.max(1, String(s||"").length));
  const totalTrans = transLens.reduce((a,b)=>a+b,0);

  const out = Array(n).fill("");
  let j = 0;
  let cumOrig = 0;
  for(let i = 0; i < n && j < transSentences.length; i++){
    cumOrig += origLens[i];
    const threshold = (cumOrig / totalOrig) * transSentences.length;
    // Assign one sentence per slot; advance j when the proportional threshold is met
    out[i] = transSentences[j];
    if(j + 1 < transSentences.length && threshold >= j + 1.5) j++;
    else j++;
  }
  return out;
}

function fmtEur(cents){
  const eur = (cents||0)/100;
  return eur.toLocaleString(undefined,{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
}

function localMonthKey(ts){
  const d = new Date(ts||Date.now());
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function localMonthLabel(ts){
  const d = new Date(ts||Date.now());
  return d.toLocaleDateString(undefined,{year:"numeric",month:"long"});
}

function formatDateTime(ts){
  if(!ts) return "—";
  return new Date(ts).toLocaleString();
}

function RevisorApp(){
  const[ready,setReady]=useState(false);
  const[authErr,setAuthErr]=useState("");
  const[me,setMe]=useState(null);
  const[allJobs,setAllJobs]=useState([]);
  const[tab,setTab]=useState("queue"); // queue | mine | finance

  const refresh=useCallback(async()=>{
    try{
      const loaded=await apiFetch("/api/revisor/jobs?scope=all");
      setAllJobs(Array.isArray(loaded)?loaded:[]);
    }catch{}
  },[]);

  useEffect(()=>{
    let cancelled=false;
    let timer=null;
    (async()=>{
      try{
        const meResp=await apiFetch("/api/auth/me",{method:"GET"});
        if(!meResp.authenticated){location.href="/login";return;}
        if(cancelled) return;
        setMe(meResp);
        setReady(true);
        refresh();
        timer=setInterval(refresh,2500);
      }catch(e){
        setAuthErr(e.message);
      }
    })();
    return ()=>{cancelled=true; if(timer) clearInterval(timer);};
  },[refresh]);

  async function logout(){
    try{await apiFetch("/api/auth/logout",{method:"POST"});}catch{}
    location.href="/login";
  }

  const updateJob=async(id,patch)=>apiFetch(`/api/revisor/jobs/${id}`,{method:"PATCH",body:JSON.stringify(patch)})
    .then(j=>{setAllJobs(prev=>prev.map(x=>x.id===id?j:x));return j;});

  async function claimJob(id){
    const j=await apiFetch(`/api/revisor/jobs/${id}/claim`,{method:"POST"});
    setAllJobs(prev=>prev.map(x=>x.id===id?j:x));
    return j;
  }

  if(authErr){
    return React.createElement("div",{style:{maxWidth:640,margin:"0 auto",padding:"60px 20px",textAlign:"center"}},
      React.createElement("div",{style:{...st.card}},React.createElement("div",{style:{fontSize:12,color:"#c43d3d"}},authErr))
    );
  }
  if(!ready||!me){
    return React.createElement("div",{style:{maxWidth:640,margin:"0 auto",padding:"60px 20px",textAlign:"center"}},
      React.createElement("div",{style:{...st.card}},React.createElement(Spinner,{size:24}),React.createElement("div",{style:{marginTop:10,fontSize:13,color:C.muted}},"Loading revisor panel…"))
    );
  }

  return React.createElement(RevisorView,{me,allJobs,tab,setTab,updateJob,claimJob,onLogout:logout});
}

function Header({me,tab,setTab,onLogout,counts}){
  const e=React.createElement;
  function tabBtn(id,label,badge){
    const active=tab===id;
    return e("button",{onClick:()=>setTab(id),style:{...st.btn,padding:"8px 14px",fontSize:13,background:active?"rgba(109,79,216,0.10)":"transparent",border:`1px solid ${active?"rgba(109,79,216,0.28)":C.border}`,color:active?C.accent:C.muted,display:"inline-flex",alignItems:"center",gap:8}},
      label,
      typeof badge==="number"&&badge>0&&e("span",{style:{fontSize:11,fontWeight:600,background:active?"rgba(109,79,216,0.14)":C.soft,borderRadius:999,padding:"1px 8px",color:active?C.accent:C.text}},badge)
    );
  }
  return e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"28px 0 24px",borderBottom:`1px solid ${C.border}`,marginBottom:28,gap:16,flexWrap:"wrap"}},
    e("div",null,
      e("div",{style:{fontFamily:"inherit",fontSize:24,fontWeight:600,color:C.text}},"Lingo",e("span",{style:{color:C.accent}},"Check")),
      e("div",{style:{fontSize:12,color:C.muted,marginTop:2}},"Revisor Panel · ",e("span",{style:{color:C.accent}},me.displayName||me.email||me.username))
    ),
    e("div",{style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
      tabBtn("queue","Queue",counts.queue),
      tabBtn("mine","My assignments",counts.mine),
      tabBtn("finance","Finance"),
      e("button",{onClick:onLogout,style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,fontSize:12,padding:"8px 14px"}},"Logout")
    )
  );
}

function QueueTab({me,allJobs,claimJob,setTab}){
  const e=React.createElement;
  const [claimingId,setClaimingId]=useState(null);
  const [err,setErr]=useState("");

  const queue=useMemo(()=>allJobs
    .filter(j=>j.status==="awaiting_review" && !j.claimedByRevisorId)
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))
  ,[allJobs]);

  async function onClaim(id){
    setErr("");
    setClaimingId(id);
    try{
      await claimJob(id);
      setTab("mine");
    }catch(ex){
      setErr(ex.message);
    }finally{
      setClaimingId(null);
    }
  }

  if(queue.length===0){
    return e("div",{style:{textAlign:"center",padding:"80px 0"}},
      e("div",{style:{fontSize:40,marginBottom:18}},"✓"),
      e("div",{style:{fontFamily:"inherit",fontSize:24,color:C.text,marginBottom:8}},"No jobs waiting"),
      e("div",{style:st.muted},"New unclaimed requests will appear here automatically"),
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginTop:18,fontSize:11,color:C.muted}},
        e("span",{style:{width:6,height:6,borderRadius:"50%",background:C.accent,display:"inline-block",animation:"pulse 1.5s ease-in-out infinite"}}),
        "Listening for new requests…"
      )
    );
  }

  return e("div",null,
    e("span",{style:st.label},"Available jobs · claim to start working"),
    err&&e("div",{style:{margin:"0 0 12px",fontSize:12,color:"#c43d3d"}},err),
    e("div",{style:{display:"grid",gridTemplateColumns:"1fr",gap:12}},
      queue.map(job=>e("div",{key:job.id,style:{...st.card,padding:18,animation:"fadeUp 0.25s ease",display:"grid",gridTemplateColumns:"1fr auto",gap:16,alignItems:"center"}},
        e("div",null,
          e("div",{style:{fontSize:13,fontWeight:600,color:C.text,marginBottom:6}},
            job.qaOnly?job.language:"EN → "+job.language,
            job.qaOnly&&e("span",{style:{marginLeft:8,fontSize:10,fontWeight:600,letterSpacing:"0.6px",textTransform:"uppercase",color:C.accent,background:"rgba(109,79,216,0.08)",border:"1px solid rgba(109,79,216,0.18)",padding:"2px 8px",borderRadius:999}},"QA only"),
            typeof job.sourceWordCount==="number"&&e("span",{style:{marginLeft:10,fontSize:11,fontWeight:500,color:C.muted}}, job.sourceWordCount," words")
          ),
          e("div",{style:{fontSize:12,color:C.muted,lineHeight:1.6,maxHeight:60,overflow:"hidden"}},(job.qaOnly?job.aiTranslation:job.originalText||"").substring(0,260),(job.qaOnly?job.aiTranslation:job.originalText||"").length>260?"…":""),
          e("div",{style:{fontSize:11,color:C.muted,marginTop:8}},"Submitted ",formatDateTime(job.createdAt))
        ),
        e("button",{onClick:()=>onClaim(job.id),disabled:claimingId===job.id,style:{...st.btn,padding:"12px 18px",background:C.accent,color:C.white,fontSize:13,whiteSpace:"nowrap"}},
          claimingId===job.id?e(React.Fragment,null,e(Spinner,{size:14})," Claiming…"):"Claim job"
        )
      ))
    )
  );
}

function ReviewEditor({selectedJob,updateJob,onDone}){
  const e=React.createElement;
  const[editedText,setEditedText]=useState(selectedJob.revisedTranslation||selectedJob.aiTranslation||"");
  const[mode,setMode]=useState("full");
  const[editedSentences,setEditedSentences]=useState([]);
  const[sending,setSending]=useState(false);
  const[isWide,setIsWide]=useState(()=>window.matchMedia && window.matchMedia("(min-width: 900px)").matches);

  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq = window.matchMedia("(min-width: 900px)");
    const onChange = () => setIsWide(!!mq.matches);
    onChange();
    if(mq.addEventListener) mq.addEventListener("change", onChange);
    else mq.addListener(onChange);
    return () => {
      if(mq.removeEventListener) mq.removeEventListener("change", onChange);
      else mq.removeListener(onChange);
    };
  },[]);

  useEffect(()=>{
    setEditedText(selectedJob.revisedTranslation||selectedJob.aiTranslation||"");
    const orig = splitSentences(selectedJob.qaOnly ? (selectedJob.aiTranslation||"") : selectedJob.originalText);
    const initial = selectedJob.qaOnly
      ? orig
      : alignTranslationToOriginalSentences(orig, selectedJob.revisedTranslation||selectedJob.aiTranslation);
    setEditedSentences(initial);
    setMode("full");
  },[selectedJob.id]);

  async function handleSend(){
    const finalText = mode==="sentences"
      ? (editedSentences||[]).map(s=>String(s||"").trim()).filter(Boolean).join(" ")
      : (editedText||"").trim();
    if(!finalText) return;
    setSending(true);
    try{
      await updateJob(selectedJob.id,{status:"complete",revisedTranslation:finalText});
      onDone&&onDone();
    }catch(ex){
      alert(ex.message);
    }finally{
      setSending(false);
    }
  }

  const paneHeight = isWide ? 420 : undefined;

  return e("div",{style:{animation:"fadeUp 0.25s ease"}},
    e("span",{style:st.label},selectedJob.qaOnly?"Proofread client translation":"Review & edit translation"),
    selectedJob.qaOnly&&e("div",{style:{background:C.amberBg,border:`1px solid ${C.amberBorder}`,borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:12,color:C.amber,lineHeight:1.55}},"This client submitted their own AI translation. There is no English source — proofread the text below."),
    e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",margin:"0 0 10px",flexWrap:"wrap",gap:10}},
      e("div",{style:{fontSize:12,color:C.muted}},"Mode:"),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{onClick:()=>setMode("full"),style:{...st.btn,background:mode==="full"?"rgba(109,79,216,0.10)":"transparent",border:`1px solid ${mode==="full"?"rgba(109,79,216,0.28)":C.border}`,color:mode==="full"?C.accent:C.muted,fontSize:12,padding:"6px 10px"}},"Full text"),
        !selectedJob.qaOnly&&e("button",{onClick:()=>setMode("sentences"),style:{...st.btn,background:mode==="sentences"?"rgba(109,79,216,0.10)":"transparent",border:`1px solid ${mode==="sentences"?"rgba(109,79,216,0.28)":C.border}`,color:mode==="sentences"?C.accent:C.muted,fontSize:12,padding:"6px 10px"}},"Sentence-by-sentence")
      )
    ),
    mode==="full"
      ?e("div",{style:{display:"grid",gridTemplateColumns:(isWide && !selectedJob.qaOnly)?"1fr 1fr":"1fr",gap:14,alignItems:"stretch",marginBottom:14}},
        !selectedJob.qaOnly&&e("div",{style:{...st.card,marginBottom:0,display:"flex",flexDirection:"column"}},
          e("div",{style:{fontSize:11,letterSpacing:"1px",textTransform:"uppercase",color:C.muted,marginBottom:8}},"Original — English"),
          e("div",{style:{fontSize:13,color:C.muted,lineHeight:1.75,whiteSpace:"pre-wrap",overflow:"auto",flex:1,maxHeight:paneHeight,paddingRight:6}},selectedJob.originalText)
        ),
        e("div",{style:{...st.card,border:"1px solid rgba(109,79,216,0.28)",marginBottom:0,display:"flex",flexDirection:"column"}},
          e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
            e("div",{style:{fontSize:11,letterSpacing:"1px",textTransform:"uppercase",color:C.light}},"Editable translation — ",selectedJob.language),
            e("div",{style:{fontSize:11,color:C.muted}},"Edit freely")
          ),
          e("textarea",{style:{...st.ta,flex:1,minHeight:paneHeight||220,height:paneHeight||"auto",resize:"vertical"},value:editedText,onChange:ev=>setEditedText(ev.target.value)})
        )
      )
      :e("div",{style:{...st.card,padding:18,marginBottom:14}},
        e("div",{style:{display:"grid",gridTemplateColumns:isWide?"1fr 1fr":"1fr",gap:12,alignItems:"start"}},
          e("div",{style:{fontSize:11,letterSpacing:"1px",textTransform:"uppercase",color:C.muted,marginBottom:isWide?0:6}},"Original — English"),
          e("div",{style:{fontSize:11,letterSpacing:"1px",textTransform:"uppercase",color:C.light,marginBottom:isWide?0:12}},"Editable — ",selectedJob.language)
        ),
        splitSentences(selectedJob.originalText).map((origSentence, idx)=>{
          const val = editedSentences[idx] ?? "";
          return e("div",{key:idx,style:{display:"grid",gridTemplateColumns:isWide?"1fr 1fr":"1fr",gap:12,marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`}},
            e("div",{style:{fontSize:13,color:C.muted,lineHeight:1.75,whiteSpace:"pre-wrap"}},origSentence),
            e("textarea",{style:{...st.ta,minHeight:90},value:val,onChange:ev=>{
              const next=[...editedSentences];
              next[idx]=ev.target.value;
              setEditedSentences(next);
            }})
          );
        })
      ),
    e("div",{style:{background:C.amberBg,border:`1px solid ${C.amberBorder}`,borderRadius:10,padding:"11px 14px",marginBottom:14,fontSize:12,color:C.amber}},"✦  Make any corrections, then send to the client."),
    e("button",{onClick:handleSend,disabled:sending,style:{...st.btn,width:"100%",padding:14,background:C.green,fontSize:15,color:C.white,display:"flex",alignItems:"center",justifyContent:"center",gap:8}},
      sending?e(React.Fragment,null,e(Spinner,{size:14})," Sending…"):"✓ Send to Client"
    )
  );
}

function MyAssignmentsTab({me,allJobs,updateJob}){
  const e=React.createElement;
  const[selectedId,setSelectedId]=useState(null);
  const[justSent,setJustSent]=useState(false);
  const[showList,setShowList]=useState(true);

  const mine=useMemo(()=>allJobs
    .filter(j=>j.claimedByRevisorId===me.revisorId || j.completedByRevisorId===me.revisorId)
    .sort((a,b)=>{
      const aActive = a.status!=="complete" ? 1 : 0;
      const bActive = b.status!=="complete" ? 1 : 0;
      if(aActive!==bActive) return bActive-aActive;
      const aTs = a.completedAt||a.claimedAt||a.createdAt||0;
      const bTs = b.completedAt||b.claimedAt||b.createdAt||0;
      return bTs-aTs;
    })
  ,[allJobs,me.revisorId]);

  useEffect(()=>{
    if(selectedId && !mine.find(j=>j.id===selectedId)) setSelectedId(null);
  },[mine,selectedId]);

  useEffect(()=>{
    if(selectedId) setShowList(false);
    else setShowList(true);
  },[selectedId]);

  const selectedJob=mine.find(j=>j.id===selectedId);

  if(mine.length===0){
    return e("div",{style:{textAlign:"center",padding:"80px 0"}},
      e("div",{style:{fontSize:40,marginBottom:18}},"📋"),
      e("div",{style:{fontFamily:"inherit",fontSize:24,color:C.text,marginBottom:8}},"No assignments yet"),
      e("div",{style:st.muted},"Claim a job from the Queue to get started.")
    );
  }

  function listItem(job){
    const isComplete=job.status==="complete";
    const isSelected=selectedId===job.id;
    return e("div",{key:job.id,onClick:()=>setSelectedId(job.id),style:{...st.card,padding:14,marginBottom:8,cursor:"pointer",border:`1px solid ${isSelected?"rgba(109,79,216,0.32)":C.border}`,background:isSelected?"rgba(109,79,216,0.06)":undefined,transition:"border-color 0.12s, background 0.12s",animation:"fadeUp 0.25s ease"}},
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:6}},
        e("div",{style:{fontSize:13,fontWeight:600,color:C.text,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
          job.qaOnly?job.language:"EN → "+job.language,
          job.qaOnly&&e("span",{style:{fontSize:10,fontWeight:600,letterSpacing:"0.6px",textTransform:"uppercase",color:C.accent,background:"rgba(109,79,216,0.08)",border:"1px solid rgba(109,79,216,0.18)",padding:"2px 8px",borderRadius:999}},"QA only")
        ),
        e("span",{style:{fontSize:10,fontWeight:600,letterSpacing:"0.6px",textTransform:"uppercase",padding:"3px 8px",borderRadius:999,background:isComplete?C.greenBg:C.amberBg,border:`1px solid ${isComplete?C.greenBorder:C.amberBorder}`,color:isComplete?C.green:C.amber}},isComplete?"Completed":"In progress")
      ),
      e("div",{style:{fontSize:12,color:C.muted,marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},(job.qaOnly?job.aiTranslation:job.originalText||"").substring(0,60),"…"),
      e("div",{style:{fontSize:11,color:C.muted}},
        typeof job.sourceWordCount==="number"?job.sourceWordCount+" words · ":"",
        isComplete?("Completed "+formatDateTime(job.completedAt)):("Claimed "+formatDateTime(job.claimedAt))
      )
    );
  }

  return e("div",{style:{display:"grid",gridTemplateColumns:(selectedJob&&!showList)?"1fr":(selectedJob?"260px 1fr":"1fr"),gap:16,alignItems:"start"}},
    (showList||!selectedJob)&&e("div",null,
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
        e("span",{style:st.label},"My assignments"),
        selectedJob&&e("button",{onClick:()=>setShowList(false),title:"Hide list",style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,fontSize:11,padding:"4px 10px"}},"Hide")
      ),
      mine.map(listItem)
    ),
    selectedJob&&!showList&&e("div",{style:{marginBottom:8}},
      e("button",{onClick:()=>{setSelectedId(null);setShowList(true);},style:{...st.btn,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,fontSize:12,padding:"6px 12px",marginBottom:12}},"← Back to list")
    ),
    selectedJob
      ? e("div",null,
          justSent&&selectedJob.status==="complete"&&e("div",{style:{background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:10,padding:"12px 16px",marginBottom:14,fontSize:13,color:C.green,animation:"fadeUp 0.25s ease"}},"✅ Translation sent to client successfully."),
          selectedJob.status==="complete"
            ? e("div",{style:{...st.card}},
                e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
                  e("div",{style:{fontFamily:"inherit",fontSize:22,color:C.text}},"Completed assignment"),
                  e("span",{style:{fontSize:11,fontWeight:600,padding:"4px 10px",borderRadius:999,background:C.greenBg,border:`1px solid ${C.greenBorder}`,color:C.green}},"DELIVERED")
                ),
                e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}},
                  e("div",null,e("div",{style:{fontSize:11,color:C.muted,letterSpacing:"1px",textTransform:"uppercase"}},"Language"),e("div",{style:{fontSize:14,color:C.text,marginTop:4}}, selectedJob.qaOnly?selectedJob.language:"EN → "+selectedJob.language)),
                  e("div",null,e("div",{style:{fontSize:11,color:C.muted,letterSpacing:"1px",textTransform:"uppercase"}},"Words"),e("div",{style:{fontSize:14,color:C.text,marginTop:4}}, selectedJob.sourceWordCount||0)),
                  e("div",null,e("div",{style:{fontSize:11,color:C.muted,letterSpacing:"1px",textTransform:"uppercase"}},"Claimed"),e("div",{style:{fontSize:14,color:C.text,marginTop:4}}, formatDateTime(selectedJob.claimedAt))),
                  e("div",null,e("div",{style:{fontSize:11,color:C.muted,letterSpacing:"1px",textTransform:"uppercase"}},"Completed"),e("div",{style:{fontSize:14,color:C.text,marginTop:4}}, formatDateTime(selectedJob.completedAt)))
                ),
                e("div",{style:{display:"grid",gridTemplateColumns:selectedJob.qaOnly?"1fr":"1fr 1fr",gap:14}},
                  !selectedJob.qaOnly&&e("div",null,
                    e("div",{style:{fontSize:11,color:C.muted,letterSpacing:"1px",textTransform:"uppercase",marginBottom:8}},"Original"),
                    e("div",{style:{fontSize:13,color:C.muted,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:300,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}},selectedJob.originalText)
                  ),
                  e("div",null,
                    e("div",{style:{fontSize:11,color:C.light,letterSpacing:"1px",textTransform:"uppercase",marginBottom:8}},selectedJob.qaOnly?"Proofread translation":"Final translation"),
                    e("div",{style:{fontSize:13,color:C.text,lineHeight:1.75,whiteSpace:"pre-wrap",maxHeight:300,overflow:"auto",padding:12,border:`1px solid ${C.border}`,borderRadius:10,background:C.soft}}, selectedJob.revisedTranslation||"")
                  )
                )
              )
            : e(ReviewEditor,{selectedJob,updateJob,onDone:()=>{setJustSent(true); setTimeout(()=>setJustSent(false),3500);}})
        )
      : (!showList && e("div",{style:st.muted},"Select an assignment to open it."))
  );
}

function FinanceTab({me,allJobs}){
  const e=React.createElement;
  const RATE = 2.5;

  const completed = useMemo(()=>allJobs
    .filter(j=>j.completedByRevisorId===me.revisorId && j.status==="complete")
    .sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))
  ,[allJobs,me.revisorId]);

  const items = useMemo(()=>completed.map(j=>{
    const words = typeof j.sourceWordCount==="number" ? j.sourceWordCount : 0;
    const earningsCents = Math.round(words * RATE);
    return {id:j.id,language:j.language,completedAt:j.completedAt||j.createdAt,sourceWordCount:words,earningsCents};
  }),[completed]);

  const totalCents = items.reduce((a,b)=>a+b.earningsCents,0);
  const totalWords = items.reduce((a,b)=>a+b.sourceWordCount,0);

  const nowKey = localMonthKey(Date.now());
  const monthGroups = useMemo(()=>{
    const map = new Map();
    for(const it of items){
      const key = localMonthKey(it.completedAt);
      const label = localMonthLabel(it.completedAt);
      const cur = map.get(key) || {key,label,items:[],cents:0,words:0};
      cur.items.push(it);
      cur.cents += it.earningsCents;
      cur.words += it.sourceWordCount;
      map.set(key, cur);
    }
    const arr = Array.from(map.values());
    arr.sort((a,b)=> b.key.localeCompare(a.key));
    return arr;
  },[items]);

  const thisMonth = monthGroups.find(g=>g.key===nowKey) || {cents:0,words:0,items:[]};

  function statCard(label,value,sub){
    return e("div",{style:{...st.card,padding:20}},
      e("div",{style:{fontSize:11,color:C.muted,letterSpacing:"1.2px",textTransform:"uppercase",marginBottom:8}},label),
      e("div",{style:{fontSize:28,fontFamily:"inherit",color:C.text}},value),
      sub&&e("div",{style:{fontSize:12,color:C.muted,marginTop:4}},sub)
    );
  }

  return e("div",null,
    e("span",{style:st.label},"Finance overview"),
    e("div",{style:{fontSize:12,color:C.muted,marginBottom:14}},"Earnings are calculated at ", e("strong",{style:{color:C.pale}}, "€0.025"), " per source word of completed translations."),
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(200px, 1fr))",gap:14,marginBottom:20}},
      statCard("This month", fmtEur(thisMonth.cents), thisMonth.words+" words · "+(thisMonth.items?.length||0)+" jobs"),
      statCard("All time", fmtEur(totalCents), totalWords+" words · "+items.length+" jobs"),
      statCard("Rate", "€0.025 / word", "Per source word")
    ),

    monthGroups.length===0
      ? e("div",{style:{...st.card,textAlign:"center",padding:40,color:C.muted,fontSize:13}},"No completed assignments yet — finish a job to see earnings here.")
      : e("div",{style:{display:"flex",flexDirection:"column",gap:14}},
          monthGroups.map(g=>e("div",{key:g.key,style:{...st.card,padding:0,overflow:"hidden"}},
            e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px",borderBottom:`1px solid ${C.border}`,background:C.soft}},
              e("div",null,
                e("div",{style:{fontFamily:"inherit",fontSize:18,color:C.text}},g.label),
                e("div",{style:{fontSize:11,color:C.muted,marginTop:2}},g.items.length," job",g.items.length===1?"":"s"," · ",g.words," words")
              ),
              e("div",{style:{fontFamily:"inherit",fontSize:22,color:C.pale}}, fmtEur(g.cents))
            ),
            e("div",{style:{padding:"4px 0"}},
              g.items.map((it,i)=>e("div",{key:it.id,style:{display:"grid",gridTemplateColumns:"1fr 120px 100px 110px",gap:8,padding:"10px 20px",borderTop:i===0?"none":`1px solid ${C.border}`,fontSize:13,alignItems:"center"}},
                e("div",{style:{color:C.text}},"EN → ",it.language),
                e("div",{style:{color:C.muted,fontSize:12}}, it.sourceWordCount," words"),
                e("div",{style:{color:C.muted,fontSize:12}}, new Date(it.completedAt).toLocaleDateString()),
                e("div",{style:{color:C.pale,textAlign:"right",fontWeight:600}}, fmtEur(it.earningsCents))
              ))
            )
          ))
        )
  );
}

function RevisorView({me,allJobs,tab,setTab,updateJob,claimJob,onLogout}){
  const e=React.createElement;

  const counts = {
    queue: allJobs.filter(j=>j.status==="awaiting_review" && !j.claimedByRevisorId).length,
    mine: allJobs.filter(j=>(j.claimedByRevisorId===me.revisorId || j.completedByRevisorId===me.revisorId) && j.status!=="complete").length
  };

  return e("div",{style:{maxWidth:1280,margin:"0 auto",padding:"0 20px"}},
    e(Header,{me,tab,setTab,onLogout,counts}),
    tab==="queue" && e(QueueTab,{me,allJobs,claimJob,setTab}),
    tab==="mine" && e(MyAssignmentsTab,{me,allJobs,updateJob}),
    tab==="finance" && e(FinanceTab,{me,allJobs})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(RevisorApp));
</script>
